    return '<div class="field" style="flex:1;"><label>'+label+' column</label><select data-csv-map="'+field+'">'+
      '<option value="-1">— not present —</option>'+
      csvImportHeaders.map(function(h,i){ return '<option value="'+i+'"'+(csvImportMap[field]===i?' selected':'')+'>'+esc(h||'(column '+(i+1)+')')+'</option>'; }).join('')+
    '</select></div>';
  }
  mapEl.innerHTML = '<div class="hstack" style="gap:10px; flex-wrap:wrap; margin-top:10px;">'+
      colSelect('date','Date')+ colSelect('merchant','Merchant / description')+ colSelect('amount','Amount')+
    '</div>'+
    '<div class="hstack" style="gap:8px; margin-top:10px;"><button class="btn btn-primary" id="csv-preview-btn">Preview rows</button><button class="btn btn-ghost" id="csv-mapping-cancel-btn" type="button">Cancel</button></div>'+
    '<div id="csv-review"></div>';
  Array.prototype.forEach.call(mapEl.querySelectorAll('[data-csv-map]'), function(sel){
    sel.addEventListener('change', function(){
      csvImportMap[sel.getAttribute('data-csv-map')] = parseInt(sel.value);
      if (sel.getAttribute('data-csv-map')==='amount') autoDetectAmountSignMode();
    });
  });
  var btn = document.getElementById('csv-preview-btn');
  if (btn) btn.addEventListener('click', renderCSVReview);
  var mappingCancelBtn = document.getElementById('csv-mapping-cancel-btn');
  if (mappingCancelBtn) mappingCancelBtn.addEventListener('click', cancelImportFlow);
}
function normalizeCSVDate(raw){
  raw = String(raw||'').trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
  var m = raw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/); // M/D/YYYY or M-D-YY, the common US bank-export shape
  if (m){
    var mo = parseInt(m[1]), d = parseInt(m[2]), y = parseInt(m[3]); if (y<100) y += 2000;
    return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  }
  return state.today;
}
var csvReviewRows = [];
function renderCSVReview(){
  if (csvImportMap.date<0 || csvImportMap.merchant<0 || csvImportMap.amount<0){
    var statusEl = document.getElementById('csv-status');
    if (statusEl) statusEl.textContent = 'Pick a column for date, merchant, and amount before previewing.';
    return;
  }
  csvReviewRows = csvImportRows.slice(0,200).map(function(r,i){
    var rawAmt = String(r[csvImportMap.amount]||'').replace(/[$,]/g,'').trim();
    var amt = parseFloat(rawAmt);
    var merchant = String(r[csvImportMap.merchant]||'Unknown').trim() || 'Unknown';
    var isIncome = isIncomeForAmount(amt);
    var isCardPayment = isLikelyCardPaymentRow(merchant);
    var guess = isCardPayment ? {category:'Debt Payment', estimated:false} : guessCategoryForMerchant(merchant, isIncome);
    return {
      id:'c'+i, date: normalizeCSVDate(r[csvImportMap.date]), merchant: merchant,
      amount: Math.abs(amt)||0, type: isIncome ? 'income' : 'variable', category: guess.category, estimated: guess.estimated,
      isCardPayment: isCardPayment, checked: !isNaN(amt) && amt!==0 && !isCardPayment
    };
  }).filter(function(r){ return r.amount>0; });
  renderCSVReviewDOM();
}
// Re-renders the review list from whatever csvReviewRows CURRENTLY holds, without recomputing categories
// from the raw import data — used after a manual category pick (with same-merchant propagation) so that
// edit isn't silently thrown away and replaced with a fresh guess the next time the list redraws.
function renderCSVReviewDOM(){
  var reviewEl = document.getElementById('csv-review');
  if (!reviewEl) return;
  var estimatedCount = csvReviewRows.filter(function(t){ return t.estimated; }).length;
  var cardPaymentCount = csvReviewRows.filter(function(t){ return t.isCardPayment; }).length;
  reviewEl.innerHTML = '<div class="faint" style="margin:10px 0 4px;">'+csvReviewRows.length+' transaction'+(csvReviewRows.length===1?'':'s')+' ready — uncheck any you don’t want, fix a category, then import.'+
      (estimatedCount ? ' Categories marked <strong style="color:var(--ink);">Estimated</strong> are a best guess from your past transactions — check them and adjust if wrong.' : '')+
      (cardPaymentCount ? ' Rows marked <strong style="color:var(--ink);">Card payment</strong> look like paying down a balance, not new spending — left unchecked so they aren’t double-counted with the purchases they cover.' : '')+
    '</div>'+
    '<div class="stack" style="gap:0; max-height:420px; overflow-y:auto;">' + csvReviewRows.map(function(t){
      return '<div class="hstack" style="justify-content:space-between; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);">'+
        '<input type="checkbox" data-csv-check="'+t.id+'" '+(t.checked?'checked':'')+' style="margin-top:3px; flex:none; width:16px; height:16px;">'+
        '<span style="flex:1; min-width:0;"><span style="font-weight:600;">'+esc(t.merchant)+'</span> <span class="faint">'+t.date+'</span>'+
          '<span data-csv-est-note="'+t.id+'" class="faint" style="display:'+(t.estimated?'inline':'none')+'; font-size:10.5px; color:var(--accent-strong); margin-left:6px;">Estimated — adjust if wrong</span>'+
          (t.isCardPayment ? '<span data-csv-cardpay-note="'+t.id+'" class="faint" style="display:inline; font-size:10.5px; color:var(--negative); margin-left:6px;">Card payment — not counted as a transaction</span>' : '')+
          '<div style="max-width:220px; margin-top:4px;">'+categoryPickerHtml('data-csv-cat', t.id, t.category)+'</div></span>'+
        '<span class="num" style="flex:none; padding-top:3px; color:'+(t.type==='income'?'var(--positive)':'var(--ink)')+';">'+(t.type==='income'?'+ ':'– ')+usd2(t.amount)+'</span>'+
      '</div>';
    }).join('') +
    '</div>'+
    '<div class="hstack" style="gap:8px; margin-top:10px;"><button class="btn btn-primary" id="csv-import-btn">Import selected transactions</button><button class="btn btn-ghost" id="csv-review-cancel-btn" type="button">Cancel</button></div>';
  Array.prototype.forEach.call(reviewEl.querySelectorAll('[data-csv-check]'), function(cb){
    cb.addEventListener('change', function(){ var r = csvReviewRows.find(function(x){ return x.id===cb.getAttribute('data-csv-check'); }); if (r) r.checked = cb.checked; });
  });
  wireCategoryPickers(reviewEl, function(id, category){
    var r = csvReviewRows.find(function(x){ return x.id===id; });
    if (!r) return;
    r.category = category || 'Other';
    r.estimated = false; // once the user has touched it, it's confirmed, not a guess anymore
    // Fixing one row's category almost always means every OTHER row from that same merchant in this
    // import belongs there too — a shop doesn't sell groceries on one line and something else on the
    // next — so re-categorizing one row auto-applies the same category to every other row here that
    // shares its merchant, instead of making the user repeat the same click line by line.
    var key = normalizeMerchantKey(r.merchant);
    var propagated = 0;
    if (key) csvReviewRows.forEach(function(other){
      if (other.id===r.id || normalizeMerchantKey(other.merchant)!==key) return;
      if (other.category!==r.category || other.estimated){ other.category = r.category; other.estimated = false; propagated++; }
    });
    if (propagated){ renderCSVReviewDOM(); return; }
    var note = reviewEl.querySelector('[data-csv-est-note="'+r.id+'"]');
    if (note) note.style.display = 'none';
  });
  var importBtn = document.getElementById('csv-import-btn');
  if (importBtn) importBtn.addEventListener('click', function(){
    var toAdd = csvReviewRows.filter(function(t){ return t.checked; });
    toAdd.forEach(function(t){
      state.transactions.push({id:'t'+Date.now()+Math.random().toString(36).slice(2,7), date:t.date, merchant:t.merchant, category:t.category, amount:t.amount, type:t.type, account:'acc-checking', auto:true});
    });
    csvImportRows = []; csvImportHeaders = []; csvReviewRows = [];
    persist(); toast('Imported '+toAdd.length+' transaction'+(toAdd.length===1?'':'s')+' from CSV'); route();
  });
  var reviewCancelBtn = document.getElementById('csv-review-cancel-btn');
  if (reviewCancelBtn) reviewCancelBtn.addEventListener('click', cancelImportFlow);
}

/* ============================================================
   PDF STATEMENT IMPORT — also fully client-side (via pdf.js, loaded from a CDN
   in the page head). A PDF has no columns to begin with, so this reconstructs
   visual lines from each page's positioned text, then heuristically pulls a
   date/description/amount out of any line that looks like a transaction —
   then feeds the result into the SAME csvImportRows/csvImportHeaders/csvImportMap
   shape the CSV pipeline uses, so the existing mapping/review/import UI just works.
   ============================================================ */
function pdfLinesFromTextContent(textContent){
  var items = textContent.items.map(function(item){
    return { x: item.transform[4], y: item.transform[5], str: item.str };
  }).filter(function(it){ return it.str && it.str.trim()!==''; });
  items.sort(function(a,b){ return b.y-a.y || a.x-b.x; }); // top-to-bottom (PDF y grows upward), then left-to-right
  var lines = [], current = null, lastY = null;
  items.forEach(function(it){
    if (current===null || Math.abs(it.y-lastY) > 3){
      current = []; lines.push(current); lastY = it.y;
    }
    current.push(it);
  });
  return lines.map(function(group){
    group.sort(function(a,b){ return a.x-b.x; });
    return group.map(function(it){ return it.str; }).join(' ').replace(/\s+/g,' ').trim();
  }).filter(function(l){ return l.length>0; });
}
function extractStatementRowsFromLines(lines){
  var dateRe = /(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}|\d{4}-\d{2}-\d{2}|(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2}(?:,?\s*\d{2,4})?)/i;
  var amtRe = /(\(?-?\$?\s?[\d,]+\.\d{2}\)?)\s*(cr|dr)?\s*$/i;
  var rows = [];
  lines.forEach(function(line){
    var dm = line.match(dateRe);
    var am = line.match(amtRe);
    if (!dm || !am) return;
    var negative = /^\(.*\)$/.test(am[1]) || /^-/.test(am[1].trim());
    var amtStr = am[1].replace(/[()$,\s-]/g,'');
    var amt = parseFloat(amtStr);
    if (isNaN(amt) || amt===0) return;
    if (negative) amt = -amt;
    var desc = line.slice(0, am.index).replace(dm[0],'').replace(/\s+/g,' ').trim().replace(/^[-–,\s]+|[-–,\s]+$/g,'');
    if (!desc) desc = 'Unknown';
    rows.push([dm[0], desc, String(amt)]);
  });
  return rows;
}
// pdf.js is loaded as an ES module (see template.html — modern cdnjs pdf.js only ships .mjs builds,
// no classic global script), so it's assigned onto window.pdfjsLib once the module finishes importing,
// which can happen slightly after this app's own script runs. Same wait-for-event-or-timeout pattern
// as initAuth()'s Supabase SDK wait, just triggered on demand (when the user clicks "Read PDF")
// instead of on page load.
function waitForPdfJs(cb){
  if (window.pdfjsLib){ cb(); return; }
  var done = false;
  function finish(){ if (done) return; done = true; cb(); }
  window.addEventListener('pdfjs-ready', finish, {once:true});
  setTimeout(finish, 6000); // second line of defense in case the module script never runs at all
}
function handlePDFFile(){
  var fileInput = document.getElementById('pdf-file');
  var statusEl = document.getElementById('csv-status');
  if (!fileInput || !fileInput.files || !fileInput.files.length){ if(statusEl) statusEl.textContent = 'Choose a PDF statement first.'; return; }
  if (statusEl) statusEl.textContent = 'Reading PDF…';
  waitForPdfJs(function(){
    if (typeof window.pdfjsLib === 'undefined'){
      if (statusEl) statusEl.textContent = 'PDF reading couldn’t load (no connection, or it’s blocked) — try again, or use a CSV export from your bank instead.';
      return;
    }
    var reader = new FileReader();
    reader.onload = function(){
      var typedArray = new Uint8Array(reader.result);
      window.pdfjsLib.getDocument({ data: typedArray }).promise.then(function(pdf){
        var pagePromises = [];
        for (var p=1; p<=pdf.numPages; p++){
          pagePromises.push(pdf.getPage(p).then(function(page){ return page.getTextContent(); }).then(pdfLinesFromTextContent));
        }
        return Promise.all(pagePromises);
      }).then(function(pagesLines){
        var allLines = [].concat.apply([], pagesLines);
        var rows = extractStatementRowsFromLines(allLines);
        if (!rows.length){
          if (statusEl) statusEl.textContent = 'Couldn’t find any transaction-looking lines in that PDF — statement layouts vary a lot (and a scanned/image PDF can’t be read this way at all). A CSV export from your bank will always work more reliably.';
          return;
        }
        csvImportHeaders = ['Date','Description','Amount'];
        csvImportRows = rows;
        csvImportMap = { date:0, merchant:1, amount:2 };
        autoDetectAmountSignMode();
        if (statusEl) statusEl.textContent = 'Found '+rows.length+' possible transaction'+(rows.length===1?'':'s')+' in the PDF — statement text can be messy, so double-check these carefully, then confirm the columns below:';
        renderCSVMapping();
      }).catch(function(){
        if (statusEl) statusEl.textContent = 'Couldn’t read that PDF — it may be a scanned image rather than real text, which can’t be parsed this way.';
      });
    };
    reader.onerror = function(){ if(statusEl) statusEl.textContent = 'Couldn’t read that file — try again.'; };
    reader.readAsArrayBuffer(fileInput.files[0]);
  });
}

/* ============================================================
   CHARTS (Chart.js)
   ============================================================ */
// Categorical colors validated with the dataviz skill's CVD/contrast checker (validate_palette.js) — the app's own
// muted brand tones (navy/teal/plum/stone) read great as text and small dots but measured too low in chroma and too
// close in hue to survive as chart data marks (several adjacent pairs failed colorblind-separation outright). So
// charts use this separately-validated, higher-chroma set for identity, while every other pill/dot in the app keeps
// the quieter brand palette. Fixed order — never reassigned per render — is itself the CVD-safety mechanism.
var CHART_CAT_COLORS = {
  'Bills':            { light:'#2a78d6', dark:'#3987e5' },
  'Groceries':        { light:'#eb6834', dark:'#d95926' },
  'Dining Out':       { light:'#1baf7a', dark:'#199e70' },
  'Transportation':   { light:'#eda100', dark:'#c98500' },
  'Other Variable':   { light:'#e87ba4', dark:'#d55181' },
  'Savings':          { light:'#008300', dark:'#008300' },
  'Debt Payments':    { light:'#4a3aa7', dark:'#9085e9' }
};
function isDarkMode(){
  var t = document.documentElement.getAttribute('data-theme');
  if (t==='dark') return true;
  if (t==='light') return false;
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function hexToRgba(hex, alpha){
  hex = (hex||'').replace('#','');
  if (hex.length===3) hex = hex.split('').map(function(c){ return c+c; }).join('');
  var n = parseInt(hex,16);
  if (isNaN(n) || hex.length!==6) return 'rgba(0,0,0,'+alpha+')';
  var r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}
function catChartColor(name){
  var c = CHART_CAT_COLORS[name];
  if (!c) return isDarkMode() ? '#8a93a3' : '#9aa3b0';
  return isDarkMode() ? c.dark : c.light;
}
function chartLegendHtml(items){
  // items: [{label, color, value, pct}] — real HTML legend instead of a canvas-drawn one, so text stays crisp
  // and the value (and, when given, its % share of the whole) sits right next to the swatch instead of
  // forcing a hover over the chart to find it out.
  return items.map(function(it){
    var rightHtml = '';
    if (it.value!=null || it.pct!=null){
      rightHtml = '<span class="lg-right">'+
        (it.value!=null ? '<span class="lg-val">'+usd0(it.value)+'</span>' : '')+
        (it.pct!=null ? '<span class="lg-pct">'+Math.round(it.pct)+'%</span>' : '')+
      '</span>';
    }
    return '<div class="chart-legend-item">'+
      '<span class="lg-name"><span class="swatch" style="background:'+it.color+'"></span><span class="lg-name-text">'+esc(it.label)+'</span></span>'+
      rightHtml+
    '</div>';
  }).join('');
}
// last 5 real calendar months ending at state.month, for chart x-axes that used to show meaningless "M0, M1, M2..." ticks
function trailingMonthLabels(n, ym){
  var p = parseYM(ym), out = [];
  for (var i=n-1; i>=0; i--){ var d = new Date(p.y, p.m-i, 1); out.push(d.toLocaleDateString('en-US',{month:'short'})); }
  return out;
}
function futureMonthLabels(n, ym){
  var p = parseYM(ym), out = [];
  for (var i=0; i<n; i++){ var d = new Date(p.y, p.m+i, 1); out.push(d.toLocaleDateString('en-US',{month:'short',year:'2-digit'})); }
  return out;
}
// pointRadius/pointBackgroundColor arrays that keep a line clean everywhere except a single emphasized end marker —
// per the dataviz skill's "emphasized endpoint" guidance, instead of either no points at all or a dot on every one.
function endpointStyle(n, color, emphasizedRadius){
  var radii = [], colors = [];
  for (var i=0;i<n;i++){ radii.push(i===n-1?(emphasizedRadius||5):0); colors.push(color); }
  return { pointRadius:radii, pointHoverRadius: radii.map(function(r){ return r?r+1:3; }), pointBackgroundColor:colors };
}
function paintCharts(view){
  if (typeof Chart === 'undefined') return;
  var ink = cssVar('--ink') || '#1C2430';
  var inkSoft = cssVar('--ink-soft') || '#5E6774';
  var inkFaint = cssVar('--ink-faint') || '#8B8F98';
  var line = cssVar('--line') || '#DEDAD0';
  var surface = cssVar('--surface') || '#FFFFFF';
  var positive = cssVar('--positive') || '#2F7D5B';
  var navy = cssVar('--navy') || '#2F4157';
  var negative = cssVar('--negative') || '#9C3B34';
  var accent = cssVar('--accent') || '#A8792E';
  Chart.defaults.font.family = "'Public Sans', sans-serif";
  Chart.defaults.color = inkSoft;
  Chart.defaults.borderColor = line;
  // one themed tooltip look for every chart: matches the app's own card styling (surface/line/ink tokens)
  // instead of Chart.js's default near-black box, and every callback below formats real currency, not raw floats.
  Chart.defaults.plugins.tooltip.enabled = true;
  Chart.defaults.plugins.tooltip.backgroundColor = surface;
  Chart.defaults.plugins.tooltip.titleColor = ink;
  Chart.defaults.plugins.tooltip.bodyColor = inkSoft;
  Chart.defaults.plugins.tooltip.borderColor = line;
  Chart.defaults.plugins.tooltip.borderWidth = 1;
  Chart.defaults.plugins.tooltip.cornerRadius = 8;
  Chart.defaults.plugins.tooltip.padding = 10;
  Chart.defaults.plugins.tooltip.boxPadding = 5;
  Chart.defaults.plugins.tooltip.titleFont = { family:"'Public Sans', sans-serif", weight:'600', size:12.5 };
  Chart.defaults.plugins.tooltip.bodyFont = { family:"'IBM Plex Mono', monospace", size:12 };
  var dashedGrid = { color:line, drawTicks:false, borderDash:[3,4] };
  var moneyTick = { callback:function(v){ return '$'+(Math.abs(v)>=1000?(v/1000).toFixed(v%1000?1:0)+'k':v); } };

  if (view==='overview' || view==='budget'){
    var el = document.getElementById('chart-incomeexp');
    if (el){
      killChart('incomeexp');
      var trendHist = computeMonthlyHistory(trendRangeKey);
      var savedSeries = trendHist.income.map(function(v,i){ return v - trendHist.expenses[i]; });
      chartInstances.incomeexp = new Chart(el, { data:{
        labels: trendHist.labels,
        datasets:[
          {type:'bar', label:'Income', data: trendHist.income, backgroundColor:positive, borderRadius:4, maxBarThickness:22, order:2},
          {type:'bar', label:'Expenses', data: trendHist.expenses, backgroundColor:navy, borderRadius:4, maxBarThickness:22, order:2},
          Object.assign({type:'line', label:'Saved', data: savedSeries, borderColor:accent, backgroundColor:hexToRgba(accent,0.12), fill:false, tension:0.3, borderWidth:2, order:1, yAxisID:'y'}, endpointStyle(savedSeries.length, accent, 3))
        ]},
        options:{ responsive:true, maintainAspectRatio:false,
          interaction:{ mode:'index', intersect:false },
          plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(ctx){ return ' '+ctx.dataset.label+': '+usd0(ctx.parsed.y); } } } },
          scales:{ y:{ grid:dashedGrid, ticks:moneyTick, border:{display:false} }, x:{ grid:{display:false}, border:{display:false} } } }
      });
      var legendEl = document.getElementById('legend-incomeexp');
      if (legendEl) legendEl.innerHTML = chartLegendHtml([
        {label:'Income', color:positive}, {label:'Expenses', color:navy}, {label:'Saved', color:accent}
      ]);
    }
    var el2 = document.getElementById('chart-breakdown');
    if (el2){
      killChart('breakdown');
      var groc = state.variable.find(function(v){return v.name==='Groceries';});
      var dine = state.variable.find(function(v){return v.name==='Dining Out';});
      var trans = state.variable.find(function(v){return v.name==='Transportation';});
      var otherVar = variableBudgetTotal() - (groc?groc.budgeted:0) - (dine?dine.budgeted:0) - (trans?trans.budgeted:0);
      var labels = ['Bills','Groceries','Dining Out','Transportation','Other Variable','Debt Payments','Savings'];
      var data = [billsBudgetTotal(), groc?groc.budgeted:0, dine?dine.budgeted:0, trans?trans.budgeted:0, otherVar, debtMinTotal(), savingsMonthlyTotal()];
      var colors = labels.map(catChartColor);
      var total = data.reduce(function(s,v){return s+v;},0);
      chartInstances.breakdown = new Chart(el2, { type:'doughnut', data:{ labels:labels, datasets:[{data:data, backgroundColor:colors, borderColor:surface, borderWidth:2, hoverOffset:4}] },
        options:{ responsive:true, maintainAspectRatio:false, cutout:'68%',
          plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(ctx){ var pct = total? Math.round(ctx.parsed/total*100) : 0; return ' '+ctx.label+': '+usd0(ctx.parsed)+' ('+pct+'%)'; } } } } } });
      var centerEl = document.getElementById('breakdown-center');
      if (centerEl) centerEl.innerHTML = '<div class="dc-value">'+usd0(total)+'</div><div class="dc-label">planned / mo</div>';
      var legendEl2 = document.getElementById('legend-breakdown');
      if (legendEl2) legendEl2.innerHTML = chartLegendHtml(labels.map(function(l,i){ return {label:l, color:colors[i], value:data[i], pct: total? (data[i]/total*100) : 0}; }));
    }
    var elWF = document.getElementById('chart-waterfall');
    if (elWF){
      killChart('waterfall');
      var wfYm = state.month;
      var wfIncome = typeSpentForMonth(wfYm,'income');
      var wfRunning = wfIncome;
      // Every category used to get its own distinct hue (rainbow-ish and hard to read as one flow at a
      // glance) — now every step that's money LEAVING is a shade of the same red, so the eye reads
      // "green in, shades of red out, green (or red) left over" instead of decoding six unrelated colors.
      var wfSpendShades = [negative, hexToRgba(negative,0.78), hexToRgba(negative,0.58), hexToRgba(negative,0.4)];
      var wfSteps = [ {name:'Income', range:[0, wfIncome], amount:wfIncome, color:positive} ];
      function wfDrop(name, amt, color){
        var from = wfRunning - amt;
        wfSteps.push({name:name, range:[from, wfRunning], amount:-amt, color:color});
        wfRunning = from;
      }
      wfDrop('Bills', typeSpentForMonth(wfYm,'bill'), wfSpendShades[0]);
      wfDrop('Variable', typeSpentForMonth(wfYm,'variable'), wfSpendShades[1]);
      wfDrop('Debt', typeSpentForMonth(wfYm,'debt'), wfSpendShades[2]);
      wfDrop('Savings', typeSpentForMonth(wfYm,'savings'), wfSpendShades[3]);
      var wfLeftoverColor = wfRunning>=0 ? positive : negative;
      wfSteps.push({name:'Left over', range:[0, wfRunning], amount:wfRunning, color:wfLeftoverColor});
      // Draws each step's signed $ amount just above its bar — a floating bar chart alone doesn't say
      // "this step is -$X" without either this or a lot of extra hovering, and the whole point of a
      // waterfall is reading the flow at a glance.
      var waterfallLabelPlugin = {
        id:'waterfallLabels',
        afterDatasetsDraw: function(chart){
          var ctx = chart.ctx, meta = chart.getDatasetMeta(0);
          ctx.save();
          ctx.font = "600 11px 'IBM Plex Mono', monospace";
          ctx.fillStyle = ink;
          ctx.textAlign = 'center';
          meta.data.forEach(function(bar, i){
            var s = wfSteps[i];
            var text = (s.amount>=0?'+':'−')+usd0(Math.abs(s.amount));
            var topY = Math.min(bar.y, bar.base) - 8;
            ctx.fillText(text, bar.x, topY);
          });
          ctx.restore();
        }
      };
      chartInstances.waterfall = new Chart(elWF, { type:'bar', data:{
        labels: wfSteps.map(function(s){ return s.name; }),
        datasets:[{ data: wfSteps.map(function(s){ return s.range; }), backgroundColor: wfSteps.map(function(s){ return s.color; }), borderRadius:4, maxBarThickness:64 }]
      }, options:{ responsive:true, maintainAspectRatio:false,
        layout:{ padding:{ top:22 } },
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{
          title:function(items){ return wfSteps[items[0].dataIndex].name; },
          label:function(ctx){ var s = wfSteps[ctx.dataIndex]; return ' '+(s.amount>=0?'+':'−')+usd0(Math.abs(s.amount)); }
        } } },
        scales:{ y:{ grid:dashedGrid, ticks:moneyTick, border:{display:false} }, x:{ grid:{display:false}, border:{display:false} } } },
      plugins:[waterfallLabelPlugin] });
      var legendWF = document.getElementById('legend-waterfall');
      if (legendWF) legendWF.innerHTML = chartLegendHtml([
        {label:'Income', color:positive}, {label:'Bills', color:wfSpendShades[0]}, {label:'Variable expenses', color:wfSpendShades[1]},
        {label:'Debt payments', color:wfSpendShades[2]}, {label:'Savings', color:wfSpendShades[3]}, {label:'Left over', color:wfLeftoverColor}
      ]);
    }
    var elBA = document.getElementById('chart-budgetactual');
    if (elBA){
      killChart('budgetactual');
      var baYm = state.month;
      var baRows = [ {name:'Bills', budgeted: billsBudgetTotal(), actual: typeSpentForMonth(baYm,'bill'), color: catChartColor('Bills')} ];
      state.variable.forEach(function(v){
        baRows.push({name:v.name, budgeted:v.budgeted, actual: categorySpent(v.name, baYm), color: catChartColor(v.name)});
      });
      if (state.debts && state.debts.length){
        baRows.push({name:'Debt Payments', budgeted: debtMinTotal(), actual: typeSpentForMonth(baYm,'debt'), color: catChartColor('Debt Payments')});
      }
      // Most-over-budget first — that's the whole point of this chart, so the categories that need
      // attention are the first thing you see, not buried at the bottom of an alphabetical-ish list.
      baRows.sort(function(a,b){ return (b.actual-b.budgeted) - (a.actual-a.budgeted); });
      var baActualColors = baRows.map(function(r){ return r.actual > r.budgeted ? negative : positive; });
      // "Where am I at" for each row is the gap between the two bars, not either number alone — so that
      // gap gets spelled out directly ("+$120 over" / "$40 under"), right after the actual bar, instead of
      // making you subtract two printed numbers yourself.
      var baDeltaText = baRows.map(function(r){
        var d = r.actual - r.budgeted;
        if (Math.abs(d) < 0.5) return 'on budget';
        return d > 0 ? ('+'+usd0(d)+' over') : (usd0(Math.abs(d))+' under');
      });
      // Printing the actual $ amount (and how far over/under budget it is) right at the end of each bar
      // means "which is which" never depends on matching a swatch color to a bar — the pale bar and its
      // number, the solid colored bar and its own matching-colored number + status, sit right next to
      // each other on every single row.
      var baLabelPlugin = {
        id:'baLabels',
        afterDatasetsDraw: function(chart){
          var ctx = chart.ctx, metaBudget = chart.getDatasetMeta(0), metaActual = chart.getDatasetMeta(1);
          ctx.save();
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          metaBudget.data.forEach(function(bar, i){
            ctx.font = "600 10.5px 'IBM Plex Mono', monospace";
            ctx.fillStyle = inkFaint;
            ctx.fillText(usd0(baRows[i].budgeted), bar.x + 6, bar.y);
          });
          metaActual.data.forEach(function(bar, i){
            ctx.font = "600 10.5px 'IBM Plex Mono', monospace";
            ctx.fillStyle = baActualColors[i];
            var actualText = usd0(baRows[i].actual);
            ctx.fillText(actualText, bar.x + 6, bar.y);
            var actualW = ctx.measureText(actualText).width;
            ctx.font = "600 9.5px 'Public Sans', sans-serif";
            ctx.fillText(' · '+baDeltaText[i], bar.x + 6 + actualW, bar.y);
          });
          ctx.restore();
        }
      };
      chartInstances.budgetactual = new Chart(elBA, { type:'bar', data:{
        labels: baRows.map(function(r){ return r.name; }),
        datasets:[
          {label:'Budgeted', data: baRows.map(function(r){ return r.budgeted; }), backgroundColor: hexToRgba(inkFaint,0.35), borderRadius:4, maxBarThickness:14},
          {label:'Actual', data: baRows.map(function(r){ return r.actual; }), backgroundColor: baActualColors, borderRadius:4, maxBarThickness:14}
        ]
      }, options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        layout:{ padding:{ right:112 } },
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{
          label:function(ctx){ return ' '+ctx.dataset.label+': '+usd0(ctx.parsed.x); },
          afterBody:function(items){ var i = items[0].dataIndex; return 'Status: '+baDeltaText[i]; }
        } } },
        scales:{ x:{ grid:dashedGrid, ticks:moneyTick, border:{display:false} }, y:{ grid:{display:false}, border:{display:false} } } },
      plugins:[baLabelPlugin] });
      var legendBA = document.getElementById('legend-budgetactual');
      if (legendBA) legendBA.innerHTML = chartLegendHtml([
        {label:'Budgeted (pale bar)', color: hexToRgba(inkFaint,0.6)}, {label:'Actual — within budget (green bar)', color:positive}, {label:'Actual — over budget (red bar)', color:negative}
      ]);
    }
    var elBI = document.getElementById('chart-bills-income');
    if (elBI){
      killChart('billsincome');
      var totalIncomeForChart = incomeTotalPlanned();
      var billIncomeRows = state.bills.map(function(b){
        var monthlyEq = billMonthlyEquivalent(b);
        return { name:b.name, amount:monthlyEq, pct: totalIncomeForChart>0 ? (monthlyEq/totalIncomeForChart*100) : 0, color: catChartColor(b.name) };
      }).sort(function(a,b){ return b.pct-a.pct; });
      var biData = billIncomeRows.map(function(r){ return +r.pct.toFixed(1); });
      var biMax = Math.max.apply(null, biData.concat([1]));
      // % is drawn right on each bar (via the plugin below) instead of a separate legend list underneath —
      // scales.x gets extra headroom (suggestedMax) so that label always has room to the right of the bar.
      var barEndLabelPlugin = {
        id: 'billsIncomeBarLabels',
        afterDatasetsDraw: function(chart){
          var ctx = chart.ctx, meta = chart.getDatasetMeta(0);
          ctx.save();
          ctx.font = "600 11px 'IBM Plex Mono', monospace";
          ctx.fillStyle = ink;
          ctx.textBaseline = 'middle';
          ctx.textAlign = 'left';
          meta.data.forEach(function(bar, i){
            var pos = bar.tooltipPosition ? bar.tooltipPosition() : {x:bar.x, y:bar.y};
            ctx.fillText(biData[i].toFixed(1)+'%', pos.x + 6, pos.y);
          });
          ctx.restore();
        }
      };
      chartInstances.billsincome = new Chart(elBI, { type:'bar', data:{
        labels: billIncomeRows.map(function(r){ return r.name; }),
        datasets:[{ label:'% of income', data: biData, backgroundColor: billIncomeRows.map(function(r){return r.color;}), borderRadius:4, maxBarThickness:18 }]
      }, options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        layout:{ padding:{ right:34 } },
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(ctx){ var row = billIncomeRows[ctx.dataIndex]; return ' '+usd0(row.amount)+' — '+ctx.parsed.x.toFixed(1)+'% of income'; } } } },
        scales:{ x:{ suggestedMax: biMax*1.35, grid:dashedGrid, ticks:{ callback:function(v){ return v+'%'; } }, border:{display:false} }, y:{ grid:{display:false}, border:{display:false} } } },
      plugins:[barEndLabelPlugin] });
    }
  }
  if (view==='debt'){
    var el3 = document.getElementById('chart-debt');
    if (el3){
      killChart('debt');
      var sim = simulateDebtPayoff(state.debts, state.debtMethod, state.debtExtra);
      var span = Math.min(sim.timeline.length, 60); // cap the label list on very long payoffs; the line itself still plots every month
      var debtFreeLabel = 'Debt-free '+new Date(TODAY.getFullYear(), TODAY.getMonth()+sim.months, 1).toLocaleDateString('en-US',{month:'short',year:'numeric'});
      // Labels the exact point the balance hits $0 right on the chart — the "Debt-free by" figure already
      // sits in a stat tile above, but seeing it land on the curve itself is what makes the payoff feel real.
      var debtMilestonePlugin = {
        id:'debtMilestone',
        afterDatasetsDraw: function(chart){
          var meta = chart.getDatasetMeta(0);
          var lastPoint = meta.data[meta.data.length-1];
          if (!lastPoint || sim.months<=0) return;
          var ctx = chart.ctx;
          ctx.save();
          ctx.font = "600 11px 'Public Sans', sans-serif";
          ctx.fillStyle = negative;
          ctx.textAlign = lastPoint.x > chart.chartArea.right-60 ? 'right' : 'center';
          ctx.fillText(debtFreeLabel, lastPoint.x, lastPoint.y - 14);
          ctx.restore();
        }
      };
      chartInstances.debt = new Chart(el3, { type:'line', data:{
        labels: futureMonthLabels(sim.timeline.length, state.month),
        datasets:[ Object.assign({ label:'Remaining balance', data: sim.timeline, borderColor:negative, backgroundColor:hexToRgba(negative,0.14), fill:true, tension:0.25, borderWidth:2 }, endpointStyle(sim.timeline.length, negative)) ]
      }, options:{ responsive:true, maintainAspectRatio:false,
        layout:{ padding:{ top:22 } },
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(ctx){ return ' Balance: '+usd0(ctx.parsed.y); } } } },
        scales:{ y:{ grid:dashedGrid, ticks:moneyTick, border:{display:false} }, x:{ grid:{display:false}, border:{display:false}, ticks:{ maxTicksLimit:Math.min(span,8) } } } },
      plugins:[debtMilestonePlugin] });
    }
  }
  if (view==='savings'){
    var el5 = document.getElementById('chart-goals-combined');
    if (el5){
      killChart('goalscombined');
      var goalRows = state.savings.map(function(g){
        var ratio = g.goal>0 ? clamp(g.saved/g.goal*100,0,100) : 0;
        return { name:g.name, saved: Math.min(g.saved,g.goal), remaining: Math.max(0,g.goal-g.saved), ratio: ratio };
      }).sort(function(a,b){ return b.ratio-a.ratio; });
      // Draws each bar's % complete right at its end — the point of a combined view is comparing progress
      // across goals at a glance, and a bare stacked-dollar bar makes that comparison harder, not easier.
      var goalsLabelPlugin = {
        id:'goalsCombinedLabels',
        afterDatasetsDraw: function(chart){
          var ctx = chart.ctx, meta = chart.getDatasetMeta(1);
          ctx.save();
          ctx.font = "600 11px 'IBM Plex Mono', monospace";
          ctx.fillStyle = ink;
          ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
          meta.data.forEach(function(bar, i){
            var pos = bar.tooltipPosition ? bar.tooltipPosition() : {x:bar.x, y:bar.y};
            ctx.fillText(Math.round(goalRows[i].ratio)+'%', pos.x + 6, pos.y);
          });
          ctx.restore();
        }
      };
      chartInstances.goalscombined = new Chart(el5, { type:'bar', data:{
        labels: goalRows.map(function(r){ return r.name; }),
        datasets:[
          {label:'Saved', data: goalRows.map(function(r){ return r.saved; }), backgroundColor: positive, borderRadius:4, maxBarThickness:20, stack:'s'},
          {label:'Remaining', data: goalRows.map(function(r){ return r.remaining; }), backgroundColor: hexToRgba(inkFaint,0.25), borderRadius:4, maxBarThickness:20, stack:'s'}
        ]
      }, options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        layout:{ padding:{ right:40 } },
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(ctx){ return ' '+ctx.dataset.label+': '+usd0(ctx.parsed.x); } } } },
        scales:{ x:{ stacked:true, grid:dashedGrid, ticks:moneyTick, border:{display:false} }, y:{ stacked:true, grid:{display:false}, border:{display:false} } } },
      plugins:[goalsLabelPlugin] });
      var legendGC = document.getElementById('legend-goals-combined');
      if (legendGC) legendGC.innerHTML = chartLegendHtml([{label:'Saved', color:positive}, {label:'Remaining', color: hexToRgba(inkFaint,0.5)}]);
    }
  }
  if (view==='networth'){
    var el4b = document.getElementById('chart-networth-composition');
    if (el4b){
      killChart('networthcomp');
      var assetsNow = state.netWorth.assets.reduce(function(s,a){ return s+a.value; },0);
      var liabNow = state.debts.reduce(function(s,d){ return s+d.balance; },0) + (state.netWorth.liabilities||[]).reduce(function(s,l){ return s+l.value; },0);
      chartInstances.networthcomp = new Chart(el4b, { type:'bar', data:{
        labels:[''],
        datasets:[
          {label:'Assets', data:[assetsNow], backgroundColor:positive, borderRadius:4, maxBarThickness:20},
          {label:'Liabilities', data:[-liabNow], backgroundColor:negative, borderRadius:4, maxBarThickness:20}
        ]
      }, options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(ctx){ return ' '+ctx.dataset.label+': '+usd0(Math.abs(ctx.parsed.x)); } } } },
        scales:{ x:{ grid:dashedGrid, ticks:moneyTick, border:{display:false} }, y:{ grid:{display:false}, border:{display:false}, ticks:{display:false} } } } });
      var legendNWC = document.getElementById('legend-networth-composition');
      if (legendNWC) legendNWC.innerHTML = chartLegendHtml([{label:'Assets', color:positive}, {label:'Liabilities', color:negative}]);
    }
  }
  if (view==='networth'){
    var el4 = document.getElementById('chart-networth');
    if (el4){
      killChart('networth');
      var hist = state.netWorth.history.map(function(h){return h.value;});
      var m = metrics(state.month);
      hist[hist.length-1] = m.netWorth;
      chartInstances.networth = new Chart(el4, { type:'line', data:{
        labels: state.netWorth.history.map(function(h){return h.month;}),
        datasets:[ Object.assign({ label:'Net worth', data:hist, borderColor:accent, backgroundColor:hexToRgba(accent,0.14), fill:true, tension:0.3, borderWidth:2 }, endpointStyle(hist.length, accent)) ]
      }, options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(ctx){ return ' Net worth: '+usd0(ctx.parsed.y); } } } },
        scales:{ y:{ grid:dashedGrid, ticks:moneyTick, border:{display:false} }, x:{ grid:{display:false}, border:{display:false} } } } });
    }
  }
}

/* ============================================================
   EVENT WIRING
   ============================================================ */
function toast(msg){
  var t = document.createElement('div');
  t.textContent = msg;
  // pointer-events:none is deliberate — this is a passive notice with nothing to click, and without it the
  // toast could sit on top of whatever's underneath (e.g. a just-added card's own buttons) for its ~2.6s
  // and silently swallow the click, making a freshly-added item's controls seem broken right after adding.
  t.style.cssText = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:10px; font-size:13px; z-index:999; box-shadow:var(--shadow); pointer-events:none;';
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2600);
}

function wireView(view){
  paintCharts(view);

  // live "→ lands on day X this month" preview next to any day-of-month field — recomputed as the user types,
  // so what a value like 30 or 31 actually resolves to is visible immediately, not left to guess.
  Array.prototype.forEach.call(document.querySelectorAll('[data-day-input]'), function(inp){
    var preview = inp.parentElement.querySelector('[data-day-preview]');
    if (!preview) return;
    inp.addEventListener('input', function(){ preview.textContent = dayPreviewText(inp.value, state.month); });
  });

  // generic add-forms (toggle + submit + cancel)
  Array.prototype.forEach.call(document.querySelectorAll('[data-toggle-form]'), function(btn){
    btn.addEventListener('click', function(){ var f=document.getElementById(btn.getAttribute('data-toggle-form')); f.hidden = !f.hidden; });
  });
  // A Cancel button next to every "Add" button — closes the form WITHOUT saving anything, and clears
  // whatever was half-typed so reopening the form starts fresh instead of showing stale leftovers.
  // This exists because the only prior way to back out was re-clicking the small "+ Add a ___" toggle
  // button itself, which isn't an obvious "cancel" affordance while you're midway through filling a form.
  Array.prototype.forEach.call(document.querySelectorAll('[data-cancel-form]'), function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-cancel-form');
      var wrap = document.getElementById(id+'-form');
      if (!wrap) return;
      Array.prototype.forEach.call(wrap.querySelectorAll('[data-field]'), function(inp){
        if (inp.tagName==='SELECT') inp.selectedIndex = 0; else inp.value = '';
      });
      // also clear any dependent-field sections back to their default hidden state
      Array.prototype.forEach.call(wrap.querySelectorAll('[data-dep-field]'), function(depEl){ depEl.hidden = true; });
      wrap.hidden = true;
    });
  });
  // generic conditional fields (addForm's dependsOnField/dependsOnValue) — e.g. the add-bill form's
  // "Month" field only matters once "Yearly" is picked, so it stays hidden until then.
  Array.prototype.forEach.call(document.querySelectorAll('.form-row [data-field]'), function(ctrl){
    ctrl.addEventListener('change', function(){
      var formRow = ctrl.closest('.form-row'); if (!formRow) return;
      var fieldName = ctrl.getAttribute('data-field');
      Array.prototype.forEach.call(formRow.querySelectorAll('[data-dep-field="'+fieldName+'"]'), function(depEl){
        depEl.hidden = (depEl.getAttribute('data-dep-value') !== ctrl.value);
      });
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-submit-form]'), function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-submit-form');
      var wrap = document.getElementById(id+'-form');
      var vals = {}; Array.prototype.forEach.call(wrap.querySelectorAll('[data-field]'), function(inp){ vals[inp.getAttribute('data-field')] = inp.value; });
      if (id==='add-variable'){
        if (!vals.name || !vals.budgeted) { toast('Enter a name and budget'); return; }
        state.variable.push({id:'v'+Date.now(), name:vals.name, budgeted: clampMoney(vals.budgeted)});
        if (vals.emoji) setCustomCategoryEmoji(vals.name, vals.emoji); // optional — left blank just keeps the standard emoji for this name
        persist(); toast('Added ' + vals.name); route();
      }
      if (id==='add-goal'){
        if (!vals.name || !vals.goal){ toast('Enter a name and target amount'); return; }
        var newGoal = {id:'s'+Date.now(), name:vals.name, goal: Math.max(1, clampMoney(vals.goal) || 1), saved: clampMoney(vals.saved), icon:'goal',
          targetDate: (vals.targetDate && /^\d{4}-\d{2}$/.test(vals.targetDate)) ? vals.targetDate : shiftYm(ymOfDate(TODAY), 12)};
        newGoal.monthly = goalRequiredMonthly(newGoal);
        state.savings.push(newGoal);
        persist(); toast('Added ' + vals.name); route();
      }
      if (id==='add-debt'){
        if (!vals.name || !vals.balance){ toast('Enter a name and balance'); return; }
        state.debts.push({id:'d'+Date.now(), name:vals.name, balance: clampMoney(vals.balance), apr: clampMoney(vals.apr), minPayment: clampMoney(vals.minPayment), dueDay: clampDay(vals.dueDay)});
        persist(); toast('Added ' + vals.name); route();
      }
      if (id==='add-income'){
        if (!vals.name || !vals.amount){ toast('Enter a name and amount'); return; }
        var freq = INCOME_FREQUENCIES[vals.frequency] ? vals.frequency : 'monthly';
        var newIncome = {id:'i'+Date.now(), name:vals.name, frequency: freq, payDay: clampDay(vals.payDay), amount:0};
        if (freq==='variable'){ newIncome.amountsByMonth = {}; newIncome.amountsByMonth[state.month] = clampMoney(vals.amount); }
        else { newIncome.amount = clampMoney(vals.amount); }
        state.income.push(newIncome);
        persist(); toast('Added ' + vals.name); route();
      }
      if (id==='add-bill'){
        if (!vals.name || !vals.budgeted){ toast('Enter a name and amount'); return; }
        var billFreqVal = vals.frequency==='yearly' ? 'yearly' : 'monthly';
        var newBill = {id:'b'+Date.now(), name:vals.name, budgeted: clampMoney(vals.budgeted), dueDay: clampDay(vals.dueDay), frequency: billFreqVal};
        if (billFreqVal==='yearly') newBill.dueMonth = clamp(parseInt(vals.dueMonth)||1, 1, 12);
        state.bills.push(newBill);
        billsExpanded = true; // so a newly-added bill (appended at the end) is never hidden behind a "show more" collapse
        persist(); toast('Added ' + vals.name); route();
      }
      if (id==='add-asset'){
        if (!vals.name || !vals.value){ toast('Enter a name and value'); return; }
        state.netWorth.assets.push({name:vals.name, value: clampMoney(vals.value), monthlyContribution: clampMoney(vals.monthlyContribution||0)});
        persist(); toast('Added ' + vals.name); route();
      }
      if (id==='add-liability'){
        if (!vals.name || !vals.value){ toast('Enter a name and amount'); return; }
        state.netWorth.liabilities = state.netWorth.liabilities || [];
        state.netWorth.liabilities.push({name:vals.name, value: clampMoney(vals.value)});
        persist(); toast('Added ' + vals.name); route();
      }
    });
  });

  if (view==='overview'){
    Array.prototype.forEach.call(document.querySelectorAll('#range-seg button'), function(btn){
      btn.addEventListener('click', function(){
        rangeState.mode = btn.getAttribute('data-range');
        if (rangeState.mode==='custom' && !rangeState.start){ rangeState.start = state.month+'-01'; rangeState.end = state.today; }
        saveRangeState(rangeState); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#trend-range-seg button'), function(btn){
      btn.addEventListener('click', function(){
        trendRangeKey = btn.getAttribute('data-trend-range');
        route();
      });
    });
    var rangeApply = document.getElementById('range-apply');
    if (rangeApply) rangeApply.addEventListener('click', function(){
      var s = document.getElementById('range-start').value, e = document.getElementById('range-end').value;
      if (!s || !e || s>e){ toast('Pick a valid start and end date'); return; }
      rangeState.start = s; rangeState.end = e; saveRangeState(rangeState); route();
    });
    var csvBtn = document.getElementById('export-csv-btn');
    if (csvBtn) csvBtn.addEventListener('click', exportCSV);
    var printBtn = document.getElementById('print-report-btn');
    if (printBtn) printBtn.addEventListener('click', printReport);
    var closureAllocateBtn = document.getElementById('closure-allocate-btn');
    if (closureAllocateBtn) closureAllocateBtn.addEventListener('click', function(){
      var ym = closureAllocateBtn.getAttribute('data-ym');
      var amt = parseFloat(closureAllocateBtn.getAttribute('data-amt'));
      var goalId = document.getElementById('closure-goal-select').value;
      var g = savingsById(goalId);
      if (!g){ toast('Pick a goal first'); return; }
      g.saved += amt;
      state.transactions.push({id:'t'+Date.now(), date: state.today, merchant: g.name+' Transfer ('+monthLabel(ym)+' surplus)', category:g.name, amount:amt, type:'savings', savingsId:g.id, account:'acc-savings', auto:false});
      state.monthClosures = state.monthClosures || {};
      state.monthClosures[ym] = {status:'allocated', allocatedTo:goalId, amount:amt};
      persist(); toast('Moved '+usd0(amt)+' into '+g.name); route();
    });
    var closureDismissBtn = document.getElementById('closure-dismiss-btn');
    if (closureDismissBtn) closureDismissBtn.addEventListener('click', function(){
      var ym = closureDismissBtn.getAttribute('data-ym');
      state.monthClosures = state.monthClosures || {};
      state.monthClosures[ym] = {status:'dismissed'};
      persist(); route();
    });
    var closureAckBtn = document.getElementById('closure-ack-btn');
    if (closureAckBtn) closureAckBtn.addEventListener('click', function(){
      var ym = closureAckBtn.getAttribute('data-ym');
      state.monthClosures = state.monthClosures || {};
      state.monthClosures[ym] = {status:'acknowledged'};
      persist(); route();
    });
  }

  if (view==='income'){
    Array.prototype.forEach.call(document.querySelectorAll('[data-income-field]'), function(inp){
      inp.addEventListener('change', function(){
        var i = incomeById(inp.getAttribute('data-income-id')); if (!i) return;
        var field = inp.getAttribute('data-income-field');
        if (field==='name'){ i.name = inp.value; }
        else if (field==='frequency'){
          var newFreq = INCOME_FREQUENCIES[inp.value] ? inp.value : 'monthly';
          var wasVariable = incomeFreq(i)==='variable', willBeVariable = newFreq==='variable';
          if (willBeVariable && !wasVariable){
            i.amountsByMonth = i.amountsByMonth || {};
            i.amountsByMonth[state.month] = i.amount||0;
          } else if (!willBeVariable && wasVariable){
            i.amount = incomeAmountForMonth(i, state.month);
          }
          i.frequency = newFreq;
        }
        else if (field==='payDay'){ i.payDay = clampDay(inp.value); }
        else if (field==='amount'){
          if (incomeFreq(i)==='variable'){ i.amountsByMonth = i.amountsByMonth || {}; i.amountsByMonth[state.month] = clampMoney(inp.value); }
          else { i.amount = clampMoney(inp.value); }
        }
        else { i[field] = clampMoney(inp.value); }
        persist(); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-income-restore]'), function(btn){
      btn.addEventListener('click', function(){
        var i = incomeById(btn.getAttribute('data-income-restore')); if (!i) return;
        var last = incomeLastKnownAmount(i, state.month);
        i.amountsByMonth = i.amountsByMonth || {};
        i.amountsByMonth[state.month] = last;
        persist(); toast('Restored '+usd0(last)+' for '+i.name+' this month'); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-income-remove]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-income-remove');
        var i = incomeById(id);
        confirmDelete('Remove income source "'+esc(i?i.name:'')+'"?', function(){
          state.income = state.income.filter(function(x){ return x.id!==id; });
          persist(); toast(i?i.name+' removed':'Income removed'); route();
        });
      });
    });
    // This is what actually makes an income source show up on the Overview page — it logs a real
    // transaction, which is the only thing metrics()/the waterfall/Budget vs. Actual ever total up.
    Array.prototype.forEach.call(document.querySelectorAll('[data-income-confirm]'), function(btn){
      btn.addEventListener('click', function(){
        var i = incomeById(btn.getAttribute('data-income-confirm')); if (!i) return;
        var ym = state.month, freq = incomeFreq(i);
        var amt = incomeMonthlyEquivalent(i, ym);
        if (!amt){ toast('Enter this month\'s amount above first'); return; }
        if (freq!=='variable'){ i.autoConfirm = true; i.autoConfirmSince = ym; }
        state.transactions.push({id:'t'+Date.now()+Math.random().toString(36).slice(2,7), date: incomeConfirmDateFor(i, ym),
          merchant:i.name, category:i.name, amount:amt, type:'income', incomeId:i.id, account:'acc-checking', auto:false});
        persist();
        toast(freq!=='variable' ? 'Confirmed — ' + i.name + ' will now add itself every month' : 'Confirmed ' + usd0(amt) + ' for ' + i.name);
        route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-income-unconfirm]'), function(btn){
      btn.addEventListener('click', function(){
        var i = incomeById(btn.getAttribute('data-income-unconfirm')); if (!i) return;
        var ym = state.month;
        var tx = incomeTxForMonth(i.id, ym);
        var isVariable = incomeFreq(i)==='variable';
        confirmDelete(isVariable ? 'Undo confirming '+esc(i.name)+' for '+monthLabel(ym)+'?' : 'Stop auto-adding '+esc(i.name)+' every month? This also removes this month\'s confirmed transaction.', function(){
          if (tx) state.transactions = state.transactions.filter(function(x){ return x.id!==tx.id; });
          if (!isVariable) i.autoConfirm = false;
          persist(); toast(i.name+' unconfirmed'); route();
        });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-income-unconfirm-flag]'), function(btn){
      btn.addEventListener('click', function(){
        var i = incomeById(btn.getAttribute('data-income-unconfirm-flag')); if (!i) return;
        confirmDelete('Stop auto-adding '+esc(i.name)+' every month?', function(){
          i.autoConfirm = false;
          persist(); toast(i.name+' auto-confirm turned off'); route();
        });
      });
    });
  }

  if (view==='budget'){
    wireBillDebtToggles();
    var billsToggleBtn = document.getElementById('bills-toggle-expand');
    if (billsToggleBtn) billsToggleBtn.addEventListener('click', function(){ billsExpanded = !billsExpanded; route(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-bill-field]'), function(el){
      el.addEventListener('change', function(){
        var b = findById(state.bills, el.getAttribute('data-bill-id')); if (!b) return;
        var field = el.getAttribute('data-bill-field');
        if (field==='name'){
          var newName = el.value.trim();
          if (!newName){ el.value = b.name; return; }
          renameBill(b.id, newName);
          return;
        }
        if (field==='frequency'){
          b.frequency = el.value==='yearly' ? 'yearly' : 'monthly';
          if (b.frequency==='yearly' && !b.dueMonth) b.dueMonth = 1;
        } else if (field==='dueDay'){ b.dueDay = clampDay(el.value); }
        else if (field==='dueMonth'){ b.dueMonth = clamp(parseInt(el.value)||1, 1, 12); }
        else if (field==='budgeted'){ b.budgeted = clampMoney(el.value); }
        persist(); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-bill-remove]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-bill-remove');
        var b = findById(state.bills, id);
        confirmDelete('Remove '+(b?('"'+esc(b.name)+'"'):'this bill')+'? This can\'t be undone.', function(){ removeBill(id); });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-var-budget]'), function(inp){
      inp.addEventListener('change', function(){ var v = state.variable.find(function(x){return x.id===inp.getAttribute('data-var-budget');}); if(v){ v.budgeted = clampMoney(inp.value); persist(); route(); } });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-cat-rename]'), function(inp){
      inp.addEventListener('change', function(){
        var oldName = inp.getAttribute('data-cat-rename');
        var newName = inp.value.trim();
        if (!newName){ inp.value = oldName; return; }
        renameCategory(oldName, newName);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-cat-remove]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-cat-remove');
        var cat = state.variable.find(function(v){ return v.id===id; });
        confirmDelete('Remove category "'+esc(cat?cat.name:'')+'"? Past transactions keep the name, but it won\'t be budgeted going forward.', function(){ removeCategory(id); });
      });
    });
  }

  if (view==='transactions'){
    var ccySelect = document.getElementById('tx-currency');
    var fxRow = document.getElementById('tx-fx-row');
    var fxNote = document.getElementById('tx-fx-note');
    var fxRateInput = document.getElementById('tx-fxrate');
    var amountMoneyWrap = document.getElementById('tx-amount-money');
    var fxLookupSeq = 0; // guards a slow/late response from overwriting a newer lookup's result
    function setFxNote(text){ if (fxNote){ fxNote.textContent = text; fxNote.hidden = false; } }
    function tryAutoFetchRate(){
      if (!ccySelect || ccySelect.value === baseCcy()) return;
      var from = ccySelect.value, to = baseCcy();
      var dateEl = document.getElementById('tx-date');
      var dateVal = (dateEl && dateEl.value && dateEl.value <= state.today) ? dateEl.value : null;
      var mySeq = ++fxLookupSeq;
      setFxNote('Looking up today’s '+from+' → '+to+' rate…');
      if (fxRateInput) fxRateInput.disabled = true;
      fetchLiveRate(from, to, dateVal).then(function(rate){
        if (mySeq !== fxLookupSeq) return; // superseded by a newer lookup
        if (fxRateInput) fxRateInput.disabled = false;
        if (rate){
          if (fxRateInput) fxRateInput.value = rate.toFixed(4);
          setFxNote('Live rate: 1 '+from+' = '+rate.toFixed(4)+' '+to+' (as of '+(dateVal||'today')+'). Edit it if a different rate applies.');
        } else {
          setFxNote('Couldn’t reach the live rate service right now (this always happens while previewing inside Claude — it works once Steadyspend is running on its own hosting). Enter the rate from your statement or bank.');
        }
      });
    }
    function syncFxVisibility(opts){
      var isForeign = ccySelect.value !== baseCcy();
      fxRow.hidden = !isForeign; fxNote.hidden = !isForeign;
      // the Amount field's $ prefix always reflects whichever currency is actually selected, not just the household default
      if (amountMoneyWrap) amountMoneyWrap.style.setProperty('--money-symbol', JSON.stringify(ccySymbol(ccySelect.value)));
      if (isForeign){
        // Loading an existing transaction into the form for editing already has its own recorded rate —
        // a fresh live lookup would silently overwrite that recorded rate with today's, which isn't what
        // "edit this transaction" should do unless the user changes the currency themselves.
        if (opts && opts.preserveRate) setFxNote('Rate recorded for this transaction: 1 '+ccySelect.value+' = '+(fxRateInput?fxRateInput.value:'')+' '+baseCcy()+'. Edit it if needed.');
        else tryAutoFetchRate();
      }
    }
    if (ccySelect){
      syncFxVisibility({preserveRate: !!editingTxId});
      ccySelect.addEventListener('change', syncFxVisibility);
      var dateElForFx = document.getElementById('tx-date');
      if (dateElForFx) dateElForFx.addEventListener('change', function(){ if (ccySelect.value !== baseCcy()) tryAutoFetchRate(); });
    }

    // Category picker — a real <select> (with emoji + a "Custom category…" fallback) instead of the old
    // free-text-plus-datalist field, which some browsers made awkward to open via its little dropdown arrow.
    wireCategoryPickers(document, function(){ /* value is read directly from the DOM at submit time */ });

    // Linking to an actual bill/loan is what makes a manually-logged payment correctly show that bill as
    // PAID everywhere (Calendar, Overview "Due this week", Main Budget) — a bare Type="Bill" transaction
    // with no link has no way to be matched back to a specific bill, so it used to keep showing as due
    // even after you'd logged the payment by hand.
    var typeSelect = document.getElementById('tx-type');
    var linkedRow = document.getElementById('tx-linked-row');
    var linkedLabel = document.getElementById('tx-linked-label');
    var linkedSelect = document.getElementById('tx-linked-select');
    function refreshLinkedSelect(){
      var type = typeSelect.value;
      if (type==='bill'){
        linkedRow.hidden = false;
        linkedLabel.textContent = 'Which bill is this?';
        linkedSelect.innerHTML = '<option value="">— not linked to a specific bill —</option>' +
          state.bills.map(function(b){ return '<option value="'+b.id+'">'+esc(b.name)+' ('+usd0(b.budgeted)+')</option>'; }).join('');
      } else if (type==='debt'){
        linkedRow.hidden = false;
        linkedLabel.textContent = 'Which loan is this?';
        linkedSelect.innerHTML = '<option value="">— not linked to a specific loan —</option>' +
          (state.debts||[]).map(function(d){ return '<option value="'+d.id+'">'+esc(d.name)+' (min '+usd0(d.minPayment)+')</option>'; }).join('');
      } else {
        linkedRow.hidden = true;
        linkedSelect.innerHTML = '';
      }
    }
    refreshLinkedSelect();
    // Loading an existing bill/debt transaction into the form for editing should show which one it was
    // already linked to, not reset back to "not linked" every time you open the edit form.
    (function(){
      var editingTx = editingTxId ? state.transactions.find(function(t){ return t.id===editingTxId; }) : null;
      if (editingTx && (editingTx.billId || editingTx.debtId)) linkedSelect.value = editingTx.billId || editingTx.debtId || '';
    })();
    typeSelect.addEventListener('change', refreshLinkedSelect);
    linkedSelect.addEventListener('change', function(){
      var merchantInput = document.getElementById('tx-merchant');
      var amountInput = document.getElementById('tx-amount');
      var match = typeSelect.value==='bill'
        ? state.bills.find(function(b){ return b.id===linkedSelect.value; })
        : (state.debts||[]).find(function(d){ return d.id===linkedSelect.value; });
      if (!match) return;
      if (merchantInput && !merchantInput.value.trim()) merchantInput.value = match.name;
      if (amountInput && !amountInput.value) amountInput.value = typeSelect.value==='bill' ? match.budgeted : match.minPayment;
      setCategoryPickerValue(document, 'data-tx-cat', '1', match.name);
    });

    document.getElementById('tx-add-btn').addEventListener('click', function(){
      var date = document.getElementById('tx-date').value || state.today;
      var merchant = document.getElementById('tx-merchant').value.trim();
      var type = document.getElementById('tx-type').value;
      var category = resolvedCategoryValue(document, 'data-tx-cat', '1') || (type==='income'?'Other income':'Other');
      var amount = parseFloat(document.getElementById('tx-amount').value);
      var currency = ccySelect ? ccySelect.value : baseCcy();
      var note = (document.getElementById('tx-note').value || '').trim();
      if (!amount || amount<=0){ toast('Enter an amount'); return; }
      if (!merchant) merchant = category; // merchant is optional — falls back to the category name so the row still reads sensibly in every list
      var baseAmount = amount, fxRate = 1;
      if (currency !== baseCcy()){
        fxRate = parseFloat(document.getElementById('tx-fxrate').value);
        if (!fxRate || fxRate<=0){ toast('Enter (or estimate) the exchange rate to '+baseCcy()); return; }
        baseAmount = amount * fxRate;
      }
      var editingTx = editingTxId ? state.transactions.find(function(t){ return t.id===editingTxId; }) : null;
      if (editingTx){
        editingTx.date = date; editingTx.merchant = merchant; editingTx.category = category; editingTx.amount = amount; editingTx.type = type;
        delete editingTx.note; if (note) editingTx.note = note;
        delete editingTx.currency; delete editingTx.fxRate; delete editingTx.baseAmount;
        if (currency !== baseCcy()){ editingTx.currency = currency; editingTx.fxRate = fxRate; editingTx.baseAmount = baseAmount; }
        delete editingTx.billId; delete editingTx.debtId;
        if (type==='bill' && linkedSelect.value) editingTx.billId = linkedSelect.value;
        if (type==='debt' && linkedSelect.value) editingTx.debtId = linkedSelect.value;
        editingTxId = null;
        persist(); toast('Transaction updated'); route();
        return;
      }
      var row = {id:'t'+Date.now(), date:date, merchant:merchant, category:category, amount:amount, type:type, account:'acc-checking', auto:false};
      if (note) row.note = note;
      if (currency !== baseCcy()){ row.currency = currency; row.fxRate = fxRate; row.baseAmount = baseAmount; }
      if (type==='bill' && linkedSelect.value) row.billId = linkedSelect.value;
      if (type==='debt' && linkedSelect.value) row.debtId = linkedSelect.value;
      state.transactions.push(row);
      persist(); toast('Transaction added'); route();
    });
    var cancelEditBtn = document.getElementById('tx-cancel-edit-btn');
    if (cancelEditBtn) cancelEditBtn.addEventListener('click', function(){ editingTxId = null; route(); });
    var csvBtn = document.getElementById('csv-read-btn');
    if (csvBtn) csvBtn.addEventListener('click', handleCSVFile);
    var pdfBtn = document.getElementById('pdf-read-btn');
    if (pdfBtn) pdfBtn.addEventListener('click', handlePDFFile);
    wireTxTableSection();

    function applyTxFilterAndRefresh(){ refreshTxTable(); }
    var filterCategoryEl = document.getElementById('tx-filter-category');
    if (filterCategoryEl) filterCategoryEl.addEventListener('change', function(){ txFilters.category = filterCategoryEl.value; applyTxFilterAndRefresh(); });
    var filterMerchantEl = document.getElementById('tx-filter-merchant');
    if (filterMerchantEl) filterMerchantEl.addEventListener('input', function(){ txFilters.merchant = filterMerchantEl.value; applyTxFilterAndRefresh(); });
    var filterDateFromEl = document.getElementById('tx-filter-datefrom');
    if (filterDateFromEl) filterDateFromEl.addEventListener('change', function(){ txFilters.dateFrom = filterDateFromEl.value; applyTxFilterAndRefresh(); });
    var filterDateToEl = document.getElementById('tx-filter-dateto');
    if (filterDateToEl) filterDateToEl.addEventListener('change', function(){ txFilters.dateTo = filterDateToEl.value; applyTxFilterAndRefresh(); });
    var filterAmountMinEl = document.getElementById('tx-filter-amountmin');
    if (filterAmountMinEl) filterAmountMinEl.addEventListener('input', function(){ txFilters.amountMin = filterAmountMinEl.value; applyTxFilterAndRefresh(); });
    var filterAmountMaxEl = document.getElementById('tx-filter-amountmax');
    if (filterAmountMaxEl) filterAmountMaxEl.addEventListener('input', function(){ txFilters.amountMax = filterAmountMaxEl.value; applyTxFilterAndRefresh(); });
    var filterClearEl = document.getElementById('tx-filter-clear');
    if (filterClearEl) filterClearEl.addEventListener('click', function(){
      txFilters = {category:'', merchant:'', dateFrom:'', dateTo:'', amountMin:'', amountMax:''};
      route();
    });
  }

  if (view==='calendar'){
    wireBillDebtToggles();
  }

  if (view==='debt'){
    Array.prototype.forEach.call(document.querySelectorAll('#method-seg button'), function(btn){
      btn.addEventListener('click', function(){ state.debtMethod = btn.getAttribute('data-method'); persist(); route(); });
    });
    var extraInp = document.getElementById('extra-payment');
    if (extraInp) extraInp.addEventListener('change', function(){ state.debtExtra = clampMoney(extraInp.value); persist(); route(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-debt-field]'), function(inp){
      inp.addEventListener('change', function(){
        var d = debtById(inp.getAttribute('data-debt-id'));
        if (!d) return;
        var field = inp.getAttribute('data-debt-field');
        d[field] = (field==='dueDay') ? clampDay(inp.value) : clampMoney(inp.value);
        persist(); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-debt-remove]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-debt-remove');
        var d = debtById(id);
        confirmDelete('Remove '+(d?('"'+esc(d.name)+'"'):'this debt')+'? This can\'t be undone.', function(){
          state.debts = state.debts.filter(function(x){ return x.id!==id; });
          persist(); toast(d?d.name+' removed':'Debt removed'); route();
        });
      });
    });
  }

  if (view==='savings'){
    Array.prototype.forEach.call(document.querySelectorAll('[data-goal-submit]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-goal-submit');
        var inp = document.querySelector('[data-goal-add="'+id+'"]');
        var amt = parseFloat(inp.value);
        if (!amt || amt<=0){ toast('Enter an amount'); return; }
        var g = savingsById(id); g.saved += amt;
        state.transactions.push({id:'t'+Date.now(), date: state.today, merchant: g.name+' Transfer', category:g.name, amount:amt, type:'savings', savingsId:g.id, account:'acc-savings', auto:false});
        persist(); toast('Added '+usd0(amt)+' to '+g.name); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-goal-saved]'), function(inp){
      inp.addEventListener('change', function(){
        var g = savingsById(inp.getAttribute('data-goal-saved')); if (!g) return;
        g.saved = clampMoney(inp.value);
        persist(); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-goal-target]'), function(inp){
      inp.addEventListener('change', function(){
        var g = savingsById(inp.getAttribute('data-goal-target')); if (!g) return;
        g.goal = Math.max(1, clampMoney(inp.value) || 1);
        persist(); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-goal-target-date]'), function(inp){
      inp.addEventListener('change', function(){
        var g = savingsById(inp.getAttribute('data-goal-target-date')); if (!g) return;
        if (!/^\d{4}-\d{2}$/.test(inp.value)) return;
        g.targetDate = inp.value;
        g.monthly = goalRequiredMonthly(g);
        persist(); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-goal-remove]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-goal-remove');
        var g = savingsById(id);
        confirmDelete('Remove goal '+(g?('"'+esc(g.name)+'"'):'')+'? This can\'t be undone.', function(){
          state.savings = state.savings.filter(function(x){ return x.id!==id; });
          persist(); toast(g?g.name+' removed':'Goal removed'); route();
        });
      });
    });
  }

  if (view==='networth'){
    Array.prototype.forEach.call(document.querySelectorAll('[data-asset-field]'), function(inp){
      inp.addEventListener('change', function(){
        var idx = parseInt(inp.getAttribute('data-asset-idx'));
        var field = inp.getAttribute('data-asset-field');
        if (!state.netWorth.assets[idx]) return;
        state.netWorth.assets[idx][field] = (field==='value' || field==='monthlyContribution') ? clampMoney(inp.value) : inp.value;
        persist(); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-asset-remove]'), function(btn){
      btn.addEventListener('click', function(){
        var idx = parseInt(btn.getAttribute('data-asset-remove'));
        var a = state.netWorth.assets[idx];
        confirmDelete('Remove '+(a?('"'+esc(a.name)+'"'):'this asset')+' from your assets?', function(){
          state.netWorth.assets.splice(idx,1); persist(); toast(a?a.name+' removed':'Asset removed'); route();
        });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-liab-field]'), function(inp){
      inp.addEventListener('change', function(){
        var idx = parseInt(inp.getAttribute('data-liab-idx'));
        var field = inp.getAttribute('data-liab-field');
        state.netWorth.liabilities = state.netWorth.liabilities || [];
        if (!state.netWorth.liabilities[idx]) return;
        state.netWorth.liabilities[idx][field] = field==='value' ? clampMoney(inp.value) : inp.value;
        persist(); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-liab-remove]'), function(btn){
      btn.addEventListener('click', function(){
        var idx = parseInt(btn.getAttribute('data-liab-remove'));
        var l = (state.netWorth.liabilities||[])[idx];
        confirmDelete('Remove '+(l?('"'+esc(l.name)+'"'):'this liability')+'?', function(){
          state.netWorth.liabilities.splice(idx,1); persist(); toast(l?l.name+' removed':'Removed'); route();
        });
      });
    });
  }

  if (view==='settings'){
    Array.prototype.forEach.call(document.querySelectorAll('[data-settingstab]'), function(btn){
      btn.addEventListener('click', function(){ settingsTab = btn.getAttribute('data-settingstab'); route(); });
    });
    var installBtn = document.getElementById('pwa-install-btn');
    if (installBtn){
      installBtn.addEventListener('click', function(){
        if (!deferredInstallPrompt) return;
        var statusEl = document.getElementById('pwa-install-status');
        deferredInstallPrompt.prompt();
        deferredInstallPrompt.userChoice.then(function(choice){
          deferredInstallPrompt = null;
          // Don't re-render here — the separate 'appinstalled' listener flips this card to the
          // "already installed" state once the OS actually finishes, which can lag slightly behind
          // this promise resolving. Re-rendering immediately would wipe this message before it's read.
          if (statusEl) statusEl.textContent = (choice && choice.outcome === 'accepted') ? 'Installed — check your home screen.' : 'No problem — you can install any time from this page.';
        }).catch(function(){});
      });
    }
    var clearBtn = document.getElementById('clear-data-btn');
    if (clearBtn) clearBtn.addEventListener('click', openClearDataModal);
    var exportAllBtn = document.getElementById('export-all-data-btn');
    if (exportAllBtn) exportAllBtn.addEventListener('click', exportAllData);
  }

}

/* ================= MOBILE MENU (hamburger drawer — see MOBILE media query in template.html) ================= */
document.getElementById('menu-toggle').addEventListener('click', openMobileMenu);
document.getElementById('sidebar-backdrop').addEventListener('click', closeMobileMenu);

/* ================= MONTH NAV =================
   Bills, income sources, and variable categories are templates (not stored per-month), so they show the
   same every month by design — it's the actual transactions, and anything computed from them, that
   change as you scroll. Every view that reads state.month (Budget, Income, Calendar, Transactions,
   Overview) already takes ym as a parameter, so moving state.month and re-routing is all this needs. */
document.getElementById('month-prev').addEventListener('click', function(){ state.month = shiftYm(state.month, -1); persist(); route(); });
document.getElementById('month-next').addEventListener('click', function(){ state.month = shiftYm(state.month, 1); persist(); route(); });

/* ================= THEME TOGGLE ================= */
var THEME_KEY = 'steadyspend-theme';
function applyTheme(t){
  var root = document.documentElement;
  if (t==='light') root.setAttribute('data-theme','light');
  else if (t==='dark') root.setAttribute('data-theme','dark');
  else root.removeAttribute('data-theme');
  var btn = document.getElementById('theme-toggle');
  btn.innerHTML = ic(t==='dark' ? 'sun' : (t==='light' ? 'sun' : 'sun'));
  btn.title = 'Theme: ' + (t||'system') + ' (click to change)';
}
var themeState = 'system';
try { themeState = localStorage.getItem(THEME_KEY) || 'system'; } catch(e){}
applyTheme(themeState);
document.getElementById('theme-toggle').addEventListener('click', function(){
  themeState = themeState==='system' ? 'light' : (themeState==='light' ? 'dark' : 'system');
  try { localStorage.setItem(THEME_KEY, themeState); } catch(e){}
  applyTheme(themeState);
  Object.keys(chartInstances).forEach(killChart);
  route();
});

/* ================= STYLE DIRECTION PREVIEW (temporary — for choosing a look) ================= */
var STYLE_KEY = 'steadyspend-style';
function applyStyle(s){
  if (!s || s==='ledger') document.documentElement.removeAttribute('data-style');
  else document.documentElement.setAttribute('data-style', s);
  Array.prototype.forEach.call(document.querySelectorAll('.style-dot'), function(d){ d.classList.toggle('active', d.getAttribute('data-style')===(s||'ledger')); });
}
var styleState = 'bloom';
try { styleState = localStorage.getItem(STYLE_KEY) || 'bloom'; } catch(e){}
applyStyle(styleState);
Array.prototype.forEach.call(document.querySelectorAll('.style-dot'), function(d){
  d.addEventListener('click', function(){
    styleState = d.getAttribute('data-style');
    try { localStorage.setItem(STYLE_KEY, styleState); } catch(e){}
    applyStyle(styleState);
    Object.keys(chartInstances).forEach(killChart);
    route();
  });
});

/* ================= INIT ================= */
renderHouseholdSwitcher(); renderCurrencySwitcher(); renderAccountWidget();
route();
initDownloads();
registerServiceWorker();
initAuth();

// "Add to Home Screen" only means anything when this page is the actual top-level site a real
// browser navigated to — inside this Claude preview it's loaded in a sandboxed iframe, where
// service-worker registration is pointless (often blocked outright) and would just be noise in
// the console. This same code registers for real the moment it's deployed on its own hosting.
function registerServiceWorker(){
  try {
    if (!('serviceWorker' in navigator)) return;
    if (window.self !== window.top) return; // running inside an iframe (e.g. this preview) — skip
    navigator.serviceWorker.register('./sw.js').catch(function(){ /* no sw.js at this origin yet — fine, the app still works without it */ });
  } catch(e){ /* never let install-related plumbing break the app itself */ }
}

})();
</script>
