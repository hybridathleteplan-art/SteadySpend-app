/* ============================================================
   CSV STATEMENT IMPORT — fully client-side, no AI / no network call.
   Handles a bank's exported CSV export: sniffs the header row, guesses which
   column is date/merchant/amount (common bank export header names), then lets
   the user confirm the mapping before anything is parsed into transactions.
   ============================================================ */
var csvImportRows = [], csvImportHeaders = [], csvImportMap = {date:-1, merchant:-1, amount:-1};
function parseCSV(text){
  // minimal RFC4180-ish parser: handles quoted fields, escaped quotes, and commas/newlines inside quotes
  var rows = [], row = [], field = '', inQuotes = false;
  for (var i=0; i<text.length; i++){
    var c = text[i], next = text[i+1];
    if (inQuotes){
      if (c==='"' && next==='"'){ field+='"'; i++; }
      else if (c==='"'){ inQuotes=false; }
      else field += c;
    } else {
      if (c==='"') inQuotes = true;
      else if (c===','){ row.push(field); field=''; }
      else if (c==='\r'){ /* skip */ }
      else if (c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(f){ return f.trim()!==''; }); });
}
function guessColumn(headers, candidates){
  var lower = headers.map(function(h){ return h.trim().toLowerCase(); });
  for (var i=0;i<candidates.length;i++){
    var idx = lower.indexOf(candidates[i]);
    if (idx>=0) return idx;
  }
  for (var j=0;j<lower.length;j++){
    for (var k=0;k<candidates.length;k++){ if (lower[j].indexOf(candidates[k])>=0) return j; }
  }
  return -1;
}
function handleCSVFile(){
  var fileInput = document.getElementById('csv-file');
  var statusEl = document.getElementById('csv-status');
  if (!fileInput || !fileInput.files || !fileInput.files.length){ if(statusEl) statusEl.textContent = 'Choose a CSV file first.'; return; }
  var reader = new FileReader();
  reader.onload = function(){
    var rows = parseCSV(String(reader.result||''));
    if (rows.length < 2){ if(statusEl) statusEl.textContent = 'Couldn’t find any rows in that file.'; return; }
    csvImportHeaders = rows[0];
    csvImportRows = rows.slice(1);
    csvImportMap = {
      date: guessColumn(csvImportHeaders, ['date','transaction date','posted date']),
      merchant: guessColumn(csvImportHeaders, ['merchant','description','payee','name']),
      amount: guessColumn(csvImportHeaders, ['amount','amount debit','debit','value'])
    };
    if (statusEl) statusEl.textContent = 'Found '+csvImportRows.length+' row'+(csvImportRows.length===1?'':'s')+' — confirm which column is which:';
    renderCSVMapping();
  };
  reader.onerror = function(){ if(statusEl) statusEl.textContent = 'Couldn’t read that file — try again.'; };
  reader.readAsText(fileInput.files[0]);
}
function renderCSVMapping(){
  var mapEl = document.getElementById('csv-mapping');
  if (!mapEl) return;
  function colSelect(field, label){
    return '<div class="field" style="flex:1;"><label>'+label+' column</label><select data-csv-map="'+field+'">'+
      '<option value="-1">— not present —</option>'+
      csvImportHeaders.map(function(h,i){ return '<option value="'+i+'"'+(csvImportMap[field]===i?' selected':'')+'>'+esc(h||'(column '+(i+1)+')')+'</option>'; }).join('')+
    '</select></div>';
  }
  mapEl.innerHTML = '<div class="hstack" style="gap:10px; flex-wrap:wrap; margin-top:10px;">'+
      colSelect('date','Date')+ colSelect('merchant','Merchant / description')+ colSelect('amount','Amount')+
    '</div>'+
    '<div style="margin-top:10px;"><button class="btn btn-primary" id="csv-preview-btn">Preview rows</button></div>'+
    '<div id="csv-review"></div>';
  Array.prototype.forEach.call(mapEl.querySelectorAll('[data-csv-map]'), function(sel){
    sel.addEventListener('change', function(){ csvImportMap[sel.getAttribute('data-csv-map')] = parseInt(sel.value); });
  });
  var btn = document.getElementById('csv-preview-btn');
  if (btn) btn.addEventListener('click', renderCSVReview);
}
function normalizeCSVDate(raw){
  raw = String(raw||'').trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
  var m = raw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/); // M/D/YYYY or M-D-YY, the common US bank-export shape
  if (m){
    var mo = parseInt(m[1]), d = parseInt(m[2]), y = parseInt(m[3]); if (y<100) y += 2000;
    return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  }
  return state.today;
}
var csvReviewRows = [];
function renderCSVReview(){
  if (csvImportMap.date<0 || csvImportMap.merchant<0 || csvImportMap.amount<0){
    var statusEl = document.getElementById('csv-status');
    if (statusEl) statusEl.textContent = 'Pick a column for date, merchant, and amount before previewing.';
    return;
  }
  var allCats = state.bills.map(function(b){return b.name;}).concat(state.variable.map(function(v){return v.name;}));
  csvReviewRows = csvImportRows.slice(0,200).map(function(r,i){
    var rawAmt = String(r[csvImportMap.amount]||'').replace(/[$,]/g,'').trim();
    var amt = parseFloat(rawAmt);
    return {
      id:'c'+i, date: normalizeCSVDate(r[csvImportMap.date]), merchant: String(r[csvImportMap.merchant]||'Unknown').trim() || 'Unknown',
      amount: Math.abs(amt)||0, type: amt<0 ? 'variable' : 'income', category: amt<0 ? 'Other' : 'Other income', checked: !isNaN(amt) && amt!==0
    };
  }).filter(function(r){ return r.amount>0; });
  var reviewEl = document.getElementById('csv-review');
  if (!reviewEl) return;
  reviewEl.innerHTML = '<div class="faint" style="margin:10px 0 4px;">'+csvReviewRows.length+' transaction'+(csvReviewRows.length===1?'':'s')+' ready — uncheck any you don’t want, fix a category, then import:</div>'+
    '<div class="stack" style="gap:0; max-height:360px; overflow-y:auto;">' + csvReviewRows.map(function(t){
      return '<div class="hstack" style="justify-content:space-between; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);">'+
        '<input type="checkbox" data-csv-check="'+t.id+'" '+(t.checked?'checked':'')+' style="margin-top:3px; flex:none; width:16px; height:16px;">'+
        '<span style="flex:1; min-width:0;"><span style="font-weight:600;">'+esc(t.merchant)+'</span> <span class="faint">'+t.date+'</span><br>'+
          '<input type="text" list="cat-list-csv" data-csv-cat="'+t.id+'" value="'+esc(t.category)+'" style="width:160px; padding:3px 6px; font-size:12px; margin-top:2px;"></span>'+
        '<span class="num" style="flex:none; padding-top:3px; color:'+(t.type==='income'?'var(--positive)':'var(--ink)')+';">'+(t.type==='income'?'+ ':'– ')+usd2(t.amount)+'</span>'+
      '</div>';
    }).join('') + '<datalist id="cat-list-csv">'+allCats.map(function(c){ return '<option value="'+esc(c)+'">'; }).join('')+'</datalist>' +
    '</div>'+
    '<div style="margin-top:10px;"><button class="btn btn-primary" id="csv-import-btn">Import selected transactions</button></div>';
  Array.prototype.forEach.call(reviewEl.querySelectorAll('[data-csv-check]'), function(cb){
    cb.addEventListener('change', function(){ var r = csvReviewRows.find(function(x){ return x.id===cb.getAttribute('data-csv-check'); }); if (r) r.checked = cb.checked; });
  });
  Array.prototype.forEach.call(reviewEl.querySelectorAll('[data-csv-cat]'), function(inp){
    inp.addEventListener('change', function(){ var r = csvReviewRows.find(function(x){ return x.id===inp.getAttribute('data-csv-cat'); }); if (r) r.category = inp.value.trim() || 'Other'; });
  });
  var importBtn = document.getElementById('csv-import-btn');
  if (importBtn) importBtn.addEventListener('click', function(){
    var toAdd = csvReviewRows.filter(function(t){ return t.checked; });
    toAdd.forEach(function(t){
      state.transactions.push({id:'t'+Date.now()+Math.random().toString(36).slice(2,7), date:t.date, merchant:t.merchant, category:t.category, amount:t.amount, type:t.type, account:'acc-checking', auto:true});
    });
    csvImportRows = []; csvImportHeaders = []; csvReviewRows = [];
    persist(); toast('Imported '+toAdd.length+' transaction'+(toAdd.length===1?'':'s')+' from CSV'); route();
  });
}

/* ============================================================
   CHARTS (Chart.js)
   ============================================================ */
// Categorical colors validated with the dataviz skill's CVD/contrast checker (validate_palette.js) — the app's own
// muted brand tones (navy/teal/plum/stone) read great as text and small dots but measured too low in chroma and too
// close in hue to survive as chart data marks (several adjacent pairs failed colorblind-separation outright). So
// charts use this separately-validated, higher-chroma set for identity, while every other pill/dot in the app keeps
// the quieter brand palette. Fixed order — never reassigned per render — is itself the CVD-safety mechanism.
var CHART_CAT_COLORS = {
  'Bills':            { light:'#2a78d6', dark:'#3987e5' },
  'Groceries':        { light:'#eb6834', dark:'#d95926' },
  'Dining Out':       { light:'#1baf7a', dark:'#199e70' },
  'Transportation':   { light:'#eda100', dark:'#c98500' },
  'Other Variable':   { light:'#e87ba4', dark:'#d55181' },
  'Savings':          { light:'#008300', dark:'#008300' },
  'Debt Payments':    { light:'#4a3aa7', dark:'#9085e9' }
};
function isDarkMode(){
  var t = document.documentElement.getAttribute('data-theme');
  if (t==='dark') return true;
  if (t==='light') return false;
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function hexToRgba(hex, alpha){
  hex = (hex||'').replace('#','');
  if (hex.length===3) hex = hex.split('').map(function(c){ return c+c; }).join('');
  var n = parseInt(hex,16);
  if (isNaN(n) || hex.length!==6) return 'rgba(0,0,0,'+alpha+')';
  var r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}
function catChartColor(name){
  var c = CHART_CAT_COLORS[name];
  if (!c) return isDarkMode() ? '#8a93a3' : '#9aa3b0';
  return isDarkMode() ? c.dark : c.light;
}
function chartLegendHtml(items){
  // items: [{label, color, value, pct}] — real HTML legend instead of a canvas-drawn one, so text stays crisp
  // and the value (and, when given, its % share of the whole) sits right next to the swatch instead of
  // forcing a hover over the chart to find it out.
  return items.map(function(it){
    var rightHtml = '';
    if (it.value!=null || it.pct!=null){
      rightHtml = '<span class="lg-right">'+
        (it.value!=null ? '<span class="lg-val">'+usd0(it.value)+'</span>' : '')+
        (it.pct!=null ? '<span class="lg-pct">'+Math.round(it.pct)+'%</span>' : '')+
      '</span>';
    }
    return '<div class="chart-legend-item">'+
      '<span class="lg-name"><span class="swatch" style="background:'+it.color+'"></span><span class="lg-name-text">'+esc(it.label)+'</span></span>'+
      rightHtml+
    '</div>';
  }).join('');
}
// last 5 real calendar months ending at state.month, for chart x-axes that used to show meaningless "M0, M1, M2..." ticks
function trailingMonthLabels(n, ym){
  var p = parseYM(ym), out = [];
  for (var i=n-1; i>=0; i--){ var d = new Date(p.y, p.m-i, 1); out.push(d.toLocaleDateString('en-US',{month:'short'})); }
  return out;
}
function futureMonthLabels(n, ym){
  var p = parseYM(ym), out = [];
  for (var i=0; i<n; i++){ var d = new Date(p.y, p.m+i, 1); out.push(d.toLocaleDateString('en-US',{month:'short',year:'2-digit'})); }
  return out;
}
// pointRadius/pointBackgroundColor arrays that keep a line clean everywhere except a single emphasized end marker —
// per the dataviz skill's "emphasized endpoint" guidance, instead of either no points at all or a dot on every one.
function endpointStyle(n, color, emphasizedRadius){
  var radii = [], colors = [];
  for (var i=0;i<n;i++){ radii.push(i===n-1?(emphasizedRadius||5):0); colors.push(color); }
  return { pointRadius:radii, pointHoverRadius: radii.map(function(r){ return r?r+1:3; }), pointBackgroundColor:colors };
}
function paintCharts(view){
  if (typeof Chart === 'undefined') return;
  var ink = cssVar('--ink') || '#1C2430';
  var inkSoft = cssVar('--ink-soft') || '#5E6774';
  var inkFaint = cssVar('--ink-faint') || '#8B8F98';
  var line = cssVar('--line') || '#DEDAD0';
  var surface = cssVar('--surface') || '#FFFFFF';
  var positive = cssVar('--positive') || '#2F7D5B';
  var navy = cssVar('--navy') || '#2F4157';
  var negative = cssVar('--negative') || '#9C3B34';
  var accent = cssVar('--accent') || '#A8792E';
  Chart.defaults.font.family = "'Public Sans', sans-serif";
  Chart.defaults.color = inkSoft;
  Chart.defaults.borderColor = line;
  // one themed tooltip look for every chart: matches the app's own card styling (surface/line/ink tokens)
  // instead of Chart.js's default near-black box, and every callback below formats real currency, not raw floats.
  Chart.defaults.plugins.tooltip.enabled = true;
  Chart.defaults.plugins.tooltip.backgroundColor = surface;
  Chart.defaults.plugins.tooltip.titleColor = ink;
  Chart.defaults.plugins.tooltip.bodyColor = inkSoft;
  Chart.defaults.plugins.tooltip.borderColor = line;
  Chart.defaults.plugins.tooltip.borderWidth = 1;
  Chart.defaults.plugins.tooltip.cornerRadius = 8;
  Chart.defaults.plugins.tooltip.padding = 10;
  Chart.defaults.plugins.tooltip.boxPadding = 5;
  Chart.defaults.plugins.tooltip.titleFont = { family:"'Public Sans', sans-serif", weight:'600', size:12.5 };
  Chart.defaults.plugins.tooltip.bodyFont = { family:"'IBM Plex Mono', monospace", size:12 };
  var dashedGrid = { color:line, drawTicks:false, borderDash:[3,4] };
  var moneyTick = { callback:function(v){ return '$'+(Math.abs(v)>=1000?(v/1000).toFixed(v%1000?1:0)+'k':v); } };

  if (view==='overview' || view==='budget'){
    var el = document.getElementById('chart-incomeexp');
    if (el){
      killChart('incomeexp');
      var savedSeries = state.monthlyHistory.income.map(function(v,i){ return v - state.monthlyHistory.expenses[i]; });
      chartInstances.incomeexp = new Chart(el, { data:{
        labels: state.monthlyHistory.labels,
        datasets:[
          {type:'bar', label:'Income', data: state.monthlyHistory.income, backgroundColor:positive, borderRadius:4, maxBarThickness:22, order:2},
          {type:'bar', label:'Expenses', data: state.monthlyHistory.expenses, backgroundColor:navy, borderRadius:4, maxBarThickness:22, order:2},
          Object.assign({type:'line', label:'Saved', data: savedSeries, borderColor:accent, backgroundColor:hexToRgba(accent,0.12), fill:false, tension:0.3, borderWidth:2, order:1, yAxisID:'y'}, endpointStyle(savedSeries.length, accent, 3))
        ]},
        options:{ responsive:true, maintainAspectRatio:false,
          interaction:{ mode:'index', intersect:false },
          plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(ctx){ return ' '+ctx.dataset.label+': '+usd0(ctx.parsed.y); } } } },
          scales:{ y:{ grid:dashedGrid, ticks:moneyTick, border:{display:false} }, x:{ grid:{display:false}, border:{display:false} } } }
      });
      var legendEl = document.getElementById('legend-incomeexp');
      if (legendEl) legendEl.innerHTML = chartLegendHtml([
        {label:'Income', color:positive}, {label:'Expenses', color:navy}, {label:'Saved', color:accent}
      ]);
    }
    var el2 = document.getElementById('chart-breakdown');
    if (el2){
      killChart('breakdown');
      var groc = state.variable.find(function(v){return v.name==='Groceries';});
      var dine = state.variable.find(function(v){return v.name==='Dining Out';});
      var trans = state.variable.find(function(v){return v.name==='Transportation';});
      var otherVar = variableBudgetTotal() - (groc?groc.budgeted:0) - (dine?dine.budgeted:0) - (trans?trans.budgeted:0);
      var labels = ['Bills','Groceries','Dining Out','Transportation','Other Variable','Debt Payments','Savings'];
      var data = [billsBudgetTotal(), groc?groc.budgeted:0, dine?dine.budgeted:0, trans?trans.budgeted:0, otherVar, debtMinTotal(), savingsMonthlyTotal()];
      var colors = labels.map(catChartColor);
      var total = data.reduce(function(s,v){return s+v;},0);
      chartInstances.breakdown = new Chart(el2, { type:'doughnut', data:{ labels:labels, datasets:[{data:data, backgroundColor:colors, borderColor:surface, borderWidth:2, hoverOffset:4}] },
        options:{ responsive:true, maintainAspectRatio:false, cutout:'68%',
          plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(ctx){ var pct = total? Math.round(ctx.parsed/total*100) : 0; return ' '+ctx.label+': '+usd0(ctx.parsed)+' ('+pct+'%)'; } } } } } });
      var centerEl = document.getElementById('breakdown-center');
      if (centerEl) centerEl.innerHTML = '<div class="dc-value">'+usd0(total)+'</div><div class="dc-label">planned / mo</div>';
      var legendEl2 = document.getElementById('legend-breakdown');
      if (legendEl2) legendEl2.innerHTML = chartLegendHtml(labels.map(function(l,i){ return {label:l, color:colors[i], value:data[i], pct: total? (data[i]/total*100) : 0}; }));
    }
    var elBI = document.getElementById('chart-bills-income');
    if (elBI){
      killChart('billsincome');
      var totalIncomeForChart = incomeTotalPlanned();
      var billIncomeRows = state.bills.map(function(b){
        var monthlyEq = billMonthlyEquivalent(b);
        return { name:b.name, amount:monthlyEq, pct: totalIncomeForChart>0 ? (monthlyEq/totalIncomeForChart*100) : 0, color: catChartColor(b.name) };
      }).sort(function(a,b){ return b.pct-a.pct; });
      chartInstances.billsincome = new Chart(elBI, { type:'bar', data:{
        labels: billIncomeRows.map(function(r){ return r.name; }),
        datasets:[{ label:'% of income', data: billIncomeRows.map(function(r){ return +r.pct.toFixed(1); }), backgroundColor: billIncomeRows.map(function(r){return r.color;}), borderRadius:4, maxBarThickness:18 }]
      }, options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(ctx){ var row = billIncomeRows[ctx.dataIndex]; return ' '+usd0(row.amount)+' — '+ctx.parsed.x.toFixed(1)+'% of income'; } } } },
        scales:{ x:{ grid:dashedGrid, ticks:{ callback:function(v){ return v+'%'; } }, border:{display:false} }, y:{ grid:{display:false}, border:{display:false} } } } });
      // visible legend under the chart — the % is always readable here, not just via hover tooltip
      var legendBI = document.getElementById('legend-bills-income');
      if (legendBI) legendBI.innerHTML = chartLegendHtml(billIncomeRows.map(function(r){ return {label:r.name, color:r.color, value:r.amount, pct:r.pct}; }));
    }
  }
  if (view==='debt'){
    var el3 = document.getElementById('chart-debt');
    if (el3){
      killChart('debt');
      var sim = simulateDebtPayoff(state.debts, state.debtMethod, state.debtExtra);
      var span = Math.min(sim.timeline.length, 60); // cap the label list on very long payoffs; the line itself still plots every month
      chartInstances.debt = new Chart(el3, { type:'line', data:{
        labels: futureMonthLabels(sim.timeline.length, state.month),
        datasets:[ Object.assign({ label:'Remaining balance', data: sim.timeline, borderColor:negative, backgroundColor:hexToRgba(negative,0.14), fill:true, tension:0.25, borderWidth:2 }, endpointStyle(sim.timeline.length, negative)) ]
      }, options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(ctx){ return ' Balance: '+usd0(ctx.parsed.y); } } } },
        scales:{ y:{ grid:dashedGrid, ticks:moneyTick, border:{display:false} }, x:{ grid:{display:false}, border:{display:false}, ticks:{ maxTicksLimit:Math.min(span,8) } } } } });
    }
  }
  if (view==='networth'){
    var el4 = document.getElementById('chart-networth');
    if (el4){
      killChart('networth');
      var hist = state.netWorth.history.map(function(h){return h.value;});
      var m = metrics(state.month);
      hist[hist.length-1] = m.netWorth;
      chartInstances.networth = new Chart(el4, { type:'line', data:{
        labels: state.netWorth.history.map(function(h){return h.month;}),
        datasets:[ Object.assign({ label:'Net worth', data:hist, borderColor:accent, backgroundColor:hexToRgba(accent,0.14), fill:true, tension:0.3, borderWidth:2 }, endpointStyle(hist.length, accent)) ]
      }, options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(ctx){ return ' Net worth: '+usd0(ctx.parsed.y); } } } },
        scales:{ y:{ grid:dashedGrid, ticks:moneyTick, border:{display:false} }, x:{ grid:{display:false}, border:{display:false} } } } });
    }
  }
}

/* ============================================================
   EVENT WIRING
   ============================================================ */
function toast(msg){
  var t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:10px; font-size:13px; z-index:999; box-shadow:var(--shadow);';
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2600);
}

function wireView(view){
  paintCharts(view);

  // live "→ lands on day X this month" preview next to any day-of-month field — recomputed as the user types,
  // so what a value like 30 or 31 actually resolves to is visible immediately, not left to guess.
  Array.prototype.forEach.call(document.querySelectorAll('[data-day-input]'), function(inp){
    var preview = inp.parentElement.querySelector('[data-day-preview]');
    if (!preview) return;
    inp.addEventListener('input', function(){ preview.textContent = dayPreviewText(inp.value, state.month); });
  });

  // generic add-forms (toggle + submit)
  Array.prototype.forEach.call(document.querySelectorAll('[data-toggle-form]'), function(btn){
    btn.addEventListener('click', function(){ var f=document.getElementById(btn.getAttribute('data-toggle-form')); f.hidden = !f.hidden; });
  });
  // generic conditional fields (addForm's dependsOnField/dependsOnValue) — e.g. the add-bill form's
  // "Month" field only matters once "Yearly" is picked, so it stays hidden until then.
  Array.prototype.forEach.call(document.querySelectorAll('.form-row [data-field]'), function(ctrl){
    ctrl.addEventListener('change', function(){
      var formRow = ctrl.closest('.form-row'); if (!formRow) return;
      var fieldName = ctrl.getAttribute('data-field');
      Array.prototype.forEach.call(formRow.querySelectorAll('[data-dep-field="'+fieldName+'"]'), function(depEl){
        depEl.hidden = (depEl.getAttribute('data-dep-value') !== ctrl.value);
      });
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-submit-form]'), function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-submit-form');
      var wrap = document.getElementById(id+'-form');
      var vals = {}; Array.prototype.forEach.call(wrap.querySelectorAll('[data-field]'), function(inp){ vals[inp.getAttribute('data-field')] = inp.value; });
      if (id==='add-variable'){
        if (!vals.name || !vals.budgeted) { toast('Enter a name and budget'); return; }
        state.variable.push({id:'v'+Date.now(), name:vals.name, budgeted: clampMoney(vals.budgeted)});
        persist(); toast('Added ' + vals.name); route();
      }
      if (id==='add-goal'){
        if (!vals.name || !vals.goal){ toast('Enter a name and target amount'); return; }
        state.savings.push({id:'s'+Date.now(), name:vals.name, goal: Math.max(1, clampMoney(vals.goal) || 1), monthly: clampMoney(vals.monthly), saved: clampMoney(vals.saved), icon:'goal'});
        persist(); toast('Added ' + vals.name); route();
      }
      if (id==='add-debt'){
        if (!vals.name || !vals.balance){ toast('Enter a name and balance'); return; }
        state.debts.push({id:'d'+Date.now(), name:vals.name, balance: clampMoney(vals.balance), apr: clampMoney(vals.apr), minPayment: clampMoney(vals.minPayment), dueDay: clampDay(vals.dueDay)});
        persist(); toast('Added ' + vals.name); route();
      }
      if (id==='add-income'){
        if (!vals.name || !vals.amount){ toast('Enter a name and amount'); return; }
        var freq = INCOME_FREQUENCIES[vals.frequency] ? vals.frequency : 'monthly';
        var newIncome = {id:'i'+Date.now(), name:vals.name, frequency: freq, payDay: clampDay(vals.payDay), amount:0};
        if (freq==='variable'){ newIncome.amountsByMonth = {}; newIncome.amountsByMonth[state.month] = clampMoney(vals.amount); }
        else { newIncome.amount = clampMoney(vals.amount); }
        state.income.push(newIncome);
        persist(); toast('Added ' + vals.name); route();
      }
      if (id==='add-bill'){
        if (!vals.name || !vals.budgeted){ toast('Enter a name and amount'); return; }
        var billFreqVal = vals.frequency==='yearly' ? 'yearly' : 'monthly';
        var newBill = {id:'b'+Date.now(), name:vals.name, budgeted: clampMoney(vals.budgeted), dueDay: clampDay(vals.dueDay), frequency: billFreqVal};
        if (billFreqVal==='yearly') newBill.dueMonth = clamp(parseInt(vals.dueMonth)||1, 1, 12);
        state.bills.push(newBill);
        billsExpanded = true; // so a newly-added bill (appended at the end) is never hidden behind a "show more" collapse
        persist(); toast('Added ' + vals.name); route();
      }
      if (id==='add-asset'){
        if (!vals.name || !vals.value){ toast('Enter a name and value'); return; }
        state.netWorth.assets.push({name:vals.name, value: clampMoney(vals.value)});
        persist(); toast('Added ' + vals.name); route();
      }
      if (id==='add-liability'){
        if (!vals.name || !vals.value){ toast('Enter a name and amount'); return; }
        state.netWorth.liabilities = state.netWorth.liabilities || [];
        state.netWorth.liabilities.push({name:vals.name, value: clampMoney(vals.value)});
        persist(); toast('Added ' + vals.name); route();
      }
    });
  });

  if (view==='overview'){
    Array.prototype.forEach.call(document.querySelectorAll('#range-seg button'), function(btn){
      btn.addEventListener('click', function(){
        rangeState.mode = btn.getAttribute('data-range');
        if (rangeState.mode==='custom' && !rangeState.start){ rangeState.start = state.month+'-01'; rangeState.end = state.today; }
        saveRangeState(rangeState); route();
      });
    });
    var rangeApply = document.getElementById('range-apply');
    if (rangeApply) rangeApply.addEventListener('click', function(){
      var s = document.getElementById('range-start').value, e = document.getElementById('range-end').value;
      if (!s || !e || s>e){ toast('Pick a valid start and end date'); return; }
      rangeState.start = s; rangeState.end = e; saveRangeState(rangeState); route();
    });
    var csvBtn = document.getElementById('export-csv-btn');
    if (csvBtn) csvBtn.addEventListener('click', exportCSV);
    var printBtn = document.getElementById('print-report-btn');
    if (printBtn) printBtn.addEventListener('click', printReport);
    var closureAllocateBtn = document.getElementById('closure-allocate-btn');
    if (closureAllocateBtn) closureAllocateBtn.addEventListener('click', function(){
      var ym = closureAllocateBtn.getAttribute('data-ym');
      var amt = parseFloat(closureAllocateBtn.getAttribute('data-amt'));
      var goalId = document.getElementById('closure-goal-select').value;
      var g = savingsById(goalId);
      if (!g){ toast('Pick a goal first'); return; }
      g.saved += amt;
      state.transactions.push({id:'t'+Date.now(), date: state.today, merchant: g.name+' Transfer ('+monthLabel(ym)+' surplus)', category:g.name, amount:amt, type:'savings', savingsId:g.id, account:'acc-savings', auto:false});
      state.monthClosures = state.monthClosures || {};
      state.monthClosures[ym] = {status:'allocated', allocatedTo:goalId, amount:amt};
      persist(); toast('Moved '+usd0(amt)+' into '+g.name); route();
    });
    var closureDismissBtn = document.getElementById('closure-dismiss-btn');
    if (closureDismissBtn) closureDismissBtn.addEventListener('click', function(){
      var ym = closureDismissBtn.getAttribute('data-ym');
      state.monthClosures = state.monthClosures || {};
      state.monthClosures[ym] = {status:'dismissed'};
      persist(); route();
    });
    var closureAckBtn = document.getElementById('closure-ack-btn');
    if (closureAckBtn) closureAckBtn.addEventListener('click', function(){
      var ym = closureAckBtn.getAttribute('data-ym');
      state.monthClosures = state.monthClosures || {};
      state.monthClosures[ym] = {status:'acknowledged'};
      persist(); route();
    });
  }

  if (view==='income'){
    Array.prototype.forEach.call(document.querySelectorAll('[data-income-field]'), function(inp){
      inp.addEventListener('change', function(){
        var i = incomeById(inp.getAttribute('data-income-id')); if (!i) return;
        var field = inp.getAttribute('data-income-field');
        if (field==='name'){ i.name = inp.value; }
        else if (field==='frequency'){
          var newFreq = INCOME_FREQUENCIES[inp.value] ? inp.value : 'monthly';
          var wasVariable = incomeFreq(i)==='variable', willBeVariable = newFreq==='variable';
          if (willBeVariable && !wasVariable){
            i.amountsByMonth = i.amountsByMonth || {};
            i.amountsByMonth[state.month] = i.amount||0;
          } else if (!willBeVariable && wasVariable){
            i.amount = incomeAmountForMonth(i, state.month);
          }
          i.frequency = newFreq;
        }
        else if (field==='payDay'){ i.payDay = clampDay(inp.value); }
        else if (field==='amount'){
          if (incomeFreq(i)==='variable'){ i.amountsByMonth = i.amountsByMonth || {}; i.amountsByMonth[state.month] = clampMoney(inp.value); }
          else { i.amount = clampMoney(inp.value); }
        }
        else { i[field] = clampMoney(inp.value); }
        persist(); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-income-restore]'), function(btn){
      btn.addEventListener('click', function(){
        var i = incomeById(btn.getAttribute('data-income-restore')); if (!i) return;
        var last = incomeLastKnownAmount(i, state.month);
        i.amountsByMonth = i.amountsByMonth || {};
        i.amountsByMonth[state.month] = last;
        persist(); toast('Restored '+usd0(last)+' for '+i.name+' this month'); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-income-remove]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-income-remove');
        var i = incomeById(id);
        confirmDelete('Remove income source "'+esc(i?i.name:'')+'"?', function(){
          state.income = state.income.filter(function(x){ return x.id!==id; });
          persist(); toast(i?i.name+' removed':'Income removed'); route();
        });
      });
    });
  }

  if (view==='budget'){
    var billsToggleBtn = document.getElementById('bills-toggle-expand');
    if (billsToggleBtn) billsToggleBtn.addEventListener('click', function(){ billsExpanded = !billsExpanded; route(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-bill-field]'), function(el){
      el.addEventListener('change', function(){
        var b = findById(state.bills, el.getAttribute('data-bill-id')); if (!b) return;
        var field = el.getAttribute('data-bill-field');
        if (field==='name'){
          var newName = el.value.trim();
          if (!newName){ el.value = b.name; return; }
          renameBill(b.id, newName);
          return;
        }
        if (field==='frequency'){
          b.frequency = el.value==='yearly' ? 'yearly' : 'monthly';
          if (b.frequency==='yearly' && !b.dueMonth) b.dueMonth = 1;
        } else if (field==='dueDay'){ b.dueDay = clampDay(el.value); }
        else if (field==='dueMonth'){ b.dueMonth = clamp(parseInt(el.value)||1, 1, 12); }
        else if (field==='budgeted'){ b.budgeted = clampMoney(el.value); }
        persist(); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-bill-remove]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-bill-remove');
        var b = findById(state.bills, id);
        confirmDelete('Remove '+(b?('"'+esc(b.name)+'"'):'this bill')+'? This can\'t be undone.', function(){ removeBill(id); });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-var-budget]'), function(inp){
      inp.addEventListener('change', function(){ var v = state.variable.find(function(x){return x.id===inp.getAttribute('data-var-budget');}); if(v){ v.budgeted = clampMoney(inp.value); persist(); route(); } });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-cat-rename]'), function(inp){
      inp.addEventListener('change', function(){
        var oldName = inp.getAttribute('data-cat-rename');
        var newName = inp.value.trim();
        if (!newName){ inp.value = oldName; return; }
        renameCategory(oldName, newName);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-cat-remove]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-cat-remove');
        var cat = state.variable.find(function(v){ return v.id===id; });
        confirmDelete('Remove category "'+esc(cat?cat.name:'')+'"? Past transactions keep the name, but it won\'t be budgeted going forward.', function(){ removeCategory(id); });
      });
    });
  }

  if (view==='transactions'){
    var ccySelect = document.getElementById('tx-currency');
    var fxRow = document.getElementById('tx-fx-row');
    var fxNote = document.getElementById('tx-fx-note');
    var fxRateInput = document.getElementById('tx-fxrate');
    var fxLookupSeq = 0; // guards a slow/late response from overwriting a newer lookup's result
    function setFxNote(text){ if (fxNote){ fxNote.textContent = text; fxNote.hidden = false; } }
    function tryAutoFetchRate(){
      if (!ccySelect || ccySelect.value === baseCcy()) return;
      var from = ccySelect.value, to = baseCcy();
      var dateEl = document.getElementById('tx-date');
      var dateVal = (dateEl && dateEl.value && dateEl.value <= state.today) ? dateEl.value : null;
      var mySeq = ++fxLookupSeq;
      setFxNote('Looking up today’s '+from+' → '+to+' rate…');
      if (fxRateInput) fxRateInput.disabled = true;
      fetchLiveRate(from, to, dateVal).then(function(rate){
        if (mySeq !== fxLookupSeq) return; // superseded by a newer lookup
        if (fxRateInput) fxRateInput.disabled = false;
        if (rate){
          if (fxRateInput) fxRateInput.value = rate.toFixed(4);
          setFxNote('Live rate: 1 '+from+' = '+rate.toFixed(4)+' '+to+' (as of '+(dateVal||'today')+'). Edit it if a different rate applies.');
        } else {
          setFxNote('Couldn’t reach the live rate service right now (this always happens while previewing inside Claude — it works once Steadyspend is running on its own hosting). Enter the rate from your statement or bank.');
        }
      });
    }
    function syncFxVisibility(){
      var isForeign = ccySelect.value !== baseCcy();
      fxRow.hidden = !isForeign; fxNote.hidden = !isForeign;
      if (isForeign) tryAutoFetchRate();
    }
    if (ccySelect){
      syncFxVisibility();
      ccySelect.addEventListener('change', syncFxVisibility);
      var dateElForFx = document.getElementById('tx-date');
      if (dateElForFx) dateElForFx.addEventListener('change', function(){ if (ccySelect.value !== baseCcy()) tryAutoFetchRate(); });
    }
    document.getElementById('tx-add-btn').addEventListener('click', function(){
      var date = document.getElementById('tx-date').value || state.today;
      var merchant = document.getElementById('tx-merchant').value.trim();
      var type = document.getElementById('tx-type').value;
      var category = document.getElementById('tx-category').value.trim() || (type==='income'?'Income':'Uncategorized');
      var amount = parseFloat(document.getElementById('tx-amount').value);
      var currency = ccySelect ? ccySelect.value : baseCcy();
      var note = (document.getElementById('tx-note').value || '').trim();
      if (!merchant || !amount || amount<=0){ toast('Add a merchant and amount'); return; }
      var baseAmount = amount, fxRate = 1;
      if (currency !== baseCcy()){
        fxRate = parseFloat(document.getElementById('tx-fxrate').value);
        if (!fxRate || fxRate<=0){ toast('Enter (or estimate) the exchange rate to '+baseCcy()); return; }
        baseAmount = amount * fxRate;
      }
      var row = {id:'t'+Date.now(), date:date, merchant:merchant, category:category, amount:amount, type:type, account:'acc-checking', auto:false};
      if (note) row.note = note;
      if (currency !== baseCcy()){ row.currency = currency; row.fxRate = fxRate; row.baseAmount = baseAmount; }
      state.transactions.push(row);
      persist(); toast('Transaction added'); route();
    });
    var csvBtn = document.getElementById('csv-read-btn');
    if (csvBtn) csvBtn.addEventListener('click', handleCSVFile);
  }

  if (view==='calendar'){
    Array.prototype.forEach.call(document.querySelectorAll('[data-bill-toggle]'), function(el){
      el.addEventListener('click', function(){
        var billId = el.getAttribute('data-bill-toggle');
        var ym = state.month;
        var existing = billPaidTx(billId, ym);
        if (existing){ toast('Already marked paid'); return; }
        var bill = state.bills.find(function(b){return b.id===billId;});
        var day = el.getAttribute('data-day');
        state.transactions.push({id:'t'+Date.now(), date: ym+'-'+String(day).padStart(2,'0'), merchant:bill.name, category:bill.name, amount:bill.budgeted, type:'bill', billId:bill.id, account:'acc-checking', auto:false});
        persist(); toast(bill.name+' marked paid'); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-debt-toggle]'), function(el){
      el.addEventListener('click', function(){
        var debtId = el.getAttribute('data-debt-toggle');
        var ym = state.month;
        if (debtPaidTx(debtId, ym)){ toast('Already marked paid'); return; }
        var d = debtById(debtId);
        var day = el.getAttribute('data-day');
        state.transactions.push({id:'t'+Date.now(), date: ym+'-'+String(day).padStart(2,'0'), merchant:d.name+' payment', category:d.name, amount:d.minPayment, type:'debt', debtId:d.id, account:'acc-checking', auto:false});
        persist(); toast(d.name+' payment marked paid'); route();
      });
    });
  }

  if (view==='debt'){
    Array.prototype.forEach.call(document.querySelectorAll('#method-seg button'), function(btn){
      btn.addEventListener('click', function(){ state.debtMethod = btn.getAttribute('data-method'); persist(); route(); });
    });
    var extraInp = document.getElementById('extra-payment');
    if (extraInp) extraInp.addEventListener('change', function(){ state.debtExtra = clampMoney(extraInp.value); persist(); route(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-debt-field]'), function(inp){
      inp.addEventListener('change', function(){
        var d = debtById(inp.getAttribute('data-debt-id'));
        if (!d) return;
        var field = inp.getAttribute('data-debt-field');
        d[field] = (field==='dueDay') ? clampDay(inp.value) : clampMoney(inp.value);
        persist(); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-debt-remove]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-debt-remove');
        var d = debtById(id);
        confirmDelete('Remove '+(d?('"'+esc(d.name)+'"'):'this debt')+'? This can\'t be undone.', function(){
          state.debts = state.debts.filter(function(x){ return x.id!==id; });
          persist(); toast(d?d.name+' removed':'Debt removed'); route();
        });
      });
    });
  }

  if (view==='savings'){
    Array.prototype.forEach.call(document.querySelectorAll('[data-goal-submit]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-goal-submit');
        var inp = document.querySelector('[data-goal-add="'+id+'"]');
        var amt = parseFloat(inp.value);
        if (!amt || amt<=0){ toast('Enter an amount'); return; }
        var g = savingsById(id); g.saved += amt;
        state.transactions.push({id:'t'+Date.now(), date: state.today, merchant: g.name+' Transfer', category:g.name, amount:amt, type:'savings', savingsId:g.id, account:'acc-savings', auto:false});
        persist(); toast('Added '+usd0(amt)+' to '+g.name); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-goal-saved]'), function(inp){
      inp.addEventListener('change', function(){
        var g = savingsById(inp.getAttribute('data-goal-saved')); if (!g) return;
        g.saved = clampMoney(inp.value);
        persist(); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-goal-target]'), function(inp){
      inp.addEventListener('change', function(){
        var g = savingsById(inp.getAttribute('data-goal-target')); if (!g) return;
        g.goal = Math.max(1, clampMoney(inp.value) || 1);
        persist(); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-goal-monthly]'), function(inp){
      inp.addEventListener('change', function(){
        var g = savingsById(inp.getAttribute('data-goal-monthly')); if (!g) return;
        g.monthly = clampMoney(inp.value);
        persist(); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-goal-remove]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-goal-remove');
        var g = savingsById(id);
        confirmDelete('Remove goal '+(g?('"'+esc(g.name)+'"'):'')+'? This can\'t be undone.', function(){
          state.savings = state.savings.filter(function(x){ return x.id!==id; });
          persist(); toast(g?g.name+' removed':'Goal removed'); route();
        });
      });
    });
  }

  if (view==='networth'){
    Array.prototype.forEach.call(document.querySelectorAll('[data-asset-field]'), function(inp){
      inp.addEventListener('change', function(){
        var idx = parseInt(inp.getAttribute('data-asset-idx'));
        var field = inp.getAttribute('data-asset-field');
        if (!state.netWorth.assets[idx]) return;
        state.netWorth.assets[idx][field] = field==='value' ? clampMoney(inp.value) : inp.value;
        persist(); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-asset-remove]'), function(btn){
      btn.addEventListener('click', function(){
        var idx = parseInt(btn.getAttribute('data-asset-remove'));
        var a = state.netWorth.assets[idx];
        confirmDelete('Remove '+(a?('"'+esc(a.name)+'"'):'this asset')+' from your assets?', function(){
          state.netWorth.assets.splice(idx,1); persist(); toast(a?a.name+' removed':'Asset removed'); route();
        });
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-liab-field]'), function(inp){
      inp.addEventListener('change', function(){
        var idx = parseInt(inp.getAttribute('data-liab-idx'));
        var field = inp.getAttribute('data-liab-field');
        state.netWorth.liabilities = state.netWorth.liabilities || [];
        if (!state.netWorth.liabilities[idx]) return;
        state.netWorth.liabilities[idx][field] = field==='value' ? clampMoney(inp.value) : inp.value;
        persist(); route();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-liab-remove]'), function(btn){
      btn.addEventListener('click', function(){
        var idx = parseInt(btn.getAttribute('data-liab-remove'));
        var l = (state.netWorth.liabilities||[])[idx];
        confirmDelete('Remove '+(l?('"'+esc(l.name)+'"'):'this liability')+'?', function(){
          state.netWorth.liabilities.splice(idx,1); persist(); toast(l?l.name+' removed':'Removed'); route();
        });
      });
    });
  }

  if (view==='settings'){
    Array.prototype.forEach.call(document.querySelectorAll('[data-settingstab]'), function(btn){
      btn.addEventListener('click', function(){ settingsTab = btn.getAttribute('data-settingstab'); route(); });
    });
    var installBtn = document.getElementById('pwa-install-btn');
    if (installBtn){
      installBtn.addEventListener('click', function(){
        if (!deferredInstallPrompt) return;
        var statusEl = document.getElementById('pwa-install-status');
        deferredInstallPrompt.prompt();
        deferredInstallPrompt.userChoice.then(function(choice){
          deferredInstallPrompt = null;
          // Don't re-render here — the separate 'appinstalled' listener flips this card to the
          // "already installed" state once the OS actually finishes, which can lag slightly behind
          // this promise resolving. Re-rendering immediately would wipe this message before it's read.
          if (statusEl) statusEl.textContent = (choice && choice.outcome === 'accepted') ? 'Installed — check your home screen.' : 'No problem — you can install any time from this page.';
        }).catch(function(){});
      });
    }
    var clearBtn = document.getElementById('clear-data-btn');
    if (clearBtn) clearBtn.addEventListener('click', openClearDataModal);
  }

}

/* ================= MOBILE MENU (hamburger drawer — see MOBILE media query in template.html) ================= */
document.getElementById('menu-toggle').addEventListener('click', openMobileMenu);
document.getElementById('sidebar-backdrop').addEventListener('click', closeMobileMenu);

/* ================= MONTH NAV (kept for context switching; data is single-month demo) ================= */
document.getElementById('month-prev').addEventListener('click', function(){ toast('This prototype ships one live month of example data — the full app scrolls freely through history.'); });
document.getElementById('month-next').addEventListener('click', function(){ toast('This prototype ships one live month of example data — the full app scrolls freely through history.'); });

/* ================= THEME TOGGLE ================= */
var THEME_KEY = 'steadyspend-theme';
function applyTheme(t){
  var root = document.documentElement;
  if (t==='light') root.setAttribute('data-theme','light');
  else if (t==='dark') root.setAttribute('data-theme','dark');
  else root.removeAttribute('data-theme');
  var btn = document.getElementById('theme-toggle');
  btn.innerHTML = ic(t==='dark' ? 'sun' : (t==='light' ? 'sun' : 'sun'));
  btn.title = 'Theme: ' + (t||'system') + ' (click to change)';
}
var themeState = 'system';
try { themeState = localStorage.getItem(THEME_KEY) || 'system'; } catch(e){}
applyTheme(themeState);
document.getElementById('theme-toggle').addEventListener('click', function(){
  themeState = themeState==='system' ? 'light' : (themeState==='light' ? 'dark' : 'system');
  try { localStorage.setItem(THEME_KEY, themeState); } catch(e){}
  applyTheme(themeState);
  Object.keys(chartInstances).forEach(killChart);
  route();
});

/* ================= STYLE DIRECTION PREVIEW (temporary — for choosing a look) ================= */
var STYLE_KEY = 'steadyspend-style';
function applyStyle(s){
  if (!s || s==='ledger') document.documentElement.removeAttribute('data-style');
  else document.documentElement.setAttribute('data-style', s);
  Array.prototype.forEach.call(document.querySelectorAll('.style-dot'), function(d){ d.classList.toggle('active', d.getAttribute('data-style')===(s||'ledger')); });
}
var styleState = 'bloom';
try { styleState = localStorage.getItem(STYLE_KEY) || 'bloom'; } catch(e){}
applyStyle(styleState);
Array.prototype.forEach.call(document.querySelectorAll('.style-dot'), function(d){
  d.addEventListener('click', function(){
    styleState = d.getAttribute('data-style');
    try { localStorage.setItem(STYLE_KEY, styleState); } catch(e){}
    applyStyle(styleState);
    Object.keys(chartInstances).forEach(killChart);
    route();
  });
});

/* ================= INIT ================= */
renderHouseholdSwitcher(); renderCurrencySwitcher(); renderAccountWidget();
route();
initDownloads();
registerServiceWorker();
initAuth();

// "Add to Home Screen" only means anything when this page is the actual top-level site a real
// browser navigated to — inside this Claude preview it's loaded in a sandboxed iframe, where
// service-worker registration is pointless (often blocked outright) and would just be noise in
// the console. This same code registers for real the moment it's deployed on its own hosting.
function registerServiceWorker(){
  try {
    if (!('serviceWorker' in navigator)) return;
    if (window.self !== window.top) return; // running inside an iframe (e.g. this preview) — skip
    navigator.serviceWorker.register('./sw.js').catch(function(){ /* no sw.js at this origin yet — fine, the app still works without it */ });
  } catch(e){ /* never let install-related plumbing break the app itself */ }
}

})();
</script>
