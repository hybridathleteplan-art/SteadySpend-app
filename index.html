      '</select>'+
      '<span class="money-field"><input type="number" min="0" step="1" data-bill-field="budgeted" data-bill-id="'+b.id+'" value="'+b.budgeted+'" style="width:100px;" title="'+(isYearly?'Full amount charged once a year':'Amount charged every month')+'"></span>'+
      '<input type="number" min="1" max="31" data-bill-field="dueDay" data-bill-id="'+b.id+'" value="'+(b.dueDay||1)+'" style="width:60px; flex:none;" title="Day of month">'+
      (isYearly ? ('<select data-bill-field="dueMonth" data-bill-id="'+b.id+'" style="width:auto; flex:none;">'+MONTH_NAMES.map(function(mn,i){ return '<option value="'+(i+1)+'"'+((b.dueMonth||1)===(i+1)?' selected':'')+'>'+mn+'</option>'; }).join('')+'</select>') : '')+
      '<span class="mono faint" style="font-size:12px; margin-left:auto;">'+(isYearly?(usd0(monthlyEq)+'/mo equiv.'):(usd0(monthlyEq)+'/mo'))+'</span>'+
    '</div>'+
  '</div>';
}
function renderBudget(){
  var ym = state.month;
  // total *actual* money out this month (bills paid + variable spent + debt payments) — the denominator for
  // "what share of everything I've actually spent does this one category represent," distinct from the
  // budgeted-vs-actual ratio each row already shows.
  var totalActualExpense = metrics(ym).expenses;
  function row(name, budgeted, actual, editable, onEditAttr){
    var ratio = budgeted>0 ? actual/budgeted : 0;
    var barClass = ratio>1 ? 'over' : (ratio>0.85?'':'good');
    var shareOfTotal = (actual>0 && totalActualExpense>0) ? (actual/totalActualExpense*100) : null;
    return '<div class="cat-row">'+
      '<div class="cat-name"><span class="dot" style="background:'+catChartColor(name)+'"></span>'+categoryEmoji(name)+' '+esc(name)+'</div>'+
      '<div>'+
        '<div class="bar-track"><div class="bar-fill '+barClass+'" style="width:'+clamp(ratio*100,2,100)+'%"></div></div>'+
        '<div class="cat-figures"><span><strong style="color:var(--ink); font-weight:700;">'+usd0(actual)+'</strong> used</span><span>'+pct(ratio*100)+' of '+usd0(budgeted)+(shareOfTotal!=null?' · <strong style="color:var(--ink); font-weight:700;">'+pct(shareOfTotal)+'</strong> of total spending':'')+'</span></div>'+
      '</div>'+
      '<div class="cat-edit">'+(editable?('<span class="faint">Budget</span><input '+onEditAttr+' type="number" min="0" step="1" value="'+budgeted+'">'):'<span class="pill pill-neutral">fixed</span>')+'</div>'+
    '</div>';
  }
  var billsShowAll = billsExpanded || state.bills.length <= 5;
  var visibleBills = billsShowAll ? state.bills : state.bills.slice(0,5);
  var billsHtml = visibleBills.map(billRow).join('');
  var billsCollapseToggle = state.bills.length > 5
    ? '<button type="button" class="btn btn-ghost btn-sm" id="bills-toggle-expand" style="margin-top:8px;">'+(billsShowAll?'Show less':'Show all '+state.bills.length+' bills')+'</button>'
    : '';
  var varHtml = state.variable.map(function(v){
    return row(v.name, v.budgeted, categorySpent(v.name, ym), true, 'data-var-budget="'+v.id+'"');
  }).join('');
  var manageHtml = state.variable.map(function(v){
    return '<div class="cat-manage-row" style="grid-template-columns:1fr 30px;">'+
      '<input type="text" data-cat-rename="'+esc(v.name)+'" value="'+esc(v.name)+'">'+
      '<button class="btn btn-ghost remove-x-btn" data-cat-remove="'+v.id+'" title="Remove category">&times;</button>'+
    '</div>';
  }).join('');

  var priorityId = debtPriorityOrder()[0] ? debtPriorityOrder()[0].id : null;
  // Tappable paid/due status here too (same toggle Calendar offers) — no need to leave the Budget page
  // just to mark this month's loan payment as made.
  var debtHtml = state.debts.map(function(d){
    var label = d.name + (d.id===priorityId && state.debtExtra>0 ? ' + extra' : '');
    var dPaid = !!debtPaidTx(d.id, ym);
    var dStatusPill = '<span class="pill '+(dPaid?'pill-positive':'pill-neutral')+'" data-debt-toggle="'+d.id+'" style="cursor:pointer;" title="'+(dPaid?'Paid — tap to mark unpaid again':'Tap to mark this month\'s payment as paid')+'">'+(dPaid?'Paid':'Due '+ordinal(effDay(d.dueDay||1, ym)))+'</span>';
    return '<div class="cat-row" style="grid-template-columns:170px 1fr 140px;"><div class="cat-name">'+esc(label)+'</div>'+
      '<div class="faint">'+d.apr+'% APR · '+usd0(d.balance)+' balance</div>'+
      '<div class="cat-edit">'+dStatusPill+'<span class="num" style="font-weight:600;">'+usd0(d.minPayment)+'</span></div></div>';
  }).join('') + (state.debtExtra>0 ? '<div class="cat-row" style="grid-template-columns:170px 1fr 140px;"><div class="cat-name">Extra debt payment</div><div class="faint">applied to top-priority debt</div><div class="cat-edit num" style="justify-self:end; font-weight:600;">'+usd0(state.debtExtra)+'</div></div>' : '');
  var savingsHtml = state.savings.map(function(g){
    return '<div class="cat-row" style="grid-template-columns:1fr 140px;"><div class="cat-name">'+esc(g.name)+'</div><div class="cat-edit num" style="justify-self:end; font-weight:600;">'+usd0(g.monthly)+'</div></div>';
  }).join('');

  var totalIncome = incomeTotalPlanned();
  var totalOut = totalPlannedOutflow();
  var billsPct = totalIncome>0 ? (billsBudgetTotal()/totalIncome*100) : 0;
  var billIncomeRows = state.bills.map(function(b){
    var monthlyEq = billMonthlyEquivalent(b);
    return { name:b.name, amount:monthlyEq, pct: totalIncome>0 ? (monthlyEq/totalIncome*100) : 0, color: catChartColor(b.name) };
  }).sort(function(a,b){ return b.pct-a.pct; });

  return '<div class="view">'+
    '<div class="grid grid-3" style="margin-bottom:16px;">'+
      statTile('Planned income', totalIncome, 'var(--positive)')+
      statTile('Planned outflow', totalOut, 'var(--navy)')+
      statTile('Planned surplus', totalIncome-totalOut, (totalIncome-totalOut)>=0?'var(--positive)':'var(--negative)')+
    '</div>'+
    '<div class="faint" style="margin-bottom:16px;">Outflow = Bills + Variable expenses + Debt payments (incl. any extra) + Savings contributions — every line below adds up to the total above. Adding a category? A <strong style="color:var(--ink);">bill</strong> is a fixed recurring charge with its own due day (rent, insurance, a subscription) — add it in the Bills card. A <strong style="color:var(--ink);">variable expense</strong> is spending that changes month to month (groceries, dining out) — add it in the Variable expenses card.</div>'+
    (billIncomeRows.length ? '<div class="card card-pad" style="margin-bottom:16px;">'+
      '<div class="hstack" style="justify-content:space-between;"><div class="card-title" style="margin-bottom:0;">Bills as % of income</div><span class="kpi-value" style="font-size:20px; color:'+(billsPct>50?'var(--negative)':'var(--ink)')+';">'+pct(billsPct)+'</span></div>'+
      '<div class="faint" style="margin:2px 0 12px;">A common rule of thumb keeps fixed bills under ~50% of income, so there’s room left for variable spending, debt payoff, and savings. Each bar below is that bill’s own share of your planned monthly income.</div>'+
      '<div class="chart-wrap" style="height:'+Math.max(90, billIncomeRows.length*32)+'px;"><canvas id="chart-bills-income"></canvas></div>'+
    '</div>' : '')+
    '<div class="card card-pad" style="margin-bottom:16px;"><div class="hstack" style="justify-content:space-between;"><div class="card-title" style="margin-bottom:0;">Income</div><a href="#income" class="faint" style="text-decoration:none;">Manage income &rarr;</a></div><div class="kpi-value" style="margin-top:6px; color:var(--positive); font-size:22px;">'+usd0(totalIncome)+' <span class="faint" style="font-size:12px; font-weight:400;">planned / month</span></div></div>'+
    '<div class="card card-pad" style="margin-bottom:16px;"><div class="hstack" style="justify-content:space-between;"><div><div class="card-title" style="margin-bottom:2px;">Bills — recurring</div><div class="faint" style="font-size:11.5px;">Monthly or yearly — edit any field right in the row</div></div><span class="faint">'+usd0(billsBudgetTotal())+' / month</span></div>'+
      (billsHtml || '<div class="empty">No bills yet — add one below.</div>')+billsCollapseToggle+
      '<div class="divider"></div>'+
      addForm('add-bill', 'Add a bill', [
        {name:'name', ph:'Bill name', type:'text'},
        {name:'frequency', ph:'How often', type:'select', options:[{value:'monthly', label:'Monthly', selected:true},{value:'yearly', label:'Yearly'}]},
        {name:'budgeted', ph:'Amount', type:'number', money:true},
        {name:'dueDay', ph:'Due day (1-31, 31=last day)', type:'number', min:1, max:31, dayPreview:true},
        {name:'dueMonth', ph:'Month (yearly bills)', type:'select', options: MONTH_NAMES.map(function(mn,i){ return {value:String(i+1), label:mn, selected:i===0}; }), dependsOnField:'frequency', dependsOnValue:'yearly'}
      ], 'Add bill')+
    '</div>'+
    '<div class="card card-pad" style="margin-bottom:16px;"><div class="hstack" style="justify-content:space-between;"><div><div class="card-title" style="margin-bottom:2px;">Variable expenses — day to day</div><div class="faint" style="font-size:11.5px;">Changes month to month — set a target, not a fixed bill</div></div><span class="faint">'+usd0(variableBudgetTotal())+' / month</span></div>'+varHtml+
      '<div class="divider"></div>'+
      addForm('add-variable', 'Add a variable-expense category', [
        {name:'name', ph:'Category name', type:'text'},
        {name:'budgeted', ph:'Monthly budget', type:'number'},
        {name:'emoji', ph:'Emoji (optional)', type:'text', title:'Pick an emoji for this category — leave blank to use the standard one'}
      ], 'Add category')+
      '<div class="divider"></div>'+
      '<div class="card-title">Rename or remove a category</div>'+
      (manageHtml || '<div class="empty">No categories yet.</div>')+
    '</div>'+
    '<div class="card card-pad" style="margin-bottom:16px;"><div class="hstack" style="justify-content:space-between;"><div class="card-title" style="margin-bottom:0;">Debt payments</div><a href="#debt" class="faint" style="text-decoration:none;">Manage debts &rarr;</a></div>'+debtHtml+'</div>'+
    '<div class="card card-pad"><div class="hstack" style="justify-content:space-between;"><div class="card-title" style="margin-bottom:0;">Savings contributions</div><a href="#savings" class="faint" style="text-decoration:none;">Manage goals &rarr;</a></div>'+savingsHtml+'</div>'+
  '</div>';
}
function statTile(label, value, colorVar, raw){
  var display = raw ? esc(value) : usd0(value);
  return '<div class="card card-pad"><div class="card-title">'+label+'</div><div class="kpi-value" style="color:'+colorVar+'">'+display+'</div></div>';
}
function addForm(id, title, fields, cta){
  return '<div class="stack" id="'+id+'">'+
    '<button class="btn btn-sm" data-toggle-form="'+id+'-form">'+ic('plus')+' '+title+'</button>'+
    '<div class="form-row" id="'+id+'-form" hidden>'+
      fields.map(function(f){
        var depAttrs = f.dependsOnField ? (' data-dep-field="'+f.dependsOnField+'" data-dep-value="'+f.dependsOnValue+'"') : '';
        var depHidden = f.dependsOnField ? ' hidden' : '';
        var fieldHtml;
        if (f.type==='select'){
          fieldHtml = '<div class="field"><label>'+f.ph+'</label><select data-field="'+f.name+'">'+
            (f.options||[]).map(function(o){ return '<option value="'+esc(o.value)+'"'+(o.selected?' selected':'')+'>'+esc(o.label)+'</option>'; }).join('')+
          '</select></div>';
        } else {
          var inputHtml = '<input data-field="'+f.name+'" type="'+f.type+'" placeholder="'+f.ph+'"'+(f.min!=null?' min="'+f.min+'"':'')+(f.max!=null?' max="'+f.max+'"':'')+(f.title?' title="'+esc(f.title)+'"':'')+(f.dayPreview?' data-day-input':'')+'>';
          fieldHtml = '<div class="field"><label>'+f.ph+'</label>'+(f.money?('<span class="money-field" style="display:flex;">'+inputHtml+'</span>'):inputHtml)+
            (f.dayPreview ? '<div class="faint mono" data-day-preview style="font-size:10.5px; margin-top:3px;">'+esc(dayPreviewText(1, state.month))+'</div>' : '')+
          '</div>';
        }
        return f.dependsOnField ? ('<div'+depAttrs+depHidden+'>'+fieldHtml+'</div>') : fieldHtml;
      }).join('')+
      '<div class="field hstack" style="gap:8px;"><button class="btn btn-primary" data-submit-form="'+id+'">'+cta+'</button>'+
        '<button class="btn btn-ghost" type="button" data-cancel-form="'+id+'">Cancel</button></div>'+
    '</div>'+
  '</div>';
}

/* ============================================================
   VIEW: INCOME
   ============================================================ */
function incomeRow(i){
  var freq = incomeFreq(i);
  var showDay = freq!=='semimonthly';
  var curAmt = incomeAmountForMonth(i, state.month);
  var lastKnown = freq==='variable' ? incomeLastKnownAmount(i, state.month) : 0;
  return '<div class="bill-row">'+
    '<div class="hstack" style="justify-content:space-between; gap:8px;">'+
      '<input type="text" data-income-field="name" data-income-id="'+i.id+'" value="'+esc(i.name)+'" placeholder="Source name" style="font-weight:600; flex:1; min-width:0;">'+
      '<span class="mono faint" style="font-size:12px; white-space:nowrap; flex:none;" title="Monthly equivalent — this is what counts toward your planned income total">'+usd0(incomeMonthlyEquivalent(i))+'/mo</span>'+
      '<button class="btn btn-ghost remove-x-btn" data-income-remove="'+i.id+'" title="Remove income source">&times;</button>'+
    '</div>'+
    // Three same-sized labeled fields (Frequency / Amount / Pay day) — consistently sized via flex:1
    // on every field, instead of ad hoc fixed pixel widths that used to make this row look mismatched
    // (one control noticeably bigger than the next), and each amount now shows its real $ (or household
    // currency) prefix instead of a bare number that gave no hint what unit it wanted.
    '<div class="hstack" style="gap:8px; margin-top:8px; flex-wrap:wrap; align-items:flex-start;">'+
      '<div class="field" style="flex:1; min-width:132px; margin-bottom:0;"><label>Frequency</label><select data-income-field="frequency" data-income-id="'+i.id+'" title="How often this arrives — drives the monthly total and calendar paydays">'+
        Object.keys(INCOME_FREQUENCIES).map(function(k){ return '<option value="'+k+'"'+(k===freq?' selected':'')+'>'+INCOME_FREQUENCIES[k].label+'</option>'; }).join('')+
      '</select></div>'+
      '<div class="field" style="flex:1; min-width:110px; margin-bottom:0;"><label>Amount per '+(freq==='monthly'||freq==='variable'?'month':freq==='annually'?'year':'paycheck')+'</label>'+
        '<span class="money-field" style="display:flex;"><input type="number" min="0" step="1" data-income-field="amount" data-income-id="'+i.id+'" value="'+curAmt+'"></span>'+
        (freq==='variable' && curAmt===0 && lastKnown>0 ? '<button type="button" class="btn btn-ghost btn-sm" data-income-restore="'+i.id+'" style="padding:1px 6px; font-size:10px; margin-top:4px; white-space:nowrap;" title="Fill in last recorded amount">Restore '+usd0(lastKnown)+'</button>' : '')+
        (freq==='variable' ? '<div class="faint" style="font-size:10px; margin-top:4px;">this month only</div>' : '')+
      '</div>'+
      (showDay
        ? '<div class="field" style="flex:1; min-width:90px; margin-bottom:0;"><label>Pay day</label><input type="number" min="1" max="31" data-income-field="payDay" data-income-id="'+i.id+'" data-day-input value="'+(i.payDay||1)+'" title="'+esc(INCOME_FREQUENCIES[freq].dayNote)+'">'+
          '<div class="faint mono" data-day-preview style="font-size:10.5px; margin-top:4px; white-space:nowrap;">'+esc(dayPreviewText(i.payDay||1, state.month))+'</div></div>'
        : '<div class="field" style="flex:1; min-width:120px; margin-bottom:0;"><label>Pay day</label><div class="faint mono" style="padding-top:8px; font-size:12px;" title="'+esc(INCOME_FREQUENCIES[freq].dayNote)+'">15th &amp; last day</div></div>')+
    '</div>'+
    incomeConfirmHtml(i)+
  '</div>';
}
// This is the piece that actually makes an income source count anywhere else in the app — Overview's KPI
// tiles, the waterfall, and Budget vs. Actual all total real transactions, and adding a source above never
// created one on its own. "Confirm income" is what logs it. Recurring frequencies only need this once: after
// that, autoConfirmRecurringIncome() (called at the top of every route()) keeps logging it every month by
// itself. Variable/irregular income has no fixed amount to assume, so it always needs a fresh confirm.
function incomeConfirmHtml(i){
  var ym = state.month, freq = incomeFreq(i);
  var tx = incomeTxForMonth(i.id, ym);
  var isVariable = freq==='variable';
  var body;
  if (tx){
    body = '<span class="pill pill-positive">'+ic('check')+' Confirmed '+usd0(tx.amount)+' for '+monthLabel(ym)+'</span>'+
      '<span class="faint">'+(isVariable ? 'Logged as income for this month. To change the amount, undo below, edit it above, and confirm again.' : 'Confirmed once — now added automatically every month.')+'</span>'+
      '<button type="button" class="btn btn-ghost btn-sm" data-income-unconfirm="'+i.id+'" style="color:var(--negative); margin-left:auto;">'+(isVariable?'Undo':'Stop auto-adding')+'</button>';
  } else if (!isVariable && i.autoConfirm){
    body = '<span class="pill pill-neutral">Auto-confirm is on</span>'+
      '<span class="faint">This month\'s amount is $0, so there\'s nothing to add yet.</span>'+
      '<button type="button" class="btn btn-ghost btn-sm" data-income-unconfirm-flag="'+i.id+'" style="color:var(--negative); margin-left:auto;">Stop auto-adding</button>';
  } else {
    body = '<span class="faint">'+(isVariable ? 'Enter this month\'s amount above, then confirm it so it counts on the Overview page.' : 'Not counted on the Overview page yet — confirm it once and it\'ll keep adding itself every month.')+'</span>'+
      '<button type="button" class="btn btn-primary btn-sm" data-income-confirm="'+i.id+'" style="margin-left:auto;">'+ic('check')+' Confirm income</button>';
  }
  return '<div class="hstack" style="justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);">'+body+'</div>';
}
function renderIncome(){
  var total = incomeTotalPlanned();
  var rows = state.income.map(incomeRow).join('');
  return '<div class="view">'+
    '<div class="card card-pad" style="margin-bottom:16px;"><div class="card-title">Planned monthly income</div><div class="kpi-value" style="color:var(--positive);">'+usd0(total)+'</div>'+
    '<div class="faint" style="margin-top:4px;">Every paycheck, client payment, or other regular deposit your household counts on, converted to a real monthly figure based on how often it actually arrives — kept separate from spending so it\'s always clear where money comes from.</div>'+
    '<div class="faint" style="margin-top:6px;"><strong>This total is the plan, not the Overview page.</strong> Overview only counts income you\'ve confirmed with the button on each source below — that\'s what turns a planned amount into an actual, dated transaction.</div></div>'+
    '<div class="card card-pad">'+
      '<div class="card-title" style="margin-bottom:10px;">Income sources</div>'+
      (rows || '<div class="empty">No income sources yet — add one below.</div>')+
      '<div class="faint" style="margin:6px 0 0;">Frequency actually drives the math: weekly and biweekly amounts are annualized then divided by 12, semimonthly is always the 1st/15th-style twice-a-month pattern (shown on the calendar as the 15th and the last day of the month), and annually is divided by 12. The anchor day accepts 1–31 — 31 always means “the last day of the month,” so a 30-day or 28-day month still gets a real date instead of losing the payment.</div>'+
      '<div class="divider"></div>'+
      addForm('add-income', 'Add an income source', [
        {name:'name', ph:'Source name', type:'text'},
        {name:'frequency', ph:'How often', type:'select', options: Object.keys(INCOME_FREQUENCIES).map(function(k){ return {value:k, label:INCOME_FREQUENCIES[k].label, selected:k==='monthly'}; })},
        {name:'amount', ph:'Amount per paycheck', type:'number'},
        {name:'payDay', ph:'Anchor day (1-31, 31=last day)', type:'number', min:1, max:31, dayPreview:true}
      ], 'Add income')+
    '</div>'+
  '</div>';
}

/* ============================================================
   VIEW: TRANSACTIONS
   ============================================================ */
var editingTxId = null; // set while the Add-transaction form is showing/saving an EXISTING row instead of a new one
// Transactions-table filters — reset on reload (like the trend-chart range toggle), never persisted, since
// they're a view preference for browsing, not part of the household's actual data.
var txFilters = {category:'', merchant:'', dateFrom:'', dateTo:'', amountMin:'', amountMax:''};
function txFiltersActive(){
  var f = txFilters;
  return !!(f.category || f.merchant || f.dateFrom || f.dateTo || f.amountMin!=='' || f.amountMax!=='');
}
function txMatchesFilters(t){
  var f = txFilters;
  if (f.category && t.category !== f.category) return false;
  if (f.merchant && (t.merchant||'').toLowerCase().indexOf(f.merchant.toLowerCase()) < 0) return false;
  if (f.dateFrom && t.date < f.dateFrom) return false;
  if (f.dateTo && t.date > f.dateTo) return false;
  if (f.amountMin!=='' && Math.abs(t.amount) < parseFloat(f.amountMin)) return false;
  if (f.amountMax!=='' && Math.abs(t.amount) > parseFloat(f.amountMax)) return false;
  return true;
}
function txRowHtml(t){
  var sign = t.type==='income'?'+':'–';
  var color = t.type==='income'?'var(--positive)':'var(--ink)';
  var dotColor = t.type==='income' ? 'var(--positive)' : catChartColor(t.category);
  return '<tr'+(t.id===editingTxId?' style="background:var(--accent-soft);"':'')+'><td class="num" data-label="Date">'+t.date+'</td><td data-label="Merchant"><span class="dot" style="background:'+dotColor+'; margin-right:8px;"></span>'+esc(t.merchant)+(t.auto?' <span class="pill pill-neutral" style="margin-left:4px;">auto</span>':'')+'</td>'+
    '<td data-label="Category">'+categoryEmoji(t.category)+' '+esc(t.category)+'</td><td class="faint" data-label="Note">'+(t.note?esc(t.note):'')+'</td>'+
    '<td class="amt" data-label="Amount" style="color:'+color+'; font-weight:700;">'+sign+' '+fmtTxAmount(t)+'</td>'+
    '<td class="amt" data-label="Actions"><button class="btn btn-ghost remove-x-btn" data-tx-edit="'+t.id+'" title="Edit transaction" style="margin-right:2px;">'+ic('edit')+'</button><button class="btn btn-ghost remove-x-btn" data-tx-remove="'+t.id+'" title="Delete transaction">&times;</button></td></tr>';
}
// The table + its "showing N of M" note + the delete button are rebuilt on their own (not the whole page)
// whenever a filter changes, so the filter inputs themselves never lose focus mid-keystroke.
function txTableSectionHtml(tx, totalThisMonth){
  var filtersActive = txFiltersActive();
  return (filtersActive ? '<div class="faint" style="padding:0 16px 8px;">Showing '+tx.length+' of '+totalThisMonth+' transaction'+(totalThisMonth===1?'':'s')+' this month.</div>' : '')+
    (tx.length ? '<div style="padding:0 16px 8px; text-align:right;"><button class="btn btn-ghost btn-sm" id="tx-delete-all-btn" title="Delete the transactions listed below — handy to recover from a bad PDF/CSV import" style="color:var(--negative);">'+ic('trash')+' Delete '+(filtersActive?'shown':'all')+' ('+tx.length+')</button></div>' : '')+
    '<div class="table-wrap"><table>'+
    '<thead><tr><th>Date</th><th>Merchant</th><th>Category</th><th>Note</th><th class="amt">Amount</th><th></th></tr></thead>'+
    '<tbody>'+ (tx.length ? tx.map(txRowHtml).join('') : '<tr><td colspan="6" class="empty">'+(filtersActive?'No transactions match these filters.':'No transactions yet this month.')+'</td></tr>') +
    '</tbody></table></div>';
}
// Wires the edit/delete/delete-all controls inside #tx-table-section. Called both after a full renderTransactions()
// and after refreshTxTable() rebuilds just that section (e.g. when a filter changes) — keeping it in one place
// means the two call sites can never drift out of sync with each other.
function wireTxTableSection(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-tx-edit]'), function(btn){
    btn.addEventListener('click', function(){
      editingTxId = btn.getAttribute('data-tx-edit');
      route();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-tx-remove]'), function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-tx-remove');
      var t = state.transactions.find(function(x){ return x.id===id; });
      confirmDelete('Remove the '+(t?usd0(t.amount)+' '+esc(t.merchant):'transaction')+' entry'+(t&&t.date?' from '+t.date:'')+'? If this was a bill or loan payment, it goes back to unpaid.', function(){
        state.transactions = state.transactions.filter(function(x){ return x.id!==id; });
        if (editingTxId===id) editingTxId = null;
        persist(); toast('Transaction removed'); route();
      });
    });
  });
  var deleteAllBtn = document.getElementById('tx-delete-all-btn');
  if (deleteAllBtn) deleteAllBtn.addEventListener('click', function(){
    var ym = state.month;
    var monthTx = txForMonth(ym).filter(txMatchesFilters);
    var count = monthTx.length;
    var filtered = txFiltersActive();
    confirmDelete('Delete '+(filtered?'the '+count+' filtered':'all '+count)+' transaction'+(count===1?'':'s')+' shown for '+monthLabel(ym)+'? Useful if a statement import read something wrong — any bills or loan payments in this list go back to unpaid. This can\'t be undone.', function(){
      var idsToRemove = {}; monthTx.forEach(function(t){ idsToRemove[t.id] = true; });
      state.transactions = state.transactions.filter(function(x){ return !idsToRemove[x.id]; });
      if (editingTxId && idsToRemove[editingTxId]) editingTxId = null;
      persist(); toast(count+' transaction'+(count===1?'':'s')+' deleted'); route();
    });
  });
}

  var ym = state.month;

  var tx = allTx.filter(txMatchesFilters);
  var section = document.getElementById('tx-table-section');
  if (!section) return;
  section.innerHTML = txTableSectionHtml(tx, allTx.length);

}

function renderCalendar(){
  var ym = state.month, p = parseYM(ym);
  var dim = daysInMonth(p.y,p.m);
  var firstDow = new Date(p.y,p.m,1).getDay();
  var payDays = incomeCalendarDays(ym); // auto from Income sources — resolves frequency (semimonthly = 15th + last day) and clamps to this month's real length
  var actualIncomeDays = txForMonth(ym).filter(function(t){ return t.type==='income'; }).map(function(t){ return parseInt(t.date.slice(8,10)); });
  var monthBills = state.bills.filter(function(b){ return billActiveInMonth(b, ym); }); // a yearly bill only shows in its own due month

  var cells = [];
  for (var i=0;i<firstDow;i++) cells.push('<div class="cal-cell pad"></div>');
  for (var d=1; d<=dim; d++){
    var isToday = (state.today === ym+'-'+String(d).padStart(2,'0'));
    var billsToday = monthBills.filter(function(b){ return effDay(b.dueDay, ym)===d; });
    var debtsToday = (state.debts||[]).filter(function(dt){ return effDay(dt.dueDay, ym)===d; });
    var items = billsToday.map(function(b){
      var paid = !!billPaidTx(b.id, ym);
      var overdue = !paid && d < TODAY.getDate();
      var cls = paid?'paid':(overdue?'due':'');
      return '<div class="cal-item bill '+cls+'" data-bill-toggle="'+b.id+'" data-day="'+d+'" title="'+esc(b.name)+' — '+usd0(b.budgeted)+' ('+(paid?'paid, click to undo':'click to mark paid')+')"><span class="cal-item-name">'+esc(b.name)+'</span><span class="cal-item-amt">'+usd0(b.budgeted)+'</span></div>';
    }).join('') + debtsToday.map(function(dt){
      var paid = !!debtPaidTx(dt.id, ym);
      var overdue = !paid && d < TODAY.getDate();
      var cls = paid?'paid':(overdue?'due':'');
      return '<div class="cal-item bill '+cls+'" data-debt-toggle="'+dt.id+'" data-day="'+d+'" title="'+esc(dt.name)+' — '+usd0(dt.minPayment)+' loan payment ('+(paid?'paid, click to undo':'click to mark paid')+')"><span class="cal-item-name">'+esc(dt.name)+'</span><span class="cal-item-amt">'+usd0(dt.minPayment)+'</span></div>';
    }).join('');
    var payItem = (payDays.indexOf(d)>=0 || actualIncomeDays.indexOf(d)>=0) ? '<div class="cal-item pay"><span class="cal-item-name">Payday</span></div>' : '';
    cells.push('<div class="cal-cell'+(isToday?' today':'')+'"><div class="cal-date">'+d+'</div>'+payItem+items+'</div>');
  }
  while (cells.length % 7 !== 0) cells.push('<div class="cal-cell pad"></div>');

  var dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return '<div class="view">'+
    '<div class="card card-pad">'+
      '<div class="cal-grid">'+ dows.map(function(x){ return '<div class="cal-dow">'+x+'</div>'; }).join('') + cells.join('') +'</div>'+
      '<div class="hstack" style="margin-top:14px; gap:16px; flex-wrap:wrap;">'+
        legendDot('var(--accent-soft)','var(--accent-strong)','Payday')+
        legendDot('var(--surface-2)','var(--ink-soft)','Bill / loan payment scheduled')+
        legendDot('var(--negative-soft)','var(--negative)','Overdue')+
        legendDot('var(--positive-soft)','var(--positive)','Paid')+
      '</div>'+
      '<div class="faint" style="margin-top:8px;">Bills and loan minimum payments show up here automatically — nothing to enter by hand.</div>'+
    '</div>'+
  '</div>';
}
function legendDot(bg,fg,label){ return '<div class="hstack" style="font-size:12px; color:var(--ink-soft);"><span style="width:12px;height:12px;border-radius:4px;background:'+bg+';border:1px solid '+fg+';display:inline-block;"></span>'+label+'</div>'; }

/* Ring-style progress: bold centered percentage, quiet track. Used on the Savings view's
   goal cards, where each goal already has its own dedicated card. Returns just the <svg>. */
function progressRing(ratio, color, size){
  size = size || 72;
  var stroke = Math.max(4, Math.round(size*0.1));
  var r = (size - stroke) / 2;
  var c = 2 * Math.PI * r;
  var pct = clamp(ratio, 0, 100);
  var offset = c * (1 - pct/100);
  var cx = size/2, cy = size/2;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" class="progress-ring">'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="'+stroke+'"></circle>'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" '+
        'stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+offset.toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"></circle>'+
    '</svg>';
}

function renderNetWorth(){

  var debtLiabTotal = debtLiab.reduce(function(s,l){ return s+l.value; },0);
  var otherLiab = state.netWorth.liabilities || [];
  var otherLiabTotal = otherLiab.reduce(function(s,l){ return s+l.value; },0);
  var liabTotal = debtLiabTotal + otherLiabTotal;
  var net = assetsTotal-liabTotal;
  var hist = state.netWorth.history.map(function(h){ return h.value; });

    '</div>'+

      '<div class="card card-pad">'+
        '<div class="card-title">Assets</div>'+
        (monthlyContribTotal>0 ? '<div class="faint" style="margin-bottom:8px;">Contributing <strong style="color:var(--ink);">'+usd0(monthlyContribTotal)+'/mo</strong> total across your accounts.</div>' : '')+
        (state.netWorth.assets.length ? state.netWorth.assets.map(assetRow).join('') : '<div class="empty">No assets yet — add one below.</div>')+
        '<div class="divider"></div>'+
        addForm('add-asset', 'Add an asset', [

// Generic "are you sure?" confirmation for the many small X/remove buttons across the app (bills,
// categories, income sources, goals, debts, net worth rows) — lighter-weight than the type-DELETE
// clear-all-data modal above, since accidentally removing one bill is recoverable-by-re-adding,
// but shouldn't happen from one stray click either.
function confirmDelete(message, onConfirm){
  // Self-heal instead of silently no-op'ing: if a previous confirm dialog somehow never got cleaned up,
  // a plain early-return here would make EVERY delete button in the app look broken forever (nothing
  // would ever open again) with no visible error. Clearing it out first means one delete action can
  // never permanently wedge every other one.
  var existingBackdrop = document.getElementById('confirm-delete-backdrop');
  if (existingBackdrop) existingBackdrop.remove();
  var back = document.createElement('div');
  back.className = 'auth-modal-backdrop';
  back.id = 'confirm-delete-backdrop';
  back.innerHTML = '<div class="auth-modal">'+
    '<button class="close-x" id="confirm-delete-close" type="button" aria-label="Close">&times;</button>'+
    '<h3>Remove this?</h3>'+
    '<p class="faint" style="margin:6px 0 16px;">'+message+'</p>'+
    '<div class="auth-actions">'+
      '<button type="button" class="btn" id="confirm-delete-cancel">Cancel</button>'+
      '<button type="button" class="btn btn-primary" id="confirm-delete-yes" style="background:var(--negative); border-color:var(--negative); color:#fff;">Remove</button>'+
    '</div>'+
  '</div>';
  document.body.appendChild(back);
  function close(){ var b = document.getElementById('confirm-delete-backdrop'); if (b) b.remove(); }
  document.getElementById('confirm-delete-close').addEventListener('click', close);
  document.getElementById('confirm-delete-cancel').addEventListener('click', close);
  back.addEventListener('click', function(e){ if (e.target===back) close(); });
  document.getElementById('confirm-delete-yes').addEventListener('click', function(){ close(); onConfirm(); });
}

/* ============================================================
   CSV STATEMENT IMPORT — fully client-side, no AI / no network call.
   Handles a bank's exported CSV export: sniffs the header row, guesses which
   column is date/merchant/amount (common bank export header names), then lets
   the user confirm the mapping before anything is parsed into transactions.
   ============================================================ */
var csvImportRows = [], csvImportHeaders = [], csvImportMap = {date:-1, merchant:-1, amount:-1};
// Statements disagree on sign convention: most checking/debit-account exports show spending as NEGATIVE
// numbers, but plenty of credit-card statements (and many PDFs) show every charge as a plain POSITIVE
// number with no minus sign at all, using a separate column or just context to imply "this is a charge".
// Guessing wrong here silently mislabels every expense as income (with a mislabeled category to match),
// which is confusing and hard to notice — so this is auto-detected from the data, and the toggle in the
// mapping UI lets the user correct it in one click if the guess is wrong for their particular statement.
var csvAmountSignMode = 'negative-expense'; // 'negative-expense' | 'positive-expense'
function parseAmountForSign(raw){ return parseFloat(String(raw||'').replace(/[$,]/g,'').trim()); }
function isIncomeForAmount(amt){ return csvAmountSignMode==='positive-expense' ? amt<0 : amt>=0; }
// If most of the parsed amounts in the current mapping aren't negative, the statement almost certainly
// doesn't use a minus sign for spending at all (a very common shape for credit-card exports and PDFs) —
// so default the toggle to "positive = expense" automatically instead of making every row look like income.
// This is a MAJORITY vote on purpose, not "any negative found" — a real statement is overwhelmingly one
// convention with maybe one or two exceptions (a refund, a credited fee, a stray negative), and letting a
// single outlier flip the whole file used to mislabel the vast majority of real expenses as income.
function autoDetectAmountSignMode(){
  if (csvImportMap.amount<0 || !csvImportRows.length) return;
  var neg=0, pos=0;
  csvImportRows.forEach(function(r){
    var a = parseAmountForSign(r[csvImportMap.amount]);
    if (isNaN(a) || a===0) return;
    if (a<0) neg++; else pos++;
  });
  csvAmountSignMode = pos>neg ? 'positive-expense' : 'negative-expense';
}
// The majority-vote auto-detect above (autoDetectAmountSignMode) is trusted to just get this right without
// surfacing it as a sentence the user has to read on every import — so there's no visible "we read this
// statement as..." message and no manual flip control anymore; the detection still runs silently.
function parseCSV(text){
  // minimal RFC4180-ish parser: handles quoted fields, escaped quotes, and commas/newlines inside quotes
  var rows = [], row = [], field = '', inQuotes = false;
  for (var i=0; i<text.length; i++){
    var c = text[i], next = text[i+1];
    if (inQuotes){
      if (c==='"' && next==='"'){ field+='"'; i++; }
      else if (c==='"'){ inQuotes=false; }
      else field += c;
    } else {
      if (c==='"') inQuotes = true;
      else if (c===','){ row.push(field); field=''; }
      else if (c==='\r'){ /* skip */ }
      else if (c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(f){ return f.trim()!==''; }); });
}
// Strips punctuation, store numbers, and transaction-id-style digit runs so "TRADER JOE S #4471" and
// "Trader Joe's" collapse to the same key — bank/PDF text rarely spells a merchant the same way twice.
function normalizeMerchantKey(raw){
  var s = String(raw||'').toLowerCase();
  s = s.replace(/[^a-z0-9 ]+/g, ' ');
  s = s.replace(/\b\d{3,}\b/g, ' '); // drop long numbers (store #, transaction id) but keep short ones (e.g. "76" gas)
  s = s.replace(/\s+/g, ' ').trim();
  return s;
}
// Guesses a category for an imported row from your OWN transaction history — no separate list to
// maintain: every transaction you've ever confirmed (typed by hand, or from a prior CSV/PDF import)
// is what it learns from, so it keeps getting better the more you use the app. Returns estimated:false
// (falls back to "Other"/"Other income") when nothing in your history looks like a match yet.
// Bank/PDF statement text for the same real-world merchant rarely matches character-for-character
// twice ("UBER *TRIP", "Uber Eats", "UBER   RIDES 8831") — this picks the first word that isn't a
// generic filler, so "uber" is what actually gets compared, not whichever suffix happened to trail it.
var MERCHANT_STOP_WORDS = {the:1, inc:1, llc:1, corp:1, co:1, pos:1, debit:1, credit:1, purchase:1, payment:1, of:1, and:1, com:1, www:1};
function significantMerchantWord(key){
  var words = key.split(' ');
  for (var i=0;i<words.length;i++){ if (words[i].length>=3 && !MERCHANT_STOP_WORDS[words[i]]) return words[i]; }
  return words[0]||'';
}

function guessFromCommonMerchants(key, isIncome){
  for (var i=0;i<COMMON_MERCHANT_CATEGORIES.length;i++){
    var entry = COMMON_MERCHANT_CATEGORIES[i];
    if (!!entry.income !== !!isIncome) continue;
    for (var j=0;j<entry.keywords.length;j++){
      if (key.indexOf(entry.keywords[j]) >= 0) return entry.category;
    }
  }
  return null;
}
// A credit-card statement's "payment" line (paying down the balance) isn't a new expense OR new income —
// it's just moving money to cover purchases that are either already logged individually elsewhere, or
// about to be. Importing it as a transaction would double-count spending that's tracked another way, so
// these rows are detected and excluded from import by default (still shown, still toggleable, in case
// someone genuinely wants to log it as a debt payment instead).
function isLikelyCardPaymentRow(merchantRaw){
  var key = normalizeMerchantKey(merchantRaw);
  if (!key) return false;
  if (/\bpayment\b/.test(key) && /(thank you|received|autopay|auto pay|online|web|electronic|mobile|internet)/.test(key)) return true;
  if (/^autopay/.test(key) || key==='autopay payment') return true;
  if (/^(online|web|mobile|internet|electronic) payment$/.test(key)) return true;
  return false;
}
function guessCategoryForMerchant(merchantRaw, isIncome){
  var fallback = isIncome ? 'Other income' : 'Other';
  var key = normalizeMerchantKey(merchantRaw);
  if (!key) return { category: fallback, estimated:false };
  var sigWord = significantMerchantWord(key);
  // three confidence tiers, most exact first — a weaker tier is only consulted if nothing at all
  // matched at a stronger one, so a single loose first-word match never outvotes an exact match.
  var tallyExact = {}, tallySubstr = {}, tallyFirstWord = {};
  state.transactions.forEach(function(t){
    if (!t.merchant || !t.category) return;
    if (isIncome !== (t.type==='income')) return; // compare income history to income rows, expenses to expenses
    var k = normalizeMerchantKey(t.merchant);
    if (!k) return;
    if (k===key){ tallyExact[t.category] = (tallyExact[t.category]||0) + 1; }
    else if (k.indexOf(key)>=0 || key.indexOf(k)>=0){ tallySubstr[t.category] = (tallySubstr[t.category]||0) + 1; }
    else if (sigWord && significantMerchantWord(k)===sigWord){ tallyFirstWord[t.category] = (tallyFirstWord[t.category]||0) + 1; }
  });
  function pickBest(tally){
    var bestCat = null, bestCount = 0;
    Object.keys(tally).forEach(function(cat){ if (tally[cat] > bestCount){ bestCount = tally[cat]; bestCat = cat; } });
    return bestCat;
  }
  var best = pickBest(tallyExact) || pickBest(tallySubstr) || pickBest(tallyFirstWord);
  if (best) return { category:best, estimated:true };
  // Nothing in your own history yet (first-time user, or just a brand-new vendor for you) — fall back
  // to the common-merchant dictionary so imports still come in pre-filled instead of a wall of "Other".
  var commonGuess = guessFromCommonMerchants(key, isIncome);
  if (commonGuess) return { category: commonGuess, estimated:true };
  return { category: fallback, estimated:false };
}

// A user picking their own emoji for a category they typed themselves is a per-household preference
// (not a code-level default), so it's stored on state, not in the CATEGORY_EMOJI constant above.
// Lazily created so it survives loading an older saved state that predates this feature.
function customCatEmojiMap(){ return state.customCategoryEmoji || (state.customCategoryEmoji = {}); }
function setCustomCategoryEmoji(name, emoji){
  name = String(name||'').trim(); emoji = String(emoji||'').trim();
  if (!name) return;
  var map = customCatEmojiMap();
  if (emoji) map[name] = emoji; else delete map[name]; // no emoji chosen -> fall back to the standard one for everyone
  persist();
}
// Whole-word/phrase containment, not raw substring — a raw indexOf let "car" match inside "Daycare" or
// "Credit Card" (both just happen to contain the letters c-a-r), handing back the wrong emoji. \b keeps a
// short key from firing unless it appears as its own word (or phrase) inside the category name.
function categoryTextContainsWord(haystack, word){
  if (!word) return false;
  var re = new RegExp('\\b'+word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b');
  return re.test(haystack);
}
function categoryEmoji(name){
  var raw = String(name||'').trim();
  if (!raw) return '🏷️';
  var custom = customCatEmojiMap()[raw];
  if (custom) return custom;
  var key = raw.toLowerCase();
  if (CATEGORY_EMOJI[key]) return CATEGORY_EMOJI[key];
  var found = Object.keys(CATEGORY_EMOJI).find(function(k){ return categoryTextContainsWord(key, k) || categoryTextContainsWord(k, key); });
  return found ? CATEGORY_EMOJI[found] : '🏷️';
}
// One combined category list for any category-picker dropdown — your own bill/variable/income names first
// (since those are the categories that actually mean something in YOUR budget), then the common defaults,
// so the list is useful even before you've customized anything.
function allCategoryNames(){
  var list = [], seen = {};
  function add(c){ c = String(c||'').trim(); if (c && !seen[c]){ seen[c] = 1; list.push(c); } }
  state.bills.forEach(function(b){ add(b.name); });
  state.variable.forEach(function(v){ add(v.name); });
  ['Groceries','Dining Out','Transportation','Entertainment','Utilities','Phone','Shopping','Personal Care','Insurance','Household','Travel','Subscriptions','Pets','Education'].forEach(add);
  add('Debt Payment'); add('Savings Transfer');
  state.income.forEach(function(i){ add(i.name); });
  add('Salary'); add('Freelance Income'); add('Other income');
  add('Other');
  return list;
}
// Renders a real <select> (with an emoji per option, so the dropdown arrow always works — no more

function categoryPickerHtml(attrName, attrValue, currentValue){

  var existingEmoji = isCustom ? (customCatEmojiMap()[current] || '') : '';
  return '<select '+attrName+'-select="'+attrValue+'">'+options+'<option value="__custom__"'+(isCustom?' selected':'')+'>✏️ Custom category…</option></select>'+

// Wires up ALL category pickers on the page at once (both the manual Add Transaction form and any CSV/PDF
// review rows share this): toggling to "Custom category…" reveals the text field (plus an optional emoji
// field next to it); onChange fires with the resolved category string either way, so callers don't need to
// know which mode is active. An emoji is entirely optional — leaving it blank keeps the standard one that
// categoryEmoji() would have picked anyway, it's never required to save a custom category.
function wireCategoryPickers(root, onChange){
  Array.prototype.forEach.call(root.querySelectorAll('[data-tx-cat-select], [data-csv-cat-select]'), function(sel){
    var attr = sel.hasAttribute('data-tx-cat-select') ? 'data-tx-cat' : 'data-csv-cat';
    var id = sel.getAttribute(attr+'-select');
    var customWrap = root.querySelector('['+attr+'-customwrap="'+id+'"]');
    var customInput = root.querySelector('['+attr+'-custom="'+id+'"]');
    var emojiInput = root.querySelector('['+attr+'-emoji="'+id+'"]');
    function commitEmoji(){
      if (!customInput || !emojiInput) return;
      var name = customInput.value.trim();
      if (name) setCustomCategoryEmoji(name, emojiInput.value);
    }
    sel.addEventListener('change', function(){
      var isCustom = sel.value === '__custom__';
      if (customWrap) customWrap.hidden = !isCustom;
      if (isCustom && customInput) customInput.focus();
      onChange(id, isCustom ? (customInput?customInput.value.trim():'') : sel.value);
    });
    if (customInput) customInput.addEventListener('input', function(){
      if (sel.value === '__custom__') onChange(id, customInput.value.trim());
    });
    // Commit the emoji choice (if any) once the user leaves either field — tied to whatever name is
    // currently typed, so it doesn't matter which order the two fields are filled in.
    if (emojiInput) emojiInput.addEventListener('change', commitEmoji);
    if (customInput) customInput.addEventListener('blur', commitEmoji);
  });
}
function resolvedCategoryValue(root, attr, id){
  var sel = root.querySelector('['+attr+'-select="'+id+'"]');
  if (!sel) return '';
  if (sel.value === '__custom__'){
    var customInput = root.querySelector('['+attr+'-custom="'+id+'"]');
    return customInput ? customInput.value.trim() : '';
  }
  return sel.value;
}
// Programmatically points a category picker at `value` — selects it if it's one of the listed options,
// otherwise falls into "Custom category…" mode with that text prefilled. Used when picking a bill/loan
// to link a transaction to also suggests that bill/loan's own name as the category.
function setCategoryPickerValue(root, attr, id, value){
  var sel = root.querySelector('['+attr+'-select="'+id+'"]');
  if (!sel) return;
  var customWrap = root.querySelector('['+attr+'-customwrap="'+id+'"]');
  var customInput = root.querySelector('['+attr+'-custom="'+id+'"]');
  var hasOption = Array.prototype.some.call(sel.options, function(o){ return o.value===value; });
  if (hasOption){
    sel.value = value;
    if (customWrap) customWrap.hidden = true;
  } else {
    sel.value = '__custom__';
    if (customWrap) customWrap.hidden = false;
    if (customInput) customInput.value = value;
  }
}
function guessColumn(headers, candidates){
  var lower = headers.map(function(h){ return h.trim().toLowerCase(); });
  for (var i=0;i<candidates.length;i++){
    var idx = lower.indexOf(candidates[i]);
    if (idx>=0) return idx;
  }
  for (var j=0;j<lower.length;j++){
    for (var k=0;k<candidates.length;k++){ if (lower[j].indexOf(candidates[k])>=0) return j; }
  }
  return -1;
}
// Backs out of an in-progress CSV/PDF import at any stage (column mapping or row review) without
// adding anything — nothing was ever written to state.transactions until the Import button is clicked,
// so "cancel" just means throwing away what's been read and resetting the file pickers.
function cancelImportFlow(){
  csvImportRows = []; csvImportHeaders = []; csvImportMap = {date:-1, merchant:-1, amount:-1}; csvReviewRows = [];
  var mapEl = document.getElementById('csv-mapping'); if (mapEl) mapEl.innerHTML = '';
  var statusEl = document.getElementById('csv-status'); if (statusEl) statusEl.textContent = '';
  var csvFile = document.getElementById('csv-file'); if (csvFile) csvFile.value = '';
  var pdfFile = document.getElementById('pdf-file'); if (pdfFile) pdfFile.value = '';
  toast('Import cancelled — nothing was added');
}
function handleCSVFile(){
  var fileInput = document.getElementById('csv-file');
  var statusEl = document.getElementById('csv-status');
  if (!fileInput || !fileInput.files || !fileInput.files.length){ if(statusEl) statusEl.textContent = 'Choose a CSV file first.'; return; }
  var reader = new FileReader();
  reader.onload = function(){
    var rows = parseCSV(String(reader.result||''));
    if (rows.length < 2){ if(statusEl) statusEl.textContent = 'Couldn’t find any rows in that file.'; return; }
    csvImportHeaders = rows[0];
    csvImportRows = rows.slice(1);
    csvImportMap = {
      date: guessColumn(csvImportHeaders, ['date','transaction date','posted date']),
      merchant: guessColumn(csvImportHeaders, ['merchant','description','payee','name']),
      amount: guessColumn(csvImportHeaders, ['amount','amount debit','debit','value'])
    };
    autoDetectAmountSignMode();
    if (statusEl) statusEl.textContent = 'Found '+csvImportRows.length+' row'+(csvImportRows.length===1?'':'s')+' — confirm which column is which:';
    renderCSVMapping();
  };
  reader.onerror = function(){ if(statusEl) statusEl.textContent = 'Couldn’t read that file — try again.'; };
  reader.readAsText(fileInput.files[0]);
}
function renderCSVMapping(){
  var mapEl = document.getElementById('csv-mapping');
