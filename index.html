<!-- ===== Installable / "Add to Home Screen" support =====
     These resolve to real files once deployed alongside index.html on real hosting (see manifest.json,
     sw.js, /icons). They resolve to nothing inside this Claude preview — a sandboxed iframe can't be
     installed to a home screen at all — so they fail harmlessly here and light up for real once deployed. -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="apple-mobile-web-app-title" content="Steadyspend">
<!-- ===== Real accounts (Supabase) =====
     Loaded as an ES module so it works whether or not this package ships a classic UMD/global bundle —
     jsdelivr's "+esm" endpoint builds a working ES module for it either way. Module scripts execute after
     the rest of the page has parsed, so app.js never assumes this is ready synchronously — it listens for
     the 'supabase-sdk-ready' event (or times out and falls back to local-only mode; see initAuth() in app.js).
     This call is blocked by both this preview sandbox's network policy and the Claude Artifact CSP — expected,
     same as the live FX lookup — and starts working the moment the app is deployed to real hosting. -->
<script type="module">
  try {
    const mod = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/+esm");
    window.__supabaseCreateClient = mod.createClient;
  } catch (e) { /* CDN unreachable (this preview, or offline) — app.js's timeout fallback handles it */ }
  window.dispatchEvent(new Event('supabase-sdk-ready'));
</script>

/* ============ RESET / BASE ============ */
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:14.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;text-wrap:balance;color:var(--ink);margin:0;}
a{color:inherit;}
button{font-family:inherit;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
::selection{background:var(--accent-soft);}
[hidden]{display:none!important;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms!important; transition-duration:.001ms!important;} }

/* ============ APP SHELL ============ */
.app{min-height:100vh;}
.sidebar{
  position:fixed; inset:0 auto 0 0; width:var(--sidebar-w);
  background:var(--navy); color:#EDEFF2;
  display:flex; flex-direction:column; padding:20px 14px; gap:4px; z-index:20;
}
:root[data-theme="dark"] .sidebar{ background:#0D1116; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .sidebar{ background:#0D1116; } }
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:16px;flex:none;}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:.2px;color:#fff;}
.nav-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;}
.nav-btn{
  width:100%; display:flex; align-items:center; gap:11px; padding:9px 12px; border:none; background:transparent;
  color:#C7CDDA; border-radius:10px; font-size:13.6px; font-weight:500; cursor:pointer; text-align:left;
}
.nav-btn svg{flex:none; opacity:.85;}
.nav-btn:hover{background:rgba(255,255,255,.08); color:#fff;}
.nav-btn[aria-current="page"]{background:rgba(215,169,75,.16); color:#fff;}
.nav-btn[aria-current="page"] svg{color:var(--accent); opacity:1;}
.nav-spacer{flex:1;}
.sidebar-foot{padding:8px 10px; font-size:10.5px; color:#8891A1; border-top:1px solid rgba(255,255,255,.08); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

.main{margin-left:var(--sidebar-w);}
.topbar{
  position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:14px; padding:14px 28px;
}
.topbar h1{font-size:21px;}
.topbar-sub{color:var(--ink-soft); font-size:12.5px; margin-top:1px;}
.month-pill{
  display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line);
  border-radius:999px; padding:6px 8px 6px 14px; font-size:13px; font-weight:500; box-shadow:var(--shadow);
}
.icon-btn{
  width:30px;height:30px;border-radius:999px;border:none;background:var(--surface-2);color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.icon-btn:hover{background:var(--surface-3);}
.menu-toggle{display:none;}
.sidebar-backdrop{display:none; position:fixed; inset:0; background:rgba(20,14,18,.5); z-index:35;}
.sidebar-backdrop.open{display:block;}
.style-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;flex:none;}
.style-dot.active{box-shadow:0 0 0 2px var(--accent);}
.style-switch-label{font-size:11px;color:var(--ink-faint);margin-right:2px;}
.topbar-right{margin-left:auto; display:flex; align-items:center; gap:10px;}

.view{padding:34px 38px 72px; max-width:1220px;}
.view-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:26px; flex-wrap:wrap;}
.view-head p{color:var(--ink-soft); font-size:13px; margin:3px 0 0;}

/* ============ BUTTONS / FORM ============ */
.btn{
  display:inline-flex; align-items:center; gap:7px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-size:13px; font-weight:600; padding:8px 14px; cursor:pointer;
}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
.btn-primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:5px 10px; font-size:12px; border-radius:8px;}
.btn:disabled{opacity:.5; cursor:default;}
input,select,textarea{
  font-family:var(--font-body); font-size:13.5px; color:var(--ink); background:var(--surface);
  border:1px solid var(--line); border-radius:9px; padding:8px 10px; width:100%;
}
input.mono, .num-input{font-family:var(--font-mono);}
input[type="checkbox"],input[type="radio"]{width:16px; height:16px; padding:0; flex:none; accent-color:var(--accent);}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
label{font-size:12px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:5px;}
.field{margin-bottom:0;}
.form-row{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); align-items:end;}

/* ============ LAYOUT PRIMITIVES ============ */
/* Shadow-only "floating" cards, no hairline border — quieter chrome, more whitespace inside. */
.card{background:var(--surface); border:1px solid transparent; border-radius:var(--radius-l); box-shadow:var(--shadow);}
.card-pad{padding:26px 28px;}
.grid{display:grid; gap:22px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:1.3fr 1fr;}
@media (max-width:980px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:1fr;} .grid-2{grid-template-columns:1fr;} }
.card-title{font-size:12.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px;}
.chart-wrap{position:relative;}

/* ============ KPI TILES ============ */
.kpi{padding:24px 24px 22px; display:flex; flex-direction:column; gap:13px;}
.kpi-top{display:flex; align-items:center; justify-content:space-between;}
.kpi-label{font-size:11.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em;}
.kpi-value{font-family:var(--font-mono); font-size:32px; font-weight:700; letter-spacing:-.01em; font-variant-numeric:tabular-nums;}
.kpi-delta{font-size:12px; font-weight:600; display:inline-flex; align-items:center; gap:4px;}
.kpi-delta.up{color:var(--positive);}
.kpi-delta.down{color:var(--negative);}
.spark{display:block; overflow:visible;}

/* ============ BADGES / PILLS ============ */
.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:600;}
.pill-positive{background:var(--positive-soft); color:var(--positive);}
.pill-negative{background:var(--negative-soft); color:var(--negative);}
.pill-neutral{background:var(--surface-2); color:var(--ink-soft);}
.pill-accent{background:var(--accent-soft); color:var(--accent-strong);}
.dot{width:8px;height:8px;border-radius:50%;flex:none; display:inline-block; vertical-align:middle;}

/* ============ PROGRESS ============ */
.bar-track{height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden;}
.bar-fill{height:100%; border-radius:99px; background:var(--accent);}
.bar-fill.over{background:var(--negative);}
.bar-fill.good{background:var(--positive);}

/* ============ TABLE ============ */
.table-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13.3px;}
th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; padding:0 12px 12px; border-bottom:1px solid var(--line); white-space:nowrap;}
td{padding:14px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
td.amt, th.amt{text-align:right; font-family:var(--font-mono); font-variant-numeric:tabular-nums;}

/* ============ CATEGORY ROW (budget) ============ */
.cat-row{display:grid; grid-template-columns:170px 1fr 190px; gap:16px; align-items:center; padding:16px 0; border-bottom:1px solid var(--line);}
.cat-row:last-child{border-bottom:none;}
.cat-name{font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:8px;}
.cat-figures{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-soft); font-family:var(--font-mono);}
.cat-edit{display:flex; align-items:center; gap:8px; justify-self:end;}
.cat-edit input{width:96px; text-align:right;}
@media (max-width:760px){ .cat-row{grid-template-columns:1fr; gap:8px;} .cat-edit{justify-self:start;} }

/* ============ CALENDAR ============ */
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-dow{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); text-align:center; padding-bottom:4px; font-weight:600;}
.cal-cell{min-height:92px; border:1px solid var(--line); border-radius:10px; padding:7px; background:var(--surface); display:flex; flex-direction:column; gap:4px;}
.cal-cell.pad{background:transparent; border-color:transparent;}
.cal-cell.today{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
.cal-date{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); font-weight:600;}
.cal-item{font-size:10.8px; border-radius:6px; padding:2px 6px; font-weight:600; line-height:1.3; display:flex; justify-content:space-between; gap:4px;}
.cal-item.bill{background:var(--surface-2); color:var(--ink-soft);}
.cal-item.bill.due{background:var(--negative-soft); color:var(--negative);}
.cal-item.bill.paid{background:var(--positive-soft); color:var(--positive);}
.cal-item.pay{background:var(--accent-soft); color:var(--accent-strong);}
.cal-week-total{grid-column:span 7; font-size:11.5px; color:var(--ink-faint); text-align:right; padding:0 4px 6px;}

/* ============ GOALS / SAVINGS ============ */
.goal-card{padding:24px 22px; display:flex; flex-direction:column; gap:16px;}
.goal-head{display:flex; align-items:center; gap:10px;}
.goal-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-strong);flex:none;}
.goal-title{font-weight:600; font-size:14.5px;}
.goal-sub{font-size:12px; color:var(--ink-soft);}
.goal-figures{display:flex; justify-content:space-between; align-items:baseline;}
.goal-saved{font-family:var(--font-mono); font-size:19px; font-weight:600;}
.goal-goal{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);}
/* Ring-style progress (Savings view) — bold centered percentage, quiet track */
.goal-ring-row{display:flex; align-items:center; gap:16px;}
.progress-ring{position:relative; flex:none; display:block;}
.progress-ring-wrap{position:relative; flex:none; width:72px; height:72px;}
.progress-ring-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:15px; color:var(--ink);}
.goal-ring-info{min-width:0; flex:1;}
.goal-ring-info .goal-title{margin-bottom:2px;}

/* ============ DEBT ============ */
.debt-row{display:flex; align-items:center; gap:14px; padding:16px 0; border-bottom:1px solid var(--line);}
.debt-row:last-child{border-bottom:none;}
.debt-rank{width:24px;height:24px;border-radius:50%;background:var(--surface-2);color:var(--ink-soft);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--font-mono);}
.debt-main{flex:1; min-width:0;}
.debt-name{font-weight:600; font-size:13.6px;}
.debt-sub{font-size:12px; color:var(--ink-soft);}
.debt-balance{font-family:var(--font-mono); font-weight:600; text-align:right; font-size:14.5px;}
.seg{display:flex; border-radius:999px; overflow:hidden; border:1px solid var(--line); width:fit-content;}
.seg button{border:none; background:var(--surface); color:var(--ink-soft); padding:7px 14px; font-size:12.5px; font-weight:600; cursor:pointer;}
.seg button.active{background:var(--accent); color:var(--on-accent);}

/* ============ ACCOUNTS ============ */
.acct-card{padding:18px 20px; display:flex; flex-direction:column; gap:12px;}
.acct-top{display:flex; justify-content:space-between; align-items:flex-start;}
.acct-name{font-weight:600; font-size:14.5px;}
.acct-inst{font-size:12px; color:var(--ink-soft);}
.acct-balance{font-family:var(--font-mono); font-size:22px; font-weight:600;}
.sync-row{display:flex; align-items:center; justify-content:space-between; font-size:11.5px; color:var(--ink-faint);}
.spin{animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ============ HOUSEHOLD ============ */
.member-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line);}
.member-row:last-child{border-bottom:none;}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex:none;font-family:var(--font-display);}
.activity-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px;}
.activity-item:last-child{border-bottom:none;}
.activity-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none;}
.activity-time{color:var(--ink-faint); font-size:11.5px;}

/* ============ INSIGHTS ============ */
.insight-card{padding:20px 22px; display:flex; flex-direction:column; gap:14px; background:linear-gradient(155deg,var(--surface),var(--accent-soft) 180%);}
.insight-list{display:flex; flex-direction:column; gap:10px;}
.insight-line{display:flex; gap:10px; align-items:flex-start; font-size:13.6px; line-height:1.5;}
.insight-line svg{margin-top:2px; flex:none; color:var(--accent-strong);}
.chat-log{display:flex; flex-direction:column; gap:12px; max-height:360px; overflow-y:auto; padding-right:4px;}
.chat-msg{max-width:88%; padding:10px 13px; border-radius:12px; font-size:13.4px; line-height:1.5;}
.chat-msg.q{align-self:flex-end; background:var(--accent); color:var(--on-accent); border-bottom-right-radius:3px;}
.chat-msg.a{align-self:flex-start; background:var(--surface-2); border-bottom-left-radius:3px; white-space:pre-wrap;}
.chat-input-row{display:flex; gap:8px; margin-top:6px;}
.ai-status{font-size:11.5px; color:var(--ink-faint); display:flex; align-items:center; gap:6px;}

/* ============ MISC ============ */
.section-title{font-size:15px; margin-bottom:2px;}
.muted{color:var(--ink-soft);}
.faint{color:var(--ink-faint); font-size:12px;}
.divider{height:1px; background:var(--line); margin:18px 0;}
.stack{display:flex; flex-direction:column; gap:14px;}
.hstack{display:flex; align-items:center; gap:10px;}
.steps-list{margin:10px 0 0; padding-left:20px; display:flex; flex-direction:column; gap:8px;}
.steps-list li{font-size:13px; color:var(--ink-soft); line-height:1.5;}
.steps-list li strong{color:var(--ink);}
.example-tag{font-size:11px; color:var(--ink-faint); border:1px dashed var(--line); border-radius:7px; padding:2px 8px;}
.empty{color:var(--ink-faint); font-size:13px; padding:20px 0; text-align:center;}

/* ============ CATEGORY MANAGEMENT ============ */
.cat-manage-row{display:grid; grid-template-columns:1fr 120px 30px; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line);}
.cat-manage-row:last-child{border-bottom:none;}
.cat-manage-row input[type="text"]{font-weight:600;}
.cat-manage-row input[type="number"]{text-align:right;}
.th-label{font-size:11px; font-weight:600; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em;}
.bill-row{padding:10px 0; border-bottom:1px solid var(--line);}
.bill-row:last-child{border-bottom:none;}
.bill-row select, .bill-row input[type="number"]{width:auto;}

/* ============ ALERTS ============ */
.alert-banner{display:flex; align-items:flex-start; gap:10px; padding:11px 15px; border-radius:var(--radius-m); font-size:12.8px; font-weight:600; line-height:1.4;}
.alert-banner svg{flex:none; margin-top:1px;}
.alert-banner.warn{background:var(--negative-soft); color:var(--negative);}
.alert-banner.notice{background:var(--accent-soft); color:var(--accent-strong);}
.alert-stack{display:flex; flex-direction:column; gap:8px;}

/* ============ RANGE SELECTOR ============ */
.range-bar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
.range-custom{display:flex; align-items:center; gap:8px;}
.range-custom input{width:140px;}

/* ============ HOUSEHOLD SWITCHER (sidebar) ============ */
.hh-switch{padding:0 10px 14px;}
.hh-switch select{width:100%; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.18); color:#fff; font-size:12px; padding:7px 8px; border-radius:8px;}
.hh-switch select option{color:#111;}
.hh-switch input[type="text"]{width:100%; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.18); color:#fff;}
.hh-switch input[type="text"]::placeholder{color:#A9AFBE;}
.ccy-switch{padding:0 10px 14px;}
.ccy-switch select{width:100%; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.18); color:#fff; font-size:12px; padding:7px 8px; border-radius:8px;}
.ccy-switch select option{color:#111;}
.account-switch{padding:0 10px 12px; font-size:12px;}
.account-switch .acct-row{display:flex; align-items:center; justify-content:space-between; gap:8px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); border-radius:8px; padding:8px 10px;}
.account-switch .acct-email{color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11.5px;}
.account-switch .acct-status{color:#B9C0CC; font-size:11px;}
.account-switch button.link-btn{background:none; border:none; color:#EC8CA8; font-size:11.5px; font-weight:600; cursor:pointer; padding:0; text-decoration:underline;}
.account-switch .acct-signedout{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:2px 2px;}
.auth-modal-backdrop{position:fixed; inset:0; background:rgba(20,14,18,.55); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px;}
.auth-modal{background:var(--surface); color:var(--ink); border-radius:14px; padding:24px; width:100%; max-width:360px; box-shadow:0 20px 60px rgba(0,0,0,.35);}
.auth-modal h3{margin:0 0 4px;}
.auth-modal .tabs{display:flex; gap:6px; margin:14px 0 12px; background:var(--surface-2); border-radius:8px; padding:3px;}
.auth-modal .tabs button{flex:1; padding:7px; border:none; background:none; border-radius:6px; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
.auth-modal .tabs button.active{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12);}
.auth-modal .field{margin-bottom:10px;}
.auth-modal .field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:4px;}
.auth-modal input[type="email"], .auth-modal input[type="password"]{width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line); font-size:13.5px;}
.auth-modal .remember-row{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-soft); margin:10px 0;}
.auth-modal .auth-status{font-size:12.5px; margin:8px 0; min-height:16px;}
.auth-modal .auth-status.err{color:var(--negative);}
.auth-modal .auth-status.ok{color:var(--positive);}
.auth-modal .auth-status.info{color:var(--ink-soft);}
.auth-modal .auth-actions{display:flex; gap:8px; margin-top:6px;}
.auth-modal .auth-actions button{flex:1;}
.auth-modal .close-x{position:absolute; top:14px; right:16px; background:none; border:none; font-size:18px; cursor:pointer; color:var(--ink-faint); line-height:1;}
.auth-modal{position:relative;}
.auth-modal .guest-link{display:block; text-align:center; margin-top:14px; font-size:12px; color:var(--ink-soft); text-decoration:underline; cursor:pointer; background:none; border:none;}
.hh-actions{display:flex; gap:6px; margin-top:6px;}
.hh-actions button{flex:1; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16); color:#D8DCE6; font-size:11px; padding:5px 0; border-radius:7px; cursor:pointer;}
.hh-actions button:hover{background:rgba(255,255,255,.14); color:#fff;}

/* ============ RECURRING / SUBSCRIPTIONS ============ */
.recur-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line);}
.recur-row:last-child{border-bottom:none;}
.recur-icon{width:30px;height:30px;border-radius:8px;background:var(--surface-2);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex:none;}
.recur-main{flex:1; min-width:0;}
.recur-name{font-weight:600; font-size:13.4px;}
.recur-sub{font-size:11.8px; color:var(--ink-soft);}
.recur-amt{font-family:var(--font-mono); font-weight:600; text-align:right;}

/* ============ CURRENCY ============ */
.fx-row{display:flex; gap:6px; align-items:center;}
.fx-row select{width:76px; flex:none;}
.fx-note{font-size:11px; color:var(--ink-faint); margin-top:4px;}

/* ============ CHART LEGENDS (real HTML, not canvas-drawn — crisper text, real currency labels) ============ */
.chart-legend{display:flex; flex-wrap:wrap; gap:8px 16px; justify-content:center; margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
.chart-legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft);}
.chart-legend-item .swatch{width:9px; height:9px; border-radius:3px; flex:none;}
.chart-legend-item .lg-val{font-family:var(--font-mono); font-weight:600; color:var(--ink);}
.chart-legend-item .lg-right{display:flex; align-items:baseline; gap:7px; flex:none; white-space:nowrap;}
.chart-legend-item .lg-pct{font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--ink-faint); min-width:26px; text-align:right;}
.chart-donut-row{display:flex; gap:18px; align-items:center;}
.chart-donut-wrap{position:relative; flex:0 0 auto; width:150px; height:150px!important;}
.chart-donut-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; text-align:center;}
.chart-donut-center .dc-value{font-family:var(--font-mono); font-weight:700; font-size:16px; color:var(--ink); line-height:1.15;}
.chart-donut-center .dc-label{font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; margin-top:1px;}
.chart-legend-list{flex:1; min-width:0; display:flex; flex-direction:column; gap:7px; margin-top:0; padding-top:0; border-top:none; justify-content:center;}
.chart-legend-list .chart-legend-item{justify-content:space-between; font-size:12.5px; min-width:0;}
.chart-legend-list .chart-legend-item .lg-name{display:flex; align-items:center; gap:7px; font-weight:500; color:var(--ink); min-width:0; flex:1 1 auto;}
.chart-legend-list .chart-legend-item .lg-name-text{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}

/* ============ PRINT REPORT ============ */
#print-report{display:none;}
@media print{
  body *{ visibility:hidden; }
  #print-report, #print-report *{ visibility:visible; }
  #print-report{ display:block; position:absolute; top:0; left:0; width:100%; padding:24px; }
  #print-report h2{font-size:20px; margin-bottom:2px;}
  #print-report table{width:100%; border-collapse:collapse; font-size:12px; margin-top:10px;}
  #print-report th,#print-report td{border-bottom:1px solid #ccc; padding:6px 8px; text-align:left;}
  #print-report td.amt,#print-report th.amt{text-align:right;}
}

/* ============ MOBILE ============ */
/* Round 15 — the old approach squeezed the household switcher, currency switcher, all 9 nav
   items and the account row into one horizontally-scrolling bottom strip. On a real phone that
   meant most nav buttons (Income included) were scrolled out of view or crammed too tight to tap.
   Replaced with a standard slide-in drawer: hidden off-screen by default, opened with the hamburger
   button in the topbar, closed by the backdrop, the X, or by picking a page. */
@media (max-width:900px){
  .menu-toggle{display:flex;}
  .sidebar{
    inset:0 auto 0 auto; left:0; width:min(82vw,300px); height:100vh;
    transform:translateX(-100%); transition:transform .25s ease; z-index:40;
    overflow-y:auto; box-shadow:2px 0 28px rgba(0,0,0,.3);
  }
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .topbar{padding:12px 16px; flex-wrap:wrap;}
  .view{padding:18px 16px 40px;}
}
</style>

/* ================= CLOUD ACCOUNTS (Supabase) =================
   Real login with an account that survives clearing this browser or switching devices — the thing
   local-storage-only data can't do. Deliberately NOT a hard gate: the app works fully signed-out
   (today's local-only behavior, unchanged) so the Claude preview stays fully explorable even though
   the sign-in call itself is blocked here by the same network policy that blocks the live FX lookup.
   Signing in is how a household's data starts following an ACCOUNT instead of a browser. */
var SUPABASE_URL = 'https://njauhqkecovvktwkxdzb.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_j4eDvlstQw0naxHZ86Z0nQ_Cm0IVMx4';
var REMEMBER_KEY = 'steadyspend-remember';
function rememberEnabled(){ try { return localStorage.getItem(REMEMBER_KEY) !== '0'; } catch(e){ return true; } }
// "Keep me signed in" toggles which storage backs the session token: localStorage survives closing the
// browser (real auto-login next visit); sessionStorage clears when the tab/window closes. Supabase's
// client just needs a storage object with this shape — it doesn't care which real store sits behind it.
var authStorage = {
  getItem: function(key){ try { return (rememberEnabled()?localStorage:sessionStorage).getItem(key); } catch(e){ return null; } },
  setItem: function(key, value){ try { (rememberEnabled()?localStorage:sessionStorage).setItem(key, value); } catch(e){} },
  removeItem: function(key){ try { localStorage.removeItem(key); sessionStorage.removeItem(key); } catch(e){} }
};
var supabaseClient = null, currentUser = null, supabaseSdkSettled = false, cloudSyncTimer = null;

function initAuth(){
  function onSdkEvent(){
    if (supabaseSdkSettled) return; // the ready event and the timeout race — only act on whichever comes first
    supabaseSdkSettled = true;
    if (window.__supabaseCreateClient){
      try {
        supabaseClient = window.__supabaseCreateClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{storage:authStorage, persistSession:true, autoRefreshToken:true}});
      } catch(e){ supabaseClient = null; }
    }
    if (!supabaseClient){ renderAccountWidget(); return; }
    supabaseClient.auth.getSession().then(function(res){
      var session = res && res.data && res.data.session;
      if (session && session.user) onSignedIn(session.user, true);
      else renderAccountWidget();
    }).catch(function(){ renderAccountWidget(); });
    supabaseClient.auth.onAuthStateChange(function(event, session){
      if (event==='SIGNED_IN' && session && session.user) onSignedIn(session.user, false);
      else if (event==='SIGNED_OUT'){ currentUser = null; renderAccountWidget(); }
    });
  }
  window.addEventListener('supabase-sdk-ready', onSdkEvent, {once:true});

  setTimeout(onSdkEvent, 7000);

function cloudPullHouseholds(initialLoad){

// Debounced cloud upsert of the ACTIVE household, called from persist() — a no-op while signed out.
// Snapshots state synchronously (JSON round-trip) so a fast household switch during the debounce window
// can never let a later save write the wrong household's data under the earlier one's id.
function cloudSyncPersist(){
  if (!currentUser || !supabaseClient) return;
  var householdId = hhIndex.activeId;
  var snapshot;
  try { snapshot = JSON.parse(JSON.stringify(state)); } catch(e){ return; }
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(function(){
    supabaseClient.from('budgets').upsert({
      user_id: currentUser.id, household_id: householdId,
      name: (snapshot.household && snapshot.household.name) || householdId,
      state: snapshot, updated_at: new Date().toISOString()
    }, {onConflict:'user_id,household_id'}).then(function(res){
      if (res && res.error) console.warn('Steadyspend: cloud sync failed —', res.error.message);
    }).catch(function(){ /* offline — local copy already has it; will retry on the next edit */ });
  }, 600);
}

function closeAuthModal(){ var b = document.getElementById('auth-modal-backdrop'); if (b) b.remove(); }
function wireAuthModal(sdkDown){
  var closeBtn = document.getElementById('auth-modal-close');
  if (closeBtn) closeBtn.addEventListener('click', closeAuthModal);
  var backdrop = document.getElementById('auth-modal-backdrop');
  if (backdrop) backdrop.addEventListener('click', function(e){ if (e.target===backdrop) closeAuthModal(); });
  if (sdkDown){
    var guestBtn = document.getElementById('auth-guest-btn');
    if (guestBtn) guestBtn.addEventListener('click', closeAuthModal);
    return;
  }
  var mode = 'signin';
  var tabs = document.querySelectorAll('[data-authtab]');
  Array.prototype.forEach.call(tabs, function(t){
    t.addEventListener('click', function(){
      mode = t.getAttribute('data-authtab');
      Array.prototype.forEach.call(tabs, function(x){ x.classList.toggle('active', x===t); });
      document.getElementById('auth-submit').textContent = mode==='signin' ? 'Sign in' : 'Create account';
      document.getElementById('auth-status').textContent = '';
    });
  });
  var guestLink = document.getElementById('auth-guest-link');
  if (guestLink) guestLink.addEventListener('click', closeAuthModal);
  var form = document.getElementById('auth-form');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var email = document.getElementById('auth-email').value.trim();
    var password = document.getElementById('auth-password').value;
    var remember = document.getElementById('auth-remember').checked;
    var statusEl = document.getElementById('auth-status');
    var submitBtn = document.getElementById('auth-submit');
    if (!email || !password){ statusEl.className='auth-status err'; statusEl.textContent = 'Enter an email and password.'; return; }
    try { localStorage.setItem(REMEMBER_KEY, remember ? '1':'0'); } catch(err){}
    submitBtn.disabled = true;
    statusEl.className = 'auth-status info';
    statusEl.textContent = mode==='signin' ? 'Signing in…' : 'Creating your account…';
    // emailRedirectTo sends the confirmation link back to wherever this app is ACTUALLY running
    // (window.location.origin), instead of Supabase's default (whatever "Site URL" is set to in the
    // Supabase dashboard — often left at a placeholder like localhost, which is exactly the wrong
    // destination once this is deployed for real). Supabase also requires this exact URL to be listed
    // under Authentication → URL Configuration → Redirect URLs in the dashboard, or it silently falls
    // back to the Site URL anyway — that dashboard step still has to be done once, by hand.
    var call = mode==='signin'
      ? supabaseClient.auth.signInWithPassword({email:email, password:password})
      : supabaseClient.auth.signUp({email:email, password:password, options:{emailRedirectTo: window.location.origin + window.location.pathname}});
    call.then(function(res){
      submitBtn.disabled = false;
      if (res.error){ statusEl.className='auth-status err'; statusEl.textContent = res.error.message; return; }
      if (mode==='signup' && res.data && res.data.user && !res.data.session){
        statusEl.className='auth-status ok';
        statusEl.textContent = 'Account created — check your email to confirm, then sign in.';
        return;
      }
      statusEl.className='auth-status ok';
      statusEl.textContent = 'Signed in!';
      setTimeout(closeAuthModal, 500);
    }).catch(function(){
      submitBtn.disabled = false;
      statusEl.className='auth-status err';
      statusEl.textContent = 'Couldn’t reach the sign-in service right now — try again once this is deployed outside the preview sandbox.';
    });
  });
}

/* ================= FORMAT HELPERS ================= */
function usd0(n){ return (n<0?'-':'') + '$' + Math.round(Math.abs(n)).toLocaleString('en-US'); }
function usd2(n){ var s = Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); return (n<0?'-':'') + '$' + s; }
function pct(n){ return Math.round(n) + '%'; }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
// a "day of month" field (bill/debt due day, income pay day) is stored 1-31 so "31" can mean "the last day of the month" —
// this resolves it to a real day for a SPECIFIC month, so a Feb with 28 days still gets a valid, visible date instead of
// the item silently vanishing (or, before this fix, being force-clamped down to the 28th even in a 31-day month)
function effDay(day, ym){ var p = parseYM(ym); return Math.min(day||1, daysInMonth(p.y,p.m)); }
function clampDay(v){ var n = parseInt(v); return clamp(isNaN(n)?1:n, 1, 31); }
function clampMoney(v){ var n = parseFloat(v); return isNaN(n) ? 0 : Math.max(0, n); }
// Every due-day/pay-day field is a RECURRING monthly rule, not a one-time date — it has to keep meaning something
// in January (31 days) AND April (30 days) AND February (28/29 days) at once, so it can't be capped to whichever
// month happens to be on screen. This renders what that rule actually resolves to for the month currently shown,
// so "what happens on the 30th/31st" is answered visibly instead of left to guess.
function dayPreviewText(day, ym){
  var d = clampDay(day);
  var dim = daysInMonth(parseYM(ym).y, parseYM(ym).m);
  var mon = monthLabel(ym).split(' ')[0];
  var eff = Math.min(d, dim);
  return d > dim ? ('→ '+mon+' '+eff+' (last day — '+mon+' only has '+dim+')') : ('→ '+mon+' '+eff+' this month');
}
function monthLabel(ym){ var p=ym.split('-'); var d=new Date(parseInt(p[0]),parseInt(p[1])-1,1); return d.toLocaleDateString('en-US',{month:'short',year:'numeric'}); }
function parseYM(ym){ var p=ym.split('-'); return {y:parseInt(p[0]), m:parseInt(p[1])-1}; }
function relTime(iso){
  var d = new Date(iso); var diffMs = TODAY.getTime() - d.getTime();
  var mins = Math.round(diffMs/60000);
  if (mins < 60) return mins<=1?'just now':(mins+'m ago');
  var hrs = Math.round(mins/60);
  if (hrs < 24) return hrs+'h ago';
  var days = Math.round(hrs/24);
  if (days < 7) return days+'d ago';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
var CAT_COLORS = {
  'Bills':'var(--navy)','Groceries':'var(--accent)','Dining Out':'var(--teal)',
  'Transportation':'var(--plum)','Other Variable':'var(--stone)','Debt':'var(--negative)','Savings':'var(--positive)'
};
var CAT_COLORS_HEX = {
  'Bills':'#2F4157','Groceries':'#A8792E','Dining Out':'#3E7C87',
  'Transportation':'#7A5C8E','Other Variable':'#8B8172','Debt':'#9C3B34','Savings':'#2F7D5B'
};

/* ================= DERIVED DATA ================= */
function txForMonth(ym){ return state.transactions.filter(function(t){ return t.date.slice(0,7)===ym; }); }
function sumBy(arr, pred){ return arr.reduce(function(s,x){ return s + (pred(x)?txBase(x):0); },0); }
function billPaidTx(billId, ym){ return txForMonth(ym).find(function(t){ return t.type==='bill' && t.billId===billId; }); }
function categorySpent(catName, ym){ return sumBy(txForMonth(ym), function(t){ return t.type==='variable' && t.category===catName; }); }
function debtById(id){ return state.debts.find(function(d){ return d.id===id; }); }
function savingsById(id){ return state.savings.find(function(s){ return s.id===id; }); }
function accountById(id){ return state.accounts.find(function(a){ return a.id===id; }); }
function incomeById(id){ return state.income.find(function(i){ return i.id===id; }); }
function debtPaidTx(debtId, ym){ return txForMonth(ym).find(function(t){ return t.type==='debt' && t.debtId===debtId; }); }

// income "cadence" used to be decorative free text with no effect on any number — this makes frequency real:
// every income source is normalized to a monthly-equivalent amount, and (where a fixed day makes sense) to real calendar days.
var INCOME_FREQUENCIES = {
  monthly:     {label:'Monthly',             perMonth:function(amt){ return amt; },       dayNote:'Day of month it lands (31 = last day of the month)'},
  semimonthly: {label:'Twice a month',       perMonth:function(amt){ return amt*2; },      dayNote:'Always the 15th and the last day of the month'},
  biweekly:    {label:'Every 2 weeks',       perMonth:function(amt){ return amt*26/12; },  dayNote:'Anchor day this repeats from, every 14 days'},
  weekly:      {label:'Weekly',              perMonth:function(amt){ return amt*52/12; },  dayNote:'Anchor day this repeats from, every 7 days'},
  annually:    {label:'Annually',            perMonth:function(amt){ return amt/12; },     dayNote:'Day it lands once a year — not marked on the calendar every month'},
  variable:    {label:'Variable / irregular',perMonth:function(amt){ return amt; },        dayNote:'No fixed day — enter your typical monthly amount'}
};
function incomeFreq(i){ return INCOME_FREQUENCIES[i.frequency] ? i.frequency : 'monthly'; }
// Variable/irregular income is tracked PER MONTH (amountsByMonth), not as one flat number — a freelance
// paycheck you got in August tells you nothing about September, so a month with no entry defaults to $0
// rather than silently reusing last month's figure. Every other frequency keeps one flat recurring amount.
function incomeAmountForMonth(i, ym){
  ym = ym || state.month;
  if (incomeFreq(i) !== 'variable') return i.amount||0;
  return (i.amountsByMonth && i.amountsByMonth[ym]) || 0;
}
// most recent PRIOR month with a recorded (non-zero) amount — powers the "restore" quick-fill so re-entering
// a real irregular payment this month doesn't mean retyping it from memory.
function incomeLastKnownAmount(i, ym){
  ym = ym || state.month;
  if (!i.amountsByMonth) return 0;
  var months = Object.keys(i.amountsByMonth).filter(function(k){ return k < ym && i.amountsByMonth[k] > 0; }).sort();
  return months.length ? i.amountsByMonth[months[months.length-1]] : 0;
}
function incomeMonthlyEquivalent(i, ym){ return INCOME_FREQUENCIES[incomeFreq(i)].perMonth(incomeAmountForMonth(i, ym)); }
// real calendar days income lands on this month, resolved from frequency — used to auto-mark paydays on the calendar
// instead of relying on a single raw payDay number that made no sense for semimonthly/weekly/biweekly income.
function incomeCalendarDays(ym){
  var p = parseYM(ym), dim = daysInMonth(p.y,p.m);
  var days = [];
  state.income.forEach(function(i){
    var f = incomeFreq(i);
    if (f==='monthly'){
      days.push(effDay(i.payDay||1, ym));
    } else if (f==='semimonthly'){
      days.push(effDay(15, ym));
      days.push(dim);
    } else if (f==='biweekly' || f==='weekly'){
      var anchor = Math.min(clampDay(i.payDay||1), dim);
      var step = f==='weekly' ? 7 : 14;
      for (var d1=anchor; d1<=dim; d1+=step) days.push(d1);
      for (var d2=anchor-step; d2>=1; d2-=step) days.push(d2);
    }
    // annually & variable income has no dependable monthly calendar day, so it's left off the calendar rather than guessed
  });
  return days;
}

/* ================= MULTI-CURRENCY ================= */
var CURRENCIES = {
  USD:'$', EUR:'€', GBP:'£', CAD:'CA$', JPY:'¥', AUD:'AU$',
  CHF:'CHF', CNY:'¥', INR:'₹', MXN:'MX$', BRL:'R$', NZD:'NZ$',
  SEK:'kr', NOK:'kr', DKK:'kr', SGD:'S$', HKD:'HK$', ZAR:'R',
  KRW:'₩', PLN:'zł', THB:'฿', AED:'د.إ', TRY:'₺', ILS:'₪', CZK:'Kč'
};
function baseCcy(){ return state.baseCurrency || 'USD'; }
function ccySymbol(c){ return CURRENCIES[c] || (c+' '); }
// every transaction's value expressed in the household's base currency — legacy rows (no currency field) are treated as already-base
function txBase(t){ return (t.baseAmount!=null) ? t.baseAmount : t.amount; }
function fmtTxAmount(t){
  var ccy = t.currency || baseCcy();
  if (ccy === baseCcy()) return usd2(t.amount);
  var sym = CURRENCIES[ccy] || (ccy+' ');
  return sym + Math.abs(t.amount).toFixed(2) + ' <span class="faint">(≈ ' + usd2(txBase(t)) + ')</span>';
}

// ---- Live exchange rates (Frankfurter API — free, no key, commercial use OK) ----
// This only ever succeeds once Steadyspend is deployed to its own real hosting: the Claude Artifact
// preview's content-security policy blocks outbound network calls, so inside claude.ai this will
// always fall through to the manual-entry fallback below. That's by design, not a bug — the manual
// field keeps working everywhere, and the automatic lookup just quietly takes over once it can.
var fxRateCache = {}; // "FROM_TO_DATE" -> rate (session-only cache, avoids refetching the same pair)
function fetchLiveRate(from, to, date){
  if (from === to) return Promise.resolve(1);
  var key = from+'_'+to+'_'+(date||'latest');
  if (fxRateCache[key] != null) return Promise.resolve(fxRateCache[key]);
  var base = 'https://api.frankfurter.dev/v2/';
  var url = base + (date ? date : 'latest') + '?base=' + encodeURIComponent(from) + '&symbols=' + encodeURIComponent(to);
  if (typeof fetch !== 'function') return Promise.resolve(null);
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 6000) : null;
  return fetch(url, ctrl ? {signal: ctrl.signal} : {}).then(function(res){
    if (timer) clearTimeout(timer);
    if (!res.ok) throw new Error('rate service returned ' + res.status);
    return res.json();
  }).then(function(data){
    var rate = data && data.rates && data.rates[to];
    if (!rate || !isFinite(rate)) throw new Error('no rate in response');
    fxRateCache[key] = rate;
    return rate;
  }).catch(function(){
    if (timer) clearTimeout(timer);
    return null; // blocked by CSP, offline, unsupported currency pair, or the service is down — caller falls back to manual entry
  });
}

function metrics(ym){
  var tx = txForMonth(ym);
  var income = sumBy(tx, function(t){ return t.type==='income'; });
  var expenses = sumBy(tx, function(t){ return t.type==='bill' || t.type==='variable' || t.type==='debt'; });
  var savingsMoved = sumBy(tx, function(t){ return t.type==='savings'; });
  var assetsTotal = state.netWorth.assets.reduce(function(s,a){ return s+a.value; },0);
  var liabilitiesTotal = state.debts.reduce(function(s,d){ return s+d.balance; },0);
  return { income:income, expenses:expenses, savingsMoved:savingsMoved, netCashFlow: income-expenses,
           assetsTotal:assetsTotal, liabilitiesTotal:liabilitiesTotal, netWorth: assetsTotal-liabilitiesTotal };
}

// "Month-end wrap-up": once a calendar month is fully behind you, its actual income vs. actual spending
// is a settled fact — not a plan — so it's worth surfacing once, prompting either "allocate the surplus"
// or "you overspent," rather than leaving that number to quietly vanish into history.
function prevMonthYM(ym){
  var p = parseYM(ym);
  var m = p.m - 1, y = p.y;
  if (m < 0){ m = 11; y -= 1; }
  return y + '-' + String(m+1).padStart(2,'0');
}
function monthClosureInfo(){
  var prevYm = prevMonthYM(state.month);
  var pm = metrics(prevYm);
  if (pm.income===0 && pm.expenses===0) return null; // no recorded activity for that month — nothing to report
  var closure = (state.monthClosures && state.monthClosures[prevYm]) || {status:'pending'};
  if (closure.status !== 'pending') return null; // already allocated, dismissed, or acknowledged
  return { ym: prevYm, label: monthLabel(prevYm), income: pm.income, expenses: pm.expenses, net: pm.income-pm.expenses };
}

var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
// Bills default to 'monthly' when the field is absent — safe for any bill saved before this feature existed.
function billFreq(b){ return (b && b.frequency==='yearly') ? 'yearly' : 'monthly'; }
// What a bill actually costs per month, for budgeting math — a yearly bill's real annual charge divided by 12,
// same pattern as INCOME_FREQUENCIES.annually.perMonth() above.
function billMonthlyEquivalent(b){ return billFreq(b)==='yearly' ? b.budgeted/12 : b.budgeted; }
// Whether a bill is actually relevant to a given viewed month — monthly bills always are; a yearly bill only
// is during its own due month, so it doesn't show up as "due" on every calendar page all year.
function billActiveInMonth(b, ym){ return billFreq(b)==='monthly' ? true : (parseYM(ym).m+1)===(b.dueMonth||1); }
// Next real-calendar occurrence of a yearly bill's (month, day) on or after TODAY — used for the
// "coming up in N days" insight, which has to work across month/year boundaries, not just within
// whichever budgeting month happens to be on screen.
function nextYearlyOccurrence(b){
  var y = TODAY.getFullYear();
  var mIdx = (b.dueMonth||1)-1;
  var day = Math.min(b.dueDay||1, daysInMonth(y, mIdx));
  var occ = new Date(y, mIdx, day);
  if (occ < new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate())){
    y += 1; day = Math.min(b.dueDay||1, daysInMonth(y, mIdx)); occ = new Date(y, mIdx, day);
  }
  return occ;
}
function billsBudgetTotal(){ return state.bills.reduce(function(s,b){ return s+billMonthlyEquivalent(b); },0); }
function variableBudgetTotal(){ return state.variable.reduce(function(s,v){ return s+v.budgeted; },0); }
function debtMinTotal(){ return state.debts.reduce(function(s,d){ return s+d.minPayment; },0); }
function savingsMonthlyTotal(){ return state.savings.reduce(function(s,g){ return s+g.monthly; },0); }
function incomeTotalPlanned(){ return state.income.reduce(function(s,i){ return s+incomeMonthlyEquivalent(i); },0); }
function totalPlannedOutflow(){ return billsBudgetTotal()+variableBudgetTotal()+debtMinTotal()+(state.debtExtra||0)+savingsMonthlyTotal(); }

/* ================= DEBT SIMULATION ================= */
function debtPriorityOrder(){
  return state.debtMethod==='snowball'
    ? state.debts.slice().sort(function(a,b){ return a.balance-b.balance; })
    : state.debts.slice().sort(function(a,b){ return b.apr-a.apr; });
}
function simulateDebtPayoff(debts, method, extra){
  var list = debts.map(function(d){ return {id:d.id,name:d.name,balance:d.balance,apr:d.apr,minPayment:d.minPayment}; });
  if (!list.length) return { months:0, totalInterest:0, timeline:[0] };
  var order = method==='snowball'
    ? list.slice().sort(function(a,b){ return a.balance-b.balance; })
    : list.slice().sort(function(a,b){ return b.apr-a.apr; });
  var timeline = [ list.reduce(function(s,d){ return s+d.balance; },0) ];
  var totalInterest = 0, months = 0;
  var extraPool = extra;
  while (order.some(function(d){ return d.balance>0.005; }) && months < 360){
    months++;
    var freedThisMonth = 0;
    order.forEach(function(d){
      if (d.balance<=0.005) return;
      var interest = d.balance * (d.apr/100/12);
      totalInterest += interest;
      d.balance += interest;
    });
    var pool = extraPool;
    for (var i=0;i<order.length;i++){
      var d = order[i];
      if (d.balance<=0.005) continue;
      var pay = Math.min(d.minPayment, d.balance);
      d.balance -= pay;
    }
    for (var j=0;j<order.length;j++){
      var dd = order[j];
      if (dd.balance<=0.005) continue;
      var apply = Math.min(pool, dd.balance);
      dd.balance -= apply;
      pool -= apply;
      if (pool<=0) break;
    }
    order.forEach(function(d){ if (d.balance<0) d.balance=0; if (d.balance<=0.005 && d.balance>0){ freedThisMonth += d.minPayment; d.balance=0; } });
    extraPool = extra + freedThisMonth;
    timeline.push(order.reduce(function(s,d){ return s+d.balance; },0));
  }
  return { months:months, totalInterest:totalInterest, timeline:timeline };
}

/* ================= HEURISTIC INSIGHTS ================= */
function heuristicInsights(){
  var out = [];
  var ym = state.month;
  var dim = daysInMonth(parseYM(ym).y, parseYM(ym).m);
  var elapsed = clamp(TODAY.getDate(),1,dim);
  var m = metrics(ym);

  // 1. category pace
  var candidates = state.variable.map(function(v){
    var spent = categorySpent(v.name, ym);
    var projected = spent/elapsed*dim;
    return {name:v.name, spent:spent, budgeted:v.budgeted, projected:projected, ratio: v.budgeted>0?projected/v.budgeted:0};
  }).filter(function(c){ return c.spent>0; }).sort(function(a,b){ return b.ratio-a.ratio; });
  if (candidates.length){
    var c = candidates[0];
    if (c.ratio >= 1.05){
      out.push('At the current pace, ' + c.name + ' is on track to land near ' + usd0(c.projected) + ' this month — about ' + usd0(c.projected-c.budgeted) + ' over your ' + usd0(c.budgeted) + ' budget.');
    } else {
      out.push(c.name + ' is ' + usd0(c.spent) + ' spent through day ' + elapsed + ' — projected to finish around ' + usd0(c.projected) + ', under the ' + usd0(c.budgeted) + ' budget.');
    }
  }

  // 2. cash flow timing
  if (m.netCashFlow < 0){
    var nextPay = state.income[0];
    out.push('You’re ' + usd0(Math.abs(m.netCashFlow)) + ' negative for ' + monthLabel(ym) + ' so far — expected, since ' + (nextPay?nextPay.name:'the next paycheck') + ' (' + usd0(nextPay?nextPay.amount:0) + ') typically lands mid-month.');
  } else {
    out.push('Cash flow is positive for ' + monthLabel(ym) + ': ' + usd0(m.income) + ' in against ' + usd0(m.expenses) + ' out so far, a cushion of ' + usd0(m.netCashFlow) + '.');
  }

  // 3. debt interest savings from extra payment
  if (state.debts.length){
    var withExtra = simulateDebtPayoff(state.debts, state.debtMethod, state.debtExtra);
    var noExtra = simulateDebtPayoff(state.debts, state.debtMethod, 0);
    var monthsSaved = noExtra.months - withExtra.months;
    var interestSaved = noExtra.totalInterest - withExtra.totalInterest;
    if (state.debtExtra>0 && monthsSaved>0){
      out.push('Putting an extra ' + usd0(state.debtExtra) + '/mo toward debt (' + (state.debtMethod==='avalanche'?'highest-APR first':'smallest-balance first') + ') clears everything about ' + monthsSaved + ' months sooner and saves roughly ' + usd0(interestSaved) + ' in interest.');
    } else {
      var top = state.debtMethod==='avalanche' ? state.debts.slice().sort(function(a,b){return b.apr-a.apr;})[0] : state.debts.slice().sort(function(a,b){return a.balance-b.balance;})[0];
      out.push(top.name + ' carries the priority spot at ' + state.debtMethod + ' order (' + top.apr + '% APR, ' + usd0(top.balance) + ' left) — extra payments here go furthest.');
    }
  }

  // 4. savings goal ETA
  if (state.savings.length){
    var g = state.savings.slice().sort(function(a,b){ return (a.goal-a.saved)/Math.max(a.monthly,1) - (b.goal-b.saved)/Math.max(b.monthly,1); })[0];
    var remaining = g.goal-g.saved;
    var monthsToGo = g.monthly>0 ? Math.ceil(remaining/g.monthly) : Infinity;
    if (isFinite(monthsToGo)){
      var eta = new Date(TODAY.getFullYear(), TODAY.getMonth()+monthsToGo, 1);
      out.push(g.name + ' is closest to done: ' + usd0(g.saved) + ' of ' + usd0(g.goal) + ' saved, reaching goal around ' + eta.toLocaleDateString('en-US',{month:'long',year:'numeric'}) + ' at ' + usd0(g.monthly) + '/mo.');
    }
  }

  // 5. upcoming bills this week (only bills actually active in the viewed month — a yearly bill
  // due in a different month shouldn't be flagged here just because its day-of-month happens to match)
  var weekEnd = elapsed+7;
  var dueSoon = state.bills.filter(function(b){ return billActiveInMonth(b, ym); }).filter(function(b){ var ed = effDay(b.dueDay, ym); return !billPaidTx(b.id, ym) && ed>=elapsed && ed<=weekEnd; });
  if (dueSoon.length){
    var total = dueSoon.reduce(function(s,b){ return s+b.budgeted; },0);
    out.push(dueSoon.length + ' bill' + (dueSoon.length>1?'s':'') + ' totaling ' + usd0(total) + ' due in the next 7 days: ' + dueSoon.map(function(b){ return b.name+' ('+ordinal(effDay(b.dueDay, ym))+')'; }).join(', ') + '.');
  }

  // 6. yearly bills coming up within 30 real days — independent of whichever month is being viewed,
  // since a yearly bill can be due in a month you're not currently looking at. Unshifted to the FRONT
  // (not pushed to the end) so a time-sensitive heads-up about real money due soon isn't the item that
  // gets silently trimmed off by the Overview's "top 4 insights" cap when other commentary crowds it out.
  state.bills.filter(function(b){ return billFreq(b)==='yearly'; }).forEach(function(b){
    var occ = nextYearlyOccurrence(b);
    var daysUntil = Math.round((occ - new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate())) / 86400000);
    if (daysUntil>=0 && daysUntil<=30){
      out.unshift('Yearly bill ' + b.name + ' (' + usd0(b.budgeted) + ') is coming up in ' + daysUntil + ' day' + (daysUntil===1?'':'s') + ' — due ' + MONTH_NAMES[occ.getMonth()] + ' ' + occ.getDate() + '.');
    }
  });

  return out;
}
function ordinal(n){ var s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }

/* ================= DASHBOARD DATE RANGE ================= */
var RANGE_KEY = 'steadyspend-range';
function loadRangeState(){
  try { var raw = localStorage.getItem(RANGE_KEY); if (raw) return JSON.parse(raw); } catch(e){}
  return { mode:'month', start:null, end:null };
}
function saveRangeState(r){ try { localStorage.setItem(RANGE_KEY, JSON.stringify(r)); } catch(e){} }
var rangeState = loadRangeState();
function lastDayOf(ym){ var p = parseYM(ym); return ym+'-'+String(daysInMonth(p.y,p.m)).padStart(2,'0'); }
function resolveRange(){
  var ym = state.month;
  if (rangeState.mode==='ytd'){
    var yr = ym.slice(0,4);
    return { start: yr+'-01-01', end: (ym===state.today.slice(0,7)) ? state.today : lastDayOf(ym), label:'Year to date ('+yr+')' };
  }
  if (rangeState.mode==='custom' && rangeState.start && rangeState.end){
    return { start: rangeState.start, end: rangeState.end, label: rangeState.start+' → '+rangeState.end };
  }
  var end = (ym===state.today.slice(0,7)) ? state.today : lastDayOf(ym);
  return { start: ym+'-01', end: end, label: monthLabel(ym) + (ym===state.today.slice(0,7)?' (month to date)':'') };
}
function txInRange(start, end){ return state.transactions.filter(function(t){ return t.date>=start && t.date<=end; }); }
function metricsForRange(start, end){
  var tx = txInRange(start, end);
  var income = sumBy(tx, function(t){ return t.type==='income'; });
  var expenses = sumBy(tx, function(t){ return t.type==='bill' || t.type==='variable' || t.type==='debt'; });
  var savingsMoved = sumBy(tx, function(t){ return t.type==='savings'; });
  return { income:income, expenses:expenses, savingsMoved:savingsMoved, netCashFlow: income-expenses, tx:tx };
}
function categorySpentInRange(catName, start, end){ return sumBy(txInRange(start,end), function(t){ return t.type==='variable' && t.category===catName; }); }

/* ================= ALERTS ================= */
function computeAlerts(){
  var out = [];
  var ym = state.month;
  var elapsed = clamp(TODAY.getDate(),1,daysInMonth(parseYM(ym).y,parseYM(ym).m));
  state.variable.forEach(function(v){
    var spent = categorySpent(v.name, ym);
    if (v.budgeted>0 && spent > v.budgeted){
      out.push({level:'warn', text: v.name+' is already '+usd0(spent-v.budgeted)+' over its '+usd0(v.budgeted)+' budget this month.'});
    }
  });
  state.bills.forEach(function(b){
    if (billPaidTx(b.id, ym)) return;
    var due = effDay(b.dueDay, ym);
    var daysUntil = due - elapsed;
    if (daysUntil>=0 && daysUntil<=3){
      out.push({level:'notice', text: b.name+' ('+usd0(b.budgeted)+') is due '+(daysUntil===0?'today':'in '+daysUntil+' day'+(daysUntil>1?'s':''))+'.'});
    } else if (daysUntil<0){
      out.push({level:'warn', text: b.name+' ('+usd0(b.budgeted)+') is overdue — was due the '+ordinal(due)+'.'});
    }
  });
  (state.debts||[]).forEach(function(d){
    if (!d.dueDay) return;
    if (debtPaidTx(d.id, ym)) return;
    var due = effDay(d.dueDay, ym);
    var daysUntil = due - elapsed;
    if (daysUntil>=0 && daysUntil<=3){
      out.push({level:'notice', text: d.name+' minimum payment ('+usd0(d.minPayment)+') is due '+(daysUntil===0?'today':'in '+daysUntil+' day'+(daysUntil>1?'s':''))+'.'});
    }
  });
  detectRecurring().filter(function(r){ return r.change && Math.abs(r.change)>=1; }).forEach(function(r){
    out.push({level:'notice', text: r.merchant+' went '+(r.change>0?'up':'down')+' from '+usd2(r.prevAmount)+' to '+usd2(r.lastAmount)+' per month.'});
  });
  return out;
}

/* ================= RECURRING / SUBSCRIPTION DETECTION ================= */
function detectRecurring(){
  var groups = {};
  state.transactions.forEach(function(t){
    // subscriptions/recurring charges are variable-expense line items, not scheduled Bills (those already live in Budget/Calendar)
    if (t.type!=='variable') return;
    var key = t.merchant.trim().toLowerCase();
    if (!groups[key]) groups[key] = [];
    groups[key].push(t);
  });
  var out = [];
  Object.keys(groups).forEach(function(key){
    var list = groups[key].slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
    var months = {};
    list.forEach(function(t){ months[t.date.slice(0,7)] = true; });
    var monthCount = Object.keys(months).length;
    if (list.length < 4 || monthCount < 4) return;
    var amounts = list.map(txBase);
    var avg = amounts.reduce(function(s,a){return s+a;},0) / amounts.length;
    // recurring/subscription = the charge repeats at essentially the SAME one or two amounts every time (allowing for a single
    // price change) — this is what tells a Netflix-style charge apart from a merchant you just happen to visit often, whose
    // amount is different practically every time (a grocery run, a transit fare)
    var distinct = {}; amounts.forEach(function(a){ distinct[a.toFixed(2)] = true; });
    var distinctCount = Object.keys(distinct).length;
    if (distinctCount > 2 && distinctCount/amounts.length > 0.4) return;
    var last = list[list.length-1];
    var lastAmount = txBase(last);
    // find the most recent point the price actually changed (skipping repeats of the same amount), so a hike from
    // 2 charges ago still gets surfaced even though the last two charges already settled at the new price
    var changeIdx = -1;
    for (var ci=amounts.length-1; ci>0; ci--){ if (Math.abs(amounts[ci]-amounts[ci-1]) >= Math.max(0.5, amounts[ci-1]*0.03)){ changeIdx = ci; break; } }
    var prevAmount = changeIdx>0 ? amounts[changeIdx-1] : lastAmount;
    var changeAmount = changeIdx>0 ? (amounts[changeIdx]-prevAmount) : 0;
    out.push({ merchant:last.merchant, category:last.category, avgAmount:avg, lastAmount:lastAmount, prevAmount:prevAmount, change:changeAmount, occurrences:list.length, firstMonth:list[0].date.slice(0,7) });
  });
  return out.sort(function(a,b){ return b.avgAmount-a.avgAmount; });
}

function recurringHtml(){
  var list = detectRecurring();
  if (!list.length) return '<div class="empty">Nothing recurring detected yet — needs at least 3 months of matching charges.</div>';
  return list.slice(0,10).map(function(r){
    var changeHtml = r.change ? '<span class="pill '+(r.change>0?'pill-negative':'pill-positive')+'" style="margin-left:6px;">'+(r.change>0?'+':'')+usd2(r.change)+' vs last</span>' : '';
    return '<div class="recur-row">'+
      '<div class="recur-icon">'+ic('repeat')+'</div>'+
      '<div class="recur-main"><div class="recur-name">'+esc(r.merchant)+changeHtml+'</div><div class="recur-sub">'+esc(r.category)+' · seen '+r.occurrences+'× since '+monthLabel(r.firstMonth)+'</div></div>'+
      '<div class="recur-amt">'+usd2(r.avgAmount)+'/mo</div>'+
    '</div>';
  }).join('');
}

/* ================= CATEGORY MANAGEMENT ================= */
function renameCategory(oldName, newName){
  if (!newName || newName===oldName) return;
  var cat = state.variable.find(function(v){ return v.name===oldName; });
  if (cat) cat.name = newName;
  state.transactions.forEach(function(t){ if (t.type==='variable' && t.category===oldName) t.category = newName; });
  persist(); toast('Renamed "'+oldName+'" to "'+newName+'"'); route();
}
function removeCategory(id){
  var cat = state.variable.find(function(v){ return v.id===id; });
  state.variable = state.variable.filter(function(v){ return v.id!==id; });
  persist(); toast(cat?cat.name+' removed':'Category removed'); route();
}
function renameBill(id, newName){
  var b = findById(state.bills, id);
  if (!b || !newName || newName===b.name) return;
  var oldName = b.name;
  b.name = newName;
  state.transactions.forEach(function(t){ if (t.type==='bill' && t.billId===id) t.category = newName; });
  persist(); toast('Renamed "'+oldName+'" to "'+newName+'"'); route();
}
function removeBill(id){
  var b = findById(state.bills, id);
  state.bills = state.bills.filter(function(x){ return x.id!==id; });
  persist(); toast(b?b.name+' removed':'Bill removed'); route();
}
function findById(arr, id){ return arr.find(function(x){ return x.id===id; }); }

/* ================= EXPORT: CSV & PRINT ================= */
function csvEscape(s){ s = String(s==null?'':s); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function buildCSV(start, end){
  var rows = [['Date','Merchant','Category','Type','Amount','Currency','Amount (base)']];
  txInRange(start,end).slice().sort(function(a,b){ return a.date.localeCompare(b.date); }).forEach(function(t){
    rows.push([t.date, t.merchant, t.category, t.type, t.amount, t.currency||baseCcy(), txBase(t).toFixed(2)]);
  });
  return rows.map(function(r){ return r.map(csvEscape).join(','); }).join('\r\n');
}
var downloadsCap = null;
function initDownloads(){

  window.claude.use('downloads').then(function(cap){ downloadsCap = cap; }).catch(function(){ downloadsCap = null; });
}
function exportCSV(){

    downloadsCap.save({ filename:filename, data: csv }).catch(function(){ toast('Download was declined or unavailable.'); });
    return;
  }
  // Plain-browser fallback (a real standalone deployment, or any browser tab) — a normal Blob + <a download>
  // works everywhere outside that one sandboxed preview, with no external dependency at all.
  try {
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  } catch(e){
    toast('Download isn’t available in this view — try Print summary instead.');
  }
}

/* ================= SPARKLINE (hand-drawn SVG) ================= */
function sparkline(values, color, w, h){
  w = w||120; h = h||34;
  if (!values.length) return '';
  var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  if (min===max){ min -= 1; max += 1; }
  var pts = values.map(function(v,i){
    var x = values.length>1 ? i/(values.length-1)*w : w/2;
    var y = h - ((v-min)/(max-min))*h;
    return [x,y];
  });
  var line = pts.map(function(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
  var area = 'M'+pts[0][0].toFixed(1)+','+h+' L'+line.replace(/ /g,' L')+' L'+pts[pts.length-1][0].toFixed(1)+','+h+' Z';
  var last = pts[pts.length-1];
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">' +
    '<path d="'+area+'" fill="'+color+'" opacity="0.14"></path>' +
    '<polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>' +
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.6" fill="'+color+'"></circle>' +
  '</svg>';
}

          '<div class="chart-wrap chart-donut-wrap"><canvas id="chart-breakdown"></canvas><div class="chart-donut-center" id="breakdown-center"></div></div>'+
          '<div class="chart-legend chart-legend-list" id="legend-breakdown"></div>'+
        '</div>'+
      '</div>'+
    '</div>'+

    '<div class="grid grid-2">'+
      '<div class="card card-pad">'+
        '<div class="hstack" style="justify-content:space-between; margin-bottom:6px;"><div class="card-title" style="margin-bottom:0;">Upcoming payments</div><a href="#calendar" class="faint" style="text-decoration:none;">Calendar &rarr;</a></div>'+
        (unpaidUpcoming.length ? unpaidUpcoming.map(function(b){

            '<div class="hstack"><span class="num muted" style="font-size:12.5px;">'+usd0(b.amount)+'</span><span class="pill '+(overdue?'pill-negative':'pill-neutral')+'">'+(overdue?'overdue':'due '+ordinal(b.dueDay))+'</span></div>'+
          '</div>';
        }).join('') : '<div class="empty">Everything is paid for this month.</div>')+
      '</div>'+
      '<div class="card card-pad">'+
        '<div class="hstack" style="justify-content:space-between; margin-bottom:6px;"><div class="card-title" style="margin-bottom:0;">Recent transactions</div><a href="#transactions" class="faint" style="text-decoration:none;">See all &rarr;</a></div>'+
        recentTx.map(function(t){ return txRow(t); }).join('')+
