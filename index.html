function kpiTile(label, value, history, colorVar, colorHex){
  return '<div class="card kpi">'+
    '<div class="kpi-top"><div class="kpi-label">'+label+'</div></div>'+
    '<div class="kpi-value">'+usd0(value)+'</div>'+
    sparkline(history, colorHex, 116, 32)+
  '</div>';
}
function txRow(t){
  var sign = t.type==='income' ? '+' : '–';
  var color = t.type==='income' ? 'var(--positive)' : 'var(--ink)';
  var dotColor = t.type==='income' ? 'var(--positive)' : catChartColor(t.category);
  return '<div class="hstack" style="justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);">'+
    '<div class="hstack" style="gap:10px; min-width:0;"><span class="dot" style="background:'+dotColor+'"></span>'+
      '<div style="min-width:0;"><div style="font-weight:600; font-size:13.2px;">'+esc(t.merchant)+'</div><div class="faint">'+esc(t.category)+' · '+t.date.slice(5)+(t.auto?' · auto-categorized':'')+'</div></div></div>'+
    '<div class="num" style="color:'+color+'; font-weight:700; flex:none;">'+sign+' '+fmtTxAmount(t)+'</div>'+
  '</div>';
}

/* ============================================================
   VIEW: BUDGET
   ============================================================ */
var billsExpanded = false; // collapses the bill list once it gets long — reset (collapsed) on every page load, like settingsTab
function billRow(b){
  var ym = state.month;
  var freq = billFreq(b);
  var isYearly = freq==='yearly';
  var monthlyEq = billMonthlyEquivalent(b);
  var activeThisMonth = billActiveInMonth(b, ym);
  var paid = activeThisMonth && !!billPaidTx(b.id, ym);
  var statusPill = activeThisMonth
    ? ('<span class="pill '+(paid?'pill-positive':'pill-neutral')+'">'+(paid?'Paid':'Due '+ordinal(effDay(b.dueDay, ym)))+'</span>')
    : (isYearly ? ('<span class="pill pill-neutral">Next: '+MONTH_NAMES[(b.dueMonth||1)-1].slice(0,3)+' '+(b.dueDay||1)+'</span>') : '');
  return '<div class="bill-row">'+
    '<div class="hstack" style="justify-content:space-between; gap:8px;">'+
      '<div class="hstack" style="gap:8px; flex:1; min-width:0;">'+
        '<input type="text" data-bill-field="name" data-bill-id="'+b.id+'" value="'+esc(b.name)+'" style="font-weight:600; flex:1; min-width:70px;">'+
        statusPill+
      '</div>'+
      '<button class="btn btn-ghost btn-sm" data-bill-remove="'+b.id+'" title="Remove bill" style="padding:2px 8px; font-size:15px; line-height:1; flex:none;">&times;</button>'+
    '</div>'+
    '<div class="hstack" style="gap:8px; margin-top:6px; flex-wrap:wrap;">'+
      '<select data-bill-field="frequency" data-bill-id="'+b.id+'" style="width:auto; flex:none;">'+
        '<option value="monthly"'+(!isYearly?' selected':'')+'>Monthly</option>'+
        '<option value="yearly"'+(isYearly?' selected':'')+'>Yearly</option>'+
      '</select>'+
      '<input type="number" min="0" step="1" data-bill-field="budgeted" data-bill-id="'+b.id+'" value="'+b.budgeted+'" style="width:100px; flex:none;" title="'+(isYearly?'Full amount charged once a year':'Amount charged every month')+'">'+
      '<input type="number" min="1" max="31" data-bill-field="dueDay" data-bill-id="'+b.id+'" value="'+(b.dueDay||1)+'" style="width:60px; flex:none;" title="Day of month">'+
      (isYearly ? ('<select data-bill-field="dueMonth" data-bill-id="'+b.id+'" style="width:auto; flex:none;">'+MONTH_NAMES.map(function(mn,i){ return '<option value="'+(i+1)+'"'+((b.dueMonth||1)===(i+1)?' selected':'')+'>'+mn+'</option>'; }).join('')+'</select>') : '')+
      '<span class="mono faint" style="font-size:12px; margin-left:auto;">'+(isYearly?(usd0(monthlyEq)+'/mo equiv.'):(usd0(monthlyEq)+'/mo'))+'</span>'+
    '</div>'+
  '</div>';
}
function renderBudget(){
  var ym = state.month;
  // total *actual* money out this month (bills paid + variable spent + debt payments) — the denominator for
  // "what share of everything I've actually spent does this one category represent," distinct from the
  // budgeted-vs-actual ratio each row already shows.
  var totalActualExpense = metrics(ym).expenses;
  function row(name, budgeted, actual, editable, onEditAttr){
    var ratio = budgeted>0 ? actual/budgeted : 0;
    var barClass = ratio>1 ? 'over' : (ratio>0.85?'':'good');
    var shareOfTotal = (actual>0 && totalActualExpense>0) ? (actual/totalActualExpense*100) : null;
    return '<div class="cat-row">'+
      '<div class="cat-name"><span class="dot" style="background:'+catChartColor(name)+'"></span>'+esc(name)+'</div>'+
      '<div>'+
        '<div class="bar-track"><div class="bar-fill '+barClass+'" style="width:'+clamp(ratio*100,2,100)+'%"></div></div>'+
        '<div class="cat-figures"><span><strong style="color:var(--ink); font-weight:700;">'+usd0(actual)+'</strong> used</span><span>'+pct(ratio*100)+' of '+usd0(budgeted)+(shareOfTotal!=null?' · <strong style="color:var(--ink); font-weight:700;">'+pct(shareOfTotal)+'</strong> of total spending':'')+'</span></div>'+
      '</div>'+
      '<div class="cat-edit">'+(editable?('<span class="faint">Budget</span><input '+onEditAttr+' type="number" min="0" step="1" value="'+budgeted+'">'):'<span class="pill pill-neutral">fixed</span>')+'</div>'+
    '</div>';
  }
  var billsShowAll = billsExpanded || state.bills.length <= 5;
  var visibleBills = billsShowAll ? state.bills : state.bills.slice(0,5);
  var billsHtml = visibleBills.map(billRow).join('');
  var billsCollapseToggle = state.bills.length > 5
    ? '<button type="button" class="btn btn-ghost btn-sm" id="bills-toggle-expand" style="margin-top:8px;">'+(billsShowAll?'Show less':'Show all '+state.bills.length+' bills')+'</button>'
    : '';
  var varHtml = state.variable.map(function(v){
    return row(v.name, v.budgeted, categorySpent(v.name, ym), true, 'data-var-budget="'+v.id+'"');
  }).join('');
  var manageHtml = state.variable.map(function(v){
    return '<div class="cat-manage-row" style="grid-template-columns:1fr 30px;">'+
      '<input type="text" data-cat-rename="'+esc(v.name)+'" value="'+esc(v.name)+'">'+
      '<button class="btn btn-ghost btn-sm" data-cat-remove="'+v.id+'" title="Remove category" style="padding:2px 8px; font-size:15px; line-height:1;">&times;</button>'+
    '</div>';
  }).join('');

  var priorityId = debtPriorityOrder()[0] ? debtPriorityOrder()[0].id : null;
  var debtHtml = state.debts.map(function(d){
    var label = d.name + (d.id===priorityId && state.debtExtra>0 ? ' + extra' : '');
    return '<div class="cat-row" style="grid-template-columns:170px 1fr 140px;"><div class="cat-name">'+esc(label)+'</div>'+
      '<div class="faint">'+d.apr+'% APR · '+usd0(d.balance)+' balance</div>'+
      '<div class="cat-edit"><span class="pill pill-neutral">min/mo</span><span class="num" style="font-weight:600;">'+usd0(d.minPayment)+'</span></div></div>';
  }).join('') + (state.debtExtra>0 ? '<div class="cat-row" style="grid-template-columns:170px 1fr 140px;"><div class="cat-name">Extra debt payment</div><div class="faint">applied to top-priority debt</div><div class="cat-edit num" style="justify-self:end; font-weight:600;">'+usd0(state.debtExtra)+'</div></div>' : '');
  var savingsHtml = state.savings.map(function(g){
    return '<div class="cat-row" style="grid-template-columns:1fr 140px;"><div class="cat-name">'+esc(g.name)+'</div><div class="cat-edit num" style="justify-self:end; font-weight:600;">'+usd0(g.monthly)+'</div></div>';
  }).join('');

  var totalIncome = incomeTotalPlanned();
  var totalOut = totalPlannedOutflow();
  var billsPct = totalIncome>0 ? (billsBudgetTotal()/totalIncome*100) : 0;
  var billIncomeRows = state.bills.map(function(b){
    var monthlyEq = billMonthlyEquivalent(b);
    return { name:b.name, amount:monthlyEq, pct: totalIncome>0 ? (monthlyEq/totalIncome*100) : 0, color: catChartColor(b.name) };
  }).sort(function(a,b){ return b.pct-a.pct; });

  return '<div class="view">'+
    '<div class="grid grid-3" style="margin-bottom:16px;">'+
      statTile('Planned income', totalIncome, 'var(--positive)')+
      statTile('Planned outflow', totalOut, 'var(--navy)')+
      statTile('Planned surplus', totalIncome-totalOut, (totalIncome-totalOut)>=0?'var(--positive)':'var(--negative)')+
    '</div>'+
    '<div class="faint" style="margin-bottom:16px;">Outflow = Bills + Variable expenses + Debt payments (incl. any extra) + Savings contributions — every line below adds up to the total above. Adding a category? A <strong style="color:var(--ink);">bill</strong> is a fixed recurring charge with its own due day (rent, insurance, a subscription) — add it in the Bills card. A <strong style="color:var(--ink);">variable expense</strong> is spending that changes month to month (groceries, dining out) — add it in the Variable expenses card.</div>'+
    (billIncomeRows.length ? '<div class="card card-pad" style="margin-bottom:16px;">'+
      '<div class="hstack" style="justify-content:space-between;"><div class="card-title" style="margin-bottom:0;">Bills as % of income</div><span class="kpi-value" style="font-size:20px; color:'+(billsPct>50?'var(--negative)':'var(--ink)')+';">'+pct(billsPct)+'</span></div>'+
      '<div class="faint" style="margin:2px 0 12px;">A common rule of thumb keeps fixed bills under ~50% of income, so there’s room left for variable spending, debt payoff, and savings. Each bar below is that bill’s own share of your planned monthly income.</div>'+
      '<div class="chart-wrap" style="height:'+Math.max(90, billIncomeRows.length*32)+'px;"><canvas id="chart-bills-income"></canvas></div>'+
      '<div class="chart-legend chart-legend-list" id="legend-bills-income"></div>'+
    '</div>' : '')+
    '<div class="card card-pad" style="margin-bottom:16px;"><div class="hstack" style="justify-content:space-between;"><div class="card-title" style="margin-bottom:0;">Income</div><a href="#income" class="faint" style="text-decoration:none;">Manage income &rarr;</a></div><div class="kpi-value" style="margin-top:6px; color:var(--positive); font-size:22px;">'+usd0(totalIncome)+' <span class="faint" style="font-size:12px; font-weight:400;">planned / month</span></div></div>'+
    '<div class="card card-pad" style="margin-bottom:16px;"><div class="hstack" style="justify-content:space-between;"><div><div class="card-title" style="margin-bottom:2px;">Bills — recurring</div><div class="faint" style="font-size:11.5px;">Monthly or yearly — edit any field right in the row</div></div><span class="faint">'+usd0(billsBudgetTotal())+' / month</span></div>'+
      (billsHtml || '<div class="empty">No bills yet — add one below.</div>')+billsCollapseToggle+
      '<div class="divider"></div>'+
      addForm('add-bill', 'Add a bill', [
        {name:'name', ph:'Bill name', type:'text'},
        {name:'frequency', ph:'How often', type:'select', options:[{value:'monthly', label:'Monthly', selected:true},{value:'yearly', label:'Yearly'}]},
        {name:'budgeted', ph:'Amount', type:'number'},
        {name:'dueDay', ph:'Due day (1-31, 31=last day)', type:'number', min:1, max:31, dayPreview:true},
        {name:'dueMonth', ph:'Month (yearly bills)', type:'select', options: MONTH_NAMES.map(function(mn,i){ return {value:String(i+1), label:mn, selected:i===0}; }), dependsOnField:'frequency', dependsOnValue:'yearly'}
      ], 'Add bill')+
    '</div>'+
    '<div class="card card-pad" style="margin-bottom:16px;"><div class="hstack" style="justify-content:space-between;"><div><div class="card-title" style="margin-bottom:2px;">Variable expenses — day to day</div><div class="faint" style="font-size:11.5px;">Changes month to month — set a target, not a fixed bill</div></div><span class="faint">'+usd0(variableBudgetTotal())+' / month</span></div>'+varHtml+
      '<div class="divider"></div>'+
      addForm('add-variable', 'Add a variable-expense category', [
        {name:'name', ph:'Category name', type:'text'},
        {name:'budgeted', ph:'Monthly budget', type:'number'}
      ], 'Add category')+
      '<div class="divider"></div>'+
      '<div class="card-title">Rename or remove a category</div>'+
      (manageHtml || '<div class="empty">No categories yet.</div>')+
    '</div>'+
    '<div class="card card-pad" style="margin-bottom:16px;"><div class="hstack" style="justify-content:space-between;"><div class="card-title" style="margin-bottom:0;">Debt payments</div><a href="#debt" class="faint" style="text-decoration:none;">Manage debts &rarr;</a></div>'+debtHtml+'</div>'+
    '<div class="card card-pad"><div class="hstack" style="justify-content:space-between;"><div class="card-title" style="margin-bottom:0;">Savings contributions</div><a href="#savings" class="faint" style="text-decoration:none;">Manage goals &rarr;</a></div>'+savingsHtml+'</div>'+
  '</div>';
}
function statTile(label, value, colorVar, raw){
  var display = raw ? esc(value) : usd0(value);
  return '<div class="card card-pad"><div class="card-title">'+label+'</div><div class="kpi-value" style="color:'+colorVar+'">'+display+'</div></div>';
}
function addForm(id, title, fields, cta){
  return '<div class="stack" id="'+id+'">'+
    '<button class="btn btn-sm" data-toggle-form="'+id+'-form">'+ic('plus')+' '+title+'</button>'+
    '<div class="form-row" id="'+id+'-form" hidden>'+
      fields.map(function(f){
        var depAttrs = f.dependsOnField ? (' data-dep-field="'+f.dependsOnField+'" data-dep-value="'+f.dependsOnValue+'"') : '';
        var depHidden = f.dependsOnField ? ' hidden' : '';
        var fieldHtml;
        if (f.type==='select'){
          fieldHtml = '<div class="field"><label>'+f.ph+'</label><select data-field="'+f.name+'">'+
            (f.options||[]).map(function(o){ return '<option value="'+esc(o.value)+'"'+(o.selected?' selected':'')+'>'+esc(o.label)+'</option>'; }).join('')+
          '</select></div>';
        } else {
          fieldHtml = '<div class="field"><label>'+f.ph+'</label><input data-field="'+f.name+'" type="'+f.type+'" placeholder="'+f.ph+'"'+(f.min!=null?' min="'+f.min+'"':'')+(f.max!=null?' max="'+f.max+'"':'')+(f.title?' title="'+esc(f.title)+'"':'')+(f.dayPreview?' data-day-input':'')+'>'+
            (f.dayPreview ? '<div class="faint mono" data-day-preview style="font-size:10.5px; margin-top:3px;">'+esc(dayPreviewText(1, state.month))+'</div>' : '')+
          '</div>';
        }
        return f.dependsOnField ? ('<div'+depAttrs+depHidden+'>'+fieldHtml+'</div>') : fieldHtml;
      }).join('')+
      '<div class="field"><button class="btn btn-primary" data-submit-form="'+id+'">'+cta+'</button></div>'+
    '</div>'+
  '</div>';
}

function renderIncome(){
  var total = incomeTotalPlanned();
  var rows = state.income.map(function(i){
    var freq = incomeFreq(i);
    var showDay = freq!=='semimonthly';
    var curAmt = incomeAmountForMonth(i, state.month);
    var lastKnown = freq==='variable' ? incomeLastKnownAmount(i, state.month) : 0;
    return '<div class="cat-manage-row" style="grid-template-columns:1.15fr 1.15fr 90px 84px 92px 30px; gap:10px;">'+
      '<input type="text" data-income-field="name" data-income-id="'+i.id+'" value="'+esc(i.name)+'" placeholder="Source name">'+
      '<select data-income-field="frequency" data-income-id="'+i.id+'" title="How often this arrives — drives the monthly total and calendar paydays">'+
        Object.keys(INCOME_FREQUENCIES).map(function(k){ return '<option value="'+k+'"'+(k===freq?' selected':'')+'>'+INCOME_FREQUENCIES[k].label+'</option>'; }).join('')+
      '</select>'+
      '<div><input type="number" min="0" step="1" data-income-field="amount" data-income-id="'+i.id+'" value="'+curAmt+'" title="Amount per '+(freq==='monthly'||freq==='variable'?'month':freq==='annually'?'year':'paycheck')+'">'+
        (freq==='variable' && curAmt===0 && lastKnown>0 ? '<button type="button" class="btn btn-ghost btn-sm" data-income-restore="'+i.id+'" style="padding:1px 6px; font-size:10px; margin-top:3px; white-space:nowrap;" title="Fill in last recorded amount">Restore '+usd0(lastKnown)+'</button>' : '')+
        (freq==='variable' ? '<div class="faint" style="font-size:10px; margin-top:3px;">this month only</div>' : '')+
      '</div>'+
      (showDay
        ? '<div><input type="number" min="1" max="31" data-income-field="payDay" data-income-id="'+i.id+'" data-day-input value="'+(i.payDay||1)+'" title="'+esc(INCOME_FREQUENCIES[freq].dayNote)+'">'+
          '<div class="faint mono" data-day-preview style="font-size:10.5px; margin-top:3px; white-space:nowrap;">'+esc(dayPreviewText(i.payDay||1, state.month))+'</div></div>'
        : '<span class="faint mono" style="font-size:12px;" title="'+esc(INCOME_FREQUENCIES[freq].dayNote)+'">15th &amp; last day</span>')+
      '<span class="mono faint" title="Monthly equivalent — this is what counts toward your planned income total">'+usd0(incomeMonthlyEquivalent(i))+'/mo</span>'+
      '<button class="btn btn-ghost btn-sm" data-income-remove="'+i.id+'" title="Remove income source" style="padding:2px 8px; font-size:15px; line-height:1;">&times;</button>'+
    '</div>';
  }).join('');
  return '<div class="view">'+
    '<div class="card card-pad" style="margin-bottom:16px;"><div class="card-title">Planned monthly income</div><div class="kpi-value" style="color:var(--positive);">'+usd0(total)+'</div>'+
    '<div class="faint" style="margin-top:4px;">Every paycheck, client payment, or other regular deposit your household counts on, converted to a real monthly figure based on how often it actually arrives — kept separate from spending so it\'s always clear where money comes from.</div></div>'+
    '<div class="card card-pad">'+
      '<div class="card-title" style="margin-bottom:10px;">Income sources</div>'+
      '<div class="cat-manage-row" style="grid-template-columns:1.15fr 1.15fr 90px 84px 92px 30px; gap:10px; border-bottom:1px solid var(--line); padding:0 0 8px;">'+
        '<span class="th-label">Source</span><span class="th-label">Frequency</span><span class="th-label">Amount</span><span class="th-label">Anchor day</span><span class="th-label" style="text-align:right;">Monthly equiv.</span><span></span>'+
      '</div>'+
      (rows || '<div class="empty">No income sources yet — add one below.</div>')+
      '<div class="faint" style="margin:6px 0 0;">Frequency actually drives the math: weekly and biweekly amounts are annualized then divided by 12, semimonthly is always the 1st/15th-style twice-a-month pattern (shown on the calendar as the 15th and the last day of the month), and annually is divided by 12. The anchor day accepts 1–31 — 31 always means “the last day of the month,” so a 30-day or 28-day month still gets a real date instead of losing the payment.</div>'+
      '<div class="divider"></div>'+
      addForm('add-income', 'Add an income source', [
        {name:'name', ph:'Source name', type:'text'},
        {name:'frequency', ph:'How often', type:'select', options: Object.keys(INCOME_FREQUENCIES).map(function(k){ return {value:k, label:INCOME_FREQUENCIES[k].label, selected:k==='monthly'}; })},
        {name:'amount', ph:'Amount per paycheck', type:'number'},
        {name:'payDay', ph:'Anchor day (1-31, 31=last day)', type:'number', min:1, max:31, dayPreview:true}
      ], 'Add income')+
    '</div>'+
  '</div>';
}

/* ============================================================
   VIEW: TRANSACTIONS

function renderTransactions(){
  var ym = state.month;
  var tx = txForMonth(ym).slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
  var allCats = [].concat(state.bills.map(function(b){return b.name;}), state.variable.map(function(v){return v.name;}), ['Freelance Income','Salary','Debt Payment','Savings Transfer']);
  var notedTx = tx.filter(function(t){ return t.note; });
  var notedTxHtml = notedTx.map(function(t){
    var dotColor = t.type==='income' ? 'var(--positive)' : catChartColor(t.category);
    return '<div class="hstack" style="justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);">'+
      '<div class="hstack" style="gap:8px; min-width:0; align-items:flex-start;"><span class="dot" style="background:'+dotColor+'; margin-top:5px;"></span>'+
        '<div style="min-width:0;"><div><span style="font-weight:600; font-size:13px;">'+esc(t.merchant)+'</span><span class="faint"> · '+t.date.slice(5)+'</span></div>'+
        '<div class="faint" style="font-style:italic;">'+esc(t.note)+'</div></div></div>'+
      '<span class="num" style="font-size:12.5px; flex:none;">'+usd0(t.amount)+'</span>'+
    '</div>';
  }).join('');

  return '<div class="view">'+
    '<div class="card card-pad" style="margin-bottom:16px;">'+
      '<div class="card-title">Add a transaction</div>'+
      '<div class="form-row">'+
        '<div class="field"><label>Date</label><input type="date" id="tx-date" value="'+state.today+'"></div>'+
        '<div class="field"><label>Merchant</label><input type="text" id="tx-merchant" placeholder="e.g. Trader Joe’s"></div>'+

/* ============================================================
   VIEW: CALENDAR
   ============================================================ */
function renderCalendar(){
  var ym = state.month, p = parseYM(ym);
  var dim = daysInMonth(p.y,p.m);
  var firstDow = new Date(p.y,p.m,1).getDay();
  var payDays = incomeCalendarDays(ym); // auto from Income sources — resolves frequency (semimonthly = 15th + last day) and clamps to this month's real length
  var actualIncomeDays = txForMonth(ym).filter(function(t){ return t.type==='income'; }).map(function(t){ return parseInt(t.date.slice(8,10)); });
  var monthBills = state.bills.filter(function(b){ return billActiveInMonth(b, ym); }); // a yearly bill only shows in its own due month

  var cells = [];
  for (var i=0;i<firstDow;i++) cells.push('<div class="cal-cell pad"></div>');
  for (var d=1; d<=dim; d++){
    var isToday = (state.today === ym+'-'+String(d).padStart(2,'0'));
    var billsToday = monthBills.filter(function(b){ return effDay(b.dueDay, ym)===d; });
    var debtsToday = (state.debts||[]).filter(function(dt){ return effDay(dt.dueDay, ym)===d; });
    var items = billsToday.map(function(b){
      var paid = !!billPaidTx(b.id, ym);
      var overdue = !paid && d < TODAY.getDate();
      var cls = paid?'paid':(overdue?'due':'');
      return '<div class="cal-item bill '+cls+'" data-bill-toggle="'+b.id+'" data-day="'+d+'" title="'+(paid?'Paid':'Click to mark paid')+'">'+esc(b.name)+'<span>'+usd0(b.budgeted)+'</span></div>';
    }).join('') + debtsToday.map(function(dt){
      var paid = !!debtPaidTx(dt.id, ym);
      var overdue = !paid && d < TODAY.getDate();
      var cls = paid?'paid':(overdue?'due':'');
      return '<div class="cal-item bill '+cls+'" data-debt-toggle="'+dt.id+'" data-day="'+d+'" title="'+(paid?'Paid':'Click to mark paid')+' · loan payment">'+esc(dt.name)+'<span>'+usd0(dt.minPayment)+'</span></div>';
    }).join('');
    var payItem = (payDays.indexOf(d)>=0 || actualIncomeDays.indexOf(d)>=0) ? '<div class="cal-item pay">Payday</div>' : '';
    cells.push('<div class="cal-cell'+(isToday?' today':'')+'"><div class="cal-date">'+d+'</div>'+payItem+items+'</div>');
  }
  // pad trailing to full weeks & add weekly totals
  while (cells.length % 7 !== 0) cells.push('<div class="cal-cell pad"></div>');
  var weeks = [];
  for (var w=0; w<cells.length; w+=7){
    weeks.push(cells.slice(w,w+7).join(''));
    var weekDays = [];
    for (var k=w; k<w+7; k++){ var dayNum = k-firstDow+1; if (dayNum>=1 && dayNum<=dim) weekDays.push(dayNum); }
    var weekBills = monthBills.filter(function(b){ return weekDays.indexOf(effDay(b.dueDay, ym))>=0; }).reduce(function(s,b){ return s+b.budgeted; },0);
    var weekDebts = (state.debts||[]).filter(function(dt){ return weekDays.indexOf(effDay(dt.dueDay, ym))>=0; }).reduce(function(s,dt){ return s+dt.minPayment; },0);
    if (weekDays.length) weeks.push('<div class="cal-week-total">Due this week (bills + loans): '+usd0(weekBills+weekDebts)+'</div>');
  }

  var dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return '<div class="view">'+
    '<div class="card card-pad">'+
      '<div class="cal-grid">'+ dows.map(function(x){ return '<div class="cal-dow">'+x+'</div>'; }).join('') + weeks.join('') +'</div>'+
      '<div class="hstack" style="margin-top:14px; gap:16px; flex-wrap:wrap;">'+
        legendDot('var(--accent-soft)','var(--accent-strong)','Payday')+
        legendDot('var(--surface-2)','var(--ink-soft)','Bill / loan payment scheduled')+
        legendDot('var(--negative-soft)','var(--negative)','Overdue')+
        legendDot('var(--positive-soft)','var(--positive)','Paid')+
      '</div>'+
      '<div class="faint" style="margin-top:8px;">Bills and loan minimum payments show up here automatically — nothing to enter by hand.</div>'+
    '</div>'+
  '</div>';
}
function legendDot(bg,fg,label){ return '<div class="hstack" style="font-size:12px; color:var(--ink-soft);"><span style="width:12px;height:12px;border-radius:4px;background:'+bg+';border:1px solid '+fg+';display:inline-block;"></span>'+label+'</div>'; }

/* Ring-style progress: bold centered percentage, quiet track. Used on the Savings view's
   goal cards, where each goal already has its own dedicated card. Returns just the <svg>. */
function progressRing(ratio, color, size){
  size = size || 72;
  var stroke = Math.max(4, Math.round(size*0.1));
  var r = (size - stroke) / 2;
  var c = 2 * Math.PI * r;
  var pct = clamp(ratio, 0, 100);
  var offset = c * (1 - pct/100);
  var cx = size/2, cy = size/2;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" class="progress-ring">'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="'+stroke+'"></circle>'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" '+
        'stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+offset.toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"></circle>'+
    '</svg>';
}

    var monthsToGo = g.monthly>0?Math.ceil(remaining/g.monthly):Infinity;
    var eta = isFinite(monthsToGo) ? new Date(TODAY.getFullYear(), TODAY.getMonth()+monthsToGo,1).toLocaleDateString('en-US',{month:'short',year:'numeric'}) : '—';
    var ringColor = ratio>=100 ? 'var(--positive)' : 'var(--accent)';
    return '<div class="card goal-card">'+
      '<div class="hstack" style="justify-content:space-between; align-items:flex-start;">'+
        '<div class="goal-ring-row">'+
          '<div class="progress-ring-wrap">'+progressRing(ratio, ringColor, 72)+'<div class="progress-ring-label">'+Math.round(ratio)+'%</div></div>'+
          '<div class="goal-ring-info"><div class="goal-title">'+esc(g.name)+'</div><div class="goal-sub">on track for '+eta+'</div></div>'+
        '</div>'+
        '<button class="btn btn-ghost btn-sm" data-goal-remove="'+g.id+'" title="Remove goal" style="padding:2px 8px; font-size:15px; line-height:1; flex:none;">&times;</button>'+
      '</div>'+
      '<div class="goal-figures"><span class="goal-saved">'+usd0(g.saved)+'</span><span class="goal-goal">saved of '+usd0(g.goal)+' total goal</span></div>'+
      '<div class="hstack" style="gap:8px;">'+
        '<div class="field" style="flex:1; margin-bottom:0;"><label>Saved so far</label><input type="number" min="0" step="10" data-goal-saved="'+g.id+'" value="'+g.saved+'" title="Fix this directly if the running total is ever wrong — no need to zero it out and re-add funds"></div>'+
        '<div class="field" style="flex:1; margin-bottom:0;"><label>Total goal</label><input type="number" min="1" step="50" data-goal-target="'+g.id+'" value="'+g.goal+'" title="The full amount you want saved up for this, in total — not a monthly amount"></div>'+
        '<div class="field" style="flex:1; margin-bottom:0;"><label>Monthly</label><input type="number" min="0" step="10" data-goal-monthly="'+g.id+'" value="'+g.monthly+'" title="How much you plan to add toward this goal each month"></div>'+
      '</div>'+

    '</div>';
  }).join('');
  return '<div class="view">'+
    '<div class="grid grid-3" style="margin-bottom:16px;">'+ (goalCards || '<div class="card card-pad empty" style="grid-column:1/-1;">No savings goals yet — add one below.</div>') +'</div>'+
    '<div class="card card-pad">'+
      addForm('add-goal', 'Add a savings goal', [
        {name:'name', ph:'Goal name', type:'text'},
        {name:'goal', ph:'Total amount you want saved', type:'number'},
        {name:'monthly', ph:'Monthly contribution', type:'number'},
        {name:'saved', ph:'Already saved (optional)', type:'number'}
      ], 'Add goal')+
    '</div>'+
  '</div>';
}

/* ============================================================
   VIEW: NET WORTH
   ============================================================ */
function renderNetWorth(){
  var assetsTotal = state.netWorth.assets.reduce(function(s,a){ return s+a.value; },0);
  var debtLiab = state.debts.map(function(d){ return {name:d.name, value:d.balance}; });
  var debtLiabTotal = debtLiab.reduce(function(s,l){ return s+l.value; },0);
  var otherLiab = state.netWorth.liabilities || [];
  var otherLiabTotal = otherLiab.reduce(function(s,l){ return s+l.value; },0);
  var liabTotal = debtLiabTotal + otherLiabTotal;
  var net = assetsTotal-liabTotal;
  var hist = state.netWorth.history.map(function(h){ return h.value; });
  hist[hist.length-1] = net;
  var prev = hist[hist.length-2]||net;
  var delta = net-prev;

  function assetRow(a, idx){
    return '<div class="cat-manage-row" style="grid-template-columns:1fr 130px 30px;">'+
      '<input type="text" data-asset-field="name" data-asset-idx="'+idx+'" value="'+esc(a.name)+'">'+
      '<input type="number" step="1" data-asset-field="value" data-asset-idx="'+idx+'" value="'+a.value+'">'+
      '<button class="btn btn-ghost btn-sm" data-asset-remove="'+idx+'" title="Remove asset" style="padding:2px 8px; font-size:15px; line-height:1;">&times;</button>'+
    '</div>';
  }
  function liabRow(l, idx){
    return '<div class="cat-manage-row" style="grid-template-columns:1fr 130px 30px;">'+
      '<input type="text" data-liab-field="name" data-liab-idx="'+idx+'" value="'+esc(l.name)+'">'+
      '<input type="number" step="1" data-liab-field="value" data-liab-idx="'+idx+'" value="'+l.value+'">'+
      '<button class="btn btn-ghost btn-sm" data-liab-remove="'+idx+'" title="Remove" style="padding:2px 8px; font-size:15px; line-height:1;">&times;</button>'+
    '</div>';
  }

  return '<div class="view">'+
    '<div class="grid grid-3" style="margin-bottom:16px;">'+
      statTile('Assets', assetsTotal, 'var(--positive)')+
      statTile('Liabilities', liabTotal, 'var(--negative)')+
      '<div class="card card-pad"><div class="card-title">Net worth</div><div class="kpi-value">'+usd0(net)+'</div><div class="kpi-delta '+(delta>=0?'up':'down')+'">'+(delta>=0?'↑':'↓')+' '+usd0(Math.abs(delta))+' vs last month</div></div>'+
    '</div>'+
    '<div class="grid grid-2">'+
      '<div class="card card-pad">'+
        '<div class="card-title">Assets</div>'+
        (state.netWorth.assets.length ? state.netWorth.assets.map(assetRow).join('') : '<div class="empty">No assets yet — add one below.</div>')+
        '<div class="divider"></div>'+
        addForm('add-asset', 'Add an asset', [
          {name:'name', ph:'e.g. Checking account, Car, Home', type:'text'},
          {name:'value', ph:'Current value', type:'number'}
        ], 'Add asset')+
      '</div>'+
      '<div class="card card-pad">'+
        '<div class="card-title">Net worth trend</div>'+
        '<div class="chart-wrap" style="height:220px;"><canvas id="chart-networth"></canvas></div>'+
      '</div>'+
    '</div>'+
    '<div class="grid grid-2" style="margin-top:16px;">'+
      '<div class="card card-pad">'+
        '<div class="card-title">From Debt Payoff <span class="faint" style="text-transform:none; font-weight:400;">(synced automatically)</span></div>'+
        (debtLiab.length ? debtLiab.map(function(l){ return '<div class="cat-row" style="grid-template-columns:1fr 150px;"><div class="cat-name">'+esc(l.name)+'</div><div class="cat-edit num">'+usd0(l.value)+'</div></div>'; }).join('') : '<div class="empty">No debts tracked yet.</div>')+
        '<div class="faint" style="margin-top:8px;">Add, edit, or remove these from the <a href="#debt" style="color:var(--ink-soft);">Debt Payoff</a> page — they flow into your net worth automatically.</div>'+
      '</div>'+
      '<div class="card card-pad">'+
        '<div class="card-title">Other liabilities</div>'+
        '<div class="faint" style="margin-bottom:6px;">Anything you owe that isn\'t a formal tracked debt — money borrowed from family, a tab you\'re paying off, etc.</div>'+
        (otherLiab.length ? otherLiab.map(liabRow).join('') : '<div class="empty">None yet.</div>')+
        '<div class="divider"></div>'+
        addForm('add-liability', 'Add a liability', [
          {name:'name', ph:'What you owe', type:'text'},
          {name:'value', ph:'Amount owed', type:'number'}
        ], 'Add liability')+
      '</div>'+
    '</div>'+
  '</div>';
}

/* ============================================================

   said they'll fill in with a real tutorial video later — see the comment above VIDEO_TUTORIAL_URL).
   settingsTab is deliberately NOT persisted — it's just which sub-tab is showing right now, reset to
   "install" every time you leave and come back, same idea as rangeState's mode but view-local.

var settingsTab = 'install';

// Swap this from null to a real embeddable video URL (e.g. an mp4 file link, or a YouTube/Vimeo
// embed URL) once the tutorial video exists — renderInstructionsTab() below picks it up automatically
// and replaces the placeholder box with a real <video> or <iframe>. Nothing else needs to change.
var VIDEO_TUTORIAL_URL = null;

function renderSettings(){

      '<button type="button" data-settingstab="data" class="'+(settingsTab==='data'?'active':'')+'">Data</button>'+
